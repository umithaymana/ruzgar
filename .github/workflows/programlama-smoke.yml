# Programlama motoru — offline SLO + canli API smoke (Faz 18)

name: Programlama Smoke

on:
  push:
    paths:
      - "ilim-assistant/**"
      - "ruzgar-desktop/**"
      - ".github/workflows/programlama-smoke.yml"
  pull_request:
    paths:
      - "ilim-assistant/**"
      - "ruzgar-desktop/**"
      - ".github/workflows/programlama-smoke.yml"
  workflow_dispatch:

jobs:
  smoke-offline-slo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ilim-assistant/requirements.txt

      - name: Install dependencies
        working-directory: ilim-assistant
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Programlama smoke (offline + SLO + Faz 25 parity + upgrade gate)
        working-directory: ilim-assistant
        env:
          RUZGAR_FAZ18: "1"
          RUZGAR_FAZ25: "1"
          RUZGAR_FAZ17_LLM_SUGGEST: "0"
          RUZGAR_SKIP_RAG_WARMUP: "1"
        run: python scripts/programlama_smoke.py --ci --upgrade

  smoke-live-api:
    runs-on: ubuntu-latest
    needs: smoke-offline-slo
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ilim-assistant/requirements.txt

      - name: Install dependencies
        working-directory: ilim-assistant
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Canli API smoke (scaffold, patch, git endpoints)
        working-directory: ilim-assistant
        env:
          RUZGAR_FAZ18: "1"
          RUZGAR_FAZ17_LLM_SUGGEST: "0"
          RUZGAR_SKIP_RAG_WARMUP: "1"
          RUZGAR_DISABLE_GEMINI: "1"
          RUZGAR_DISABLE_GROQ: "1"
          RUZGAR_CI_HEALTH_WAIT: "180"
        run: python scripts/ci_run_live_smoke.py
