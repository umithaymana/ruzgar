<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self' data: blob: https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: data: blob:; worker-src 'self' blob:; frame-src 'self' https://demo.f4map.com https://*.f4map.com;"
  />
  <title>Rüzgar Harita</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="vendor/cesium/Widgets/widgets.css" />
  <style>
    html, body { margin: 0; height: 100%; background: #0b1220; color: #f3e6c4; font-family: "Segoe UI", system-ui, sans-serif; overflow: hidden; }
    #map, #globe, #f4, #panoPanel { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    #globe, #f4, #panoPanel { display: none; }
    #stacCard {
      display: none; position: absolute; right: 10px; top: 10px; z-index: 1100;
      max-width: min(280px, 42vw); padding: 8px 10px; border-radius: 10px;
      background: rgba(8,10,16,0.88); border: 1px solid rgba(212,175,55,0.35);
      font-size: 12px; line-height: 1.35;
    }
    #stacCard.on { display: block; }
    #stacCard img { width: 100%; border-radius: 6px; margin-top: 6px; display: block; }
    #panoPanel {
      box-sizing: border-box; padding: 16px 16px 48px; overflow: auto;
      background:
        radial-gradient(ellipse at 50% 20%, rgba(212,175,55,0.12), transparent 55%),
        #0b1220;
    }
    #panoPanel .pano-head { margin: 0 0 10px; font-size: 1.05rem; font-weight: 650; color: #f3ead2; }
    #panoPanel .pano-note { margin: 0 0 14px; font-size: 0.82rem; line-height: 1.45; color: #cbb892; max-width: 46rem; }
    #panoPanel .pano-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    #panoPanel .pano-actions a, #panoPanel .pano-actions button {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 36px; padding: 0 12px; border-radius: 9px; border: 1px solid rgba(212,175,55,0.45);
      background: rgba(212,175,55,0.18); color: #fff8e8; font-size: 0.8rem; font-weight: 650;
      text-decoration: none; cursor: pointer;
    }
    #panoPanel .pano-actions a.ghost, #panoPanel .pano-actions button.ghost {
      background: rgba(12,14,20,0.7);
    }
    #panoPanel .pano-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 8px;
    }
    #panoPanel .pano-grid a {
      display: block; border-radius: 10px; overflow: hidden;
      border: 1px solid rgba(212,175,55,0.28); background: #121820; color: inherit; text-decoration: none;
    }
    #panoPanel .pano-grid img { width: 100%; height: 110px; object-fit: cover; display: block; background: #1a2230; }
    #panoPanel .pano-grid span { display: block; padding: 6px 8px; font-size: 0.7rem; color: #cbb892; }
    /* Dilim C: walk sırasında küçük gerçek görüntü şeridi (iframe yok) */
    #panoWalkStrip {
      display: none; position: absolute; left: 12px; right: 12px; bottom: 58px; z-index: 1250;
      align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px;
      background: rgba(8, 10, 16, 0.92); border: 1px solid rgba(212, 175, 55, 0.4);
      box-shadow: 0 8px 22px rgba(0,0,0,0.4); color: #f3ead2; font-size: 0.78rem;
    }
    #panoWalkStrip.on { display: flex; }
    #panoWalkStrip img {
      width: 96px; height: 64px; object-fit: cover; border-radius: 8px;
      background: #1a2230; flex: 0 0 auto;
    }
    #panoWalkStrip .pws-body { flex: 1 1 auto; min-width: 0; line-height: 1.35; }
    #panoWalkStrip .pws-title { font-weight: 700; color: #fff8e8; margin: 0 0 2px; }
    #panoWalkStrip .pws-note { margin: 0; color: #cbb892; font-size: 0.72rem; }
    #panoWalkStrip a, #panoWalkStrip button {
      flex: 0 0 auto; padding: 8px 10px; border-radius: 8px;
      border: 1px solid rgba(212,175,55,0.45); background: rgba(212,175,55,0.2);
      color: #fff8e8; text-decoration: none; font-weight: 650; font-size: 0.72rem;
      cursor: pointer; font-family: inherit;
    }
    /* Dilim C: küçük pin = işaret; kare sahneyi DOLDURUR (immersive) */
    #panoWalkPreview {
      display: none; position: absolute; inset: 0; z-index: 1400;
      flex-direction: column; align-items: stretch; justify-content: stretch;
      background: #05070c; box-sizing: border-box;
    }
    #panoWalkPreview.on { display: flex; }
    #panoWalkPreview .pwp-card {
      flex: 1 1 auto; display: flex; flex-direction: column;
      min-height: 0; width: 100%; max-width: none; max-height: none;
      background: #05070c; border: 0; border-radius: 0; padding: 0; color: #f3ead2;
      position: relative;
    }
    #panoWalkPreview img {
      display: block; flex: 1 1 auto; width: 100%; height: 100%;
      min-height: 0; object-fit: cover; background: #0a0e14; border-radius: 0;
    }
    #panoWalkPreview .pwp-hud {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      padding: 10px 12px; background: linear-gradient(transparent, rgba(4,6,10,0.92));
    }
    #panoWalkPreview .pwp-hud .pws-note {
      flex: 1 1 auto; margin: 0; color: #e8dcc0; font-size: 0.78rem; min-width: 140px;
    }
    #panoWalkPreview .pwp-actions {
      display: flex; flex-wrap: wrap; gap: 8px; margin: 0; justify-content: flex-end;
    }
    #panoWalkPreview button, #panoWalkPreview a {
      padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(212,175,55,0.45);
      background: rgba(212,175,55,0.22); color: #fff8e8; font-weight: 650;
      text-decoration: none; cursor: pointer; font-family: inherit; font-size: 0.78rem;
    }
    #badge {
      display: none;
    }
    #mapInfoBar {
      display: none; position: absolute; left: 10px; right: 10px; bottom: 10px; z-index: 1100;
      padding: 8px 12px; border-radius: 10px;
      background: rgba(8, 10, 16, 0.9); border: 1px solid rgba(212, 175, 55, 0.42);
      font-size: 11px; letter-spacing: 0.02em; color: #f3ead2;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      line-height: 1.45;
    }
    #mapInfoBar.on { display: block; }
    #mapInfoBar .mib-row {
      display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline;
    }
    #mapInfoBar .mib-item { white-space: nowrap; }
    #mapInfoBar .mib-k { color: #9a8f72; margin-right: 4px; font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; }
    #mapInfoBar .mib-v { color: #f3ead2; font-weight: 650; }
    #yearBar.on ~ #mapInfoBar.on,
    body.year-on #mapInfoBar.on { bottom: 58px; }
    #lpTerrainStatus {
      margin: 2px 0 6px 22px; font-size: 0.68rem; color: #cbb892; letter-spacing: 0.03em;
    }
    #tourBar {
      display: none; position: absolute; left: 0; right: 0; top: 0; transform: none;
      z-index: 1300; width: 100%; max-width: none; padding: 7px 14px 8px;
      border-radius: 0; background: linear-gradient(180deg, rgba(6,8,14,0.88), rgba(6,8,14,0.55));
      border: 0; border-bottom: 1px solid rgba(212,175,55,0.28); color: #f3ead2;
      box-shadow: none; pointer-events: none;
    }
    #tourBar.on { display: block; }
    #tourBar .tb-strip {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      flex-wrap: wrap; pointer-events: none;
    }
    #tourBar .tb-title {
      font-size: 0.82rem; font-weight: 700; color: #e6c86a; margin: 0;
      letter-spacing: 0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: min(52vw, 520px);
    }
    #tourBar .tb-progress { display: none !important; }
    #tourBar .tb-meta {
      font-size: 0.72rem; color: #d9ceb0; margin: 0; flex: 1 1 auto;
      text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #tourBar .tb-card,
    #tourBar .tb-info { display: none !important; }
    #tourBar .tb-actions { display: none !important; } /* tuş yok — fare + ses */
    /* Temiz sinematik: sahne dolu, yalnız üst şerit */
    body.tour-cinema-on #layerPanel,
    body.tour-cinema-on #mapTools,
    body.tour-cinema-on #stacCard,
    body.tour-cinema-on #yearBar,
    body.tour-cinema-on #panoPanel,
    body.tour-cinema-on #panoWalkStrip,
    body.tour-cinema-on #panoWalkPreview { display: none !important; }
    body.tour-cinema-on #mapInfoBar { display: none !important; }
    body.tour-cinema-on #tourBar {
      padding: 8px 16px;
      background: linear-gradient(180deg, rgba(4,6,12,0.9) 0%, rgba(4,6,12,0.35) 85%, transparent 100%);
      border-bottom-color: rgba(212,175,55,0.22);
    }
    body.tour-cinema-on #tourBar .tb-title { font-size: 0.8rem; }
    body.tour-cinema-on #tourBar .tb-meta { font-size: 0.7rem; color: #e8dcc0; }
    body.tour-cinema-on #badge { display: none !important; }
    body.tour-cinema-on #mapToast { top: auto; bottom: 14px; font-size: 0.7rem; opacity: 0.8; }
    body.tour-cinema-on #globe { cursor: grab; }
    body.tour-cinema-on #globe.is-drag { cursor: grabbing; }
    #mapToast {
      display: none; position: absolute; left: 50%; top: 14px; transform: translateX(-50%);
      z-index: 1400; padding: 8px 14px; border-radius: 999px;
      background: rgba(12,14,20,0.92); border: 1px solid rgba(212,175,55,0.5);
      color: #fff8e8; font-size: 0.78rem; font-weight: 650;
      box-shadow: 0 8px 22px rgba(0,0,0,0.35); pointer-events: none;
      opacity: 0; transition: opacity 0.25s ease;
    }
    #mapToast.on { display: block; opacity: 1; }
    #layerPanel .lp-soon {
      opacity: 0.45; cursor: not-allowed;
    }
    #layerPanel .lp-soon input { pointer-events: none; }
    #layerPanel .lp-tag {
      margin-left: auto; font-size: 0.62rem; letter-spacing: 0.04em; color: #9a8f72;
    }
    /* Uydu detaylarını keskinleştir; vektör üstte kalır */
    #map .leaflet-tile-pane {
      filter: contrast(1.14) saturate(1.1) brightness(1.04);
    }
    #map .leaflet-overlay-pane {
      filter: none;
    }
    #yearBar {
      display: none; position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
      z-index: 1000; width: min(420px, 86vw);
      padding: 8px 12px; border-radius: 12px;
      background: rgba(8, 10, 16, 0.82); border: 1px solid rgba(212, 175, 55, 0.35);
      gap: 8px; align-items: center;
    }
    #yearBar.on { display: flex; }
    #yearBar label { font-size: 11px; opacity: 0.85; white-space: nowrap; }
    #yearBar input { flex: 1; accent-color: #d4af37; }
    #yearBar span { font-size: 12px; min-width: 3.2em; text-align: right; color: #f3e6c4; }
    .leaflet-control-attribution { background: rgba(8,10,16,0.65) !important; color: #cbb892 !important; }
    .leaflet-control-attribution a { color: #e6c86a !important; }
    .cesium-viewer-bottom { display: none !important; }
    #layerPanel {
      display: none; position: absolute; left: 10px; top: 10px; z-index: 1200;
      width: min(200px, 46vw); padding: 10px 10px 8px;
      border-radius: 12px; background: rgba(8,10,16,0.92);
      border: 1px solid rgba(212,175,55,0.4); color: #f3e6c4;
      font-size: 12px; line-height: 1.35; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    #layerPanel.on { display: block; }
    #layerPanel h3 { margin: 0 0 8px; font-size: 0.78rem; letter-spacing: 0.08em; color: #e6c86a; font-weight: 700; }
    #layerPanel .lp-sec { margin: 0 0 6px; font-size: 0.68rem; opacity: 0.7; text-transform: uppercase; letter-spacing: 0.06em; }
    #layerPanel label {
      display: flex; align-items: center; gap: 8px; margin: 0 0 5px;
      cursor: pointer; user-select: none;
    }
    #layerPanel input { accent-color: #d4af37; }
    #layerPanel hr { border: 0; border-top: 1px solid rgba(212,175,55,0.22); margin: 8px 0; }
    #mapTools {
      display: none; position: absolute; left: 10px; bottom: 48px; z-index: 1200;
      max-width: min(92vw, 420px); padding: 6px; border-radius: 12px;
      background: rgba(8,10,16,0.9); border: 1px solid rgba(212,175,55,0.35);
      gap: 4px; flex-wrap: wrap; align-items: center;
    }
    #mapTools.on { display: flex; }
    #mapTools button {
      min-height: 30px; padding: 0 9px; border-radius: 8px;
      border: 1px solid rgba(212,175,55,0.4); background: rgba(12,14,20,0.9);
      color: #f3e6c4; font-size: 0.7rem; font-weight: 700; cursor: pointer;
    }
    #mapTools button.is-on, #mapTools button:hover {
      background: rgba(212,175,55,0.28); color: #fff8e8;
    }
    #measureOut {
      flex: 1 1 100%; min-height: 1.2em; padding: 2px 4px 0;
      font-size: 0.72rem; color: #e6c86a;
    }
    .leaflet-interactive.ruzgar-draw-path { cursor: crosshair; }
  </style>
  <script>
    // Cesium Workers / Assets — yerel vendor (CDN yok)
    window.CESIUM_BASE_URL = "vendor/cesium/";
  </script>
</head>
<body>
  <div id="map"></div>
  <aside id="layerPanel" aria-label="Harita katmanları">
    <h3>Katmanlar</h3>
    <div class="lp-sec">Taban</div>
    <label><input type="radio" name="ruzgarBase" value="esri" checked /> Esri Uydu</label>
    <label><input type="radio" name="ruzgarBase" value="osm" /> OSM</label>
    <label><input type="radio" name="ruzgarBase" value="gibs" /> NASA GIBS</label>
    <hr />
    <div class="lp-sec">Overlay</div>
    <label><input type="checkbox" id="lpBuildings" checked /> Binalar</label>
    <label><input type="checkbox" id="lpRoads" checked /> Yollar</label>
    <label><input type="checkbox" id="lpTerrain" /> Terrain (Arazi)</label>
    <div id="lpTerrainStatus" aria-live="polite">Terrain: Kapalı</div>
    <hr />
    <div class="lp-sec">Yakında</div>
    <label class="lp-soon"><input type="checkbox" disabled /> Parseller <span class="lp-tag">hazır değil</span></label>
    <label><input type="checkbox" id="lpPanoHud" checked /> Pano (Mapillary · walk)</label>
  </aside>
  <div id="panoWalkStrip" aria-live="polite" hidden>
    <img id="panoWalkThumb" alt="" width="96" height="64" />
    <div class="pws-body">
      <p class="pws-title" id="panoWalkTitle">Sokak görüntüsü</p>
      <p class="pws-note" id="panoWalkNote">—</p>
    </div>
    <button type="button" id="panoWalkPrev" title="Önceki kare">◀</button>
    <button type="button" id="panoWalkNext" title="Sonraki kare · yürü">▶</button>
    <button type="button" id="panoWalkOpen" title="Sokak karesini sahneye yay">Sahneyi doldur</button>
  </div>
  <div id="panoWalkPreview" aria-modal="true" role="dialog" hidden>
    <div class="pwp-card">
      <img id="panoWalkPreviewImg" alt="Sokak karesi — sahne dolu" />
      <div class="pwp-hud">
        <p id="panoWalkPreviewNote" class="pws-note"></p>
        <div class="pwp-actions">
          <button type="button" id="panoWalkPreviewPrev">◀ Önceki</button>
          <button type="button" id="panoWalkPreviewNext">Sonraki ▶</button>
          <button type="button" id="panoWalkPreviewClose">Kapat · 3D’ye dön</button>
          <button type="button" id="panoWalkPreviewExt" class="ghost">Dışarıda aç</button>
        </div>
      </div>
    </div>
  </div>
  <!-- H8 gezgin hazırlık stub’ları — kullanıcıya görünmez -->
  <div id="ruzgarHaritaModuleHooks" hidden aria-hidden="true"></div>
  <div id="mapToast" role="status" aria-live="polite"></div>
  <div id="tourBar" aria-label="Dünya Gezgini turu" aria-live="polite">
    <div class="tb-strip">
      <div class="tb-title" id="tourTitle">Dünya Gezgini</div>
      <div class="tb-meta" id="tourMeta">Adres · mesafe</div>
    </div>
    <div class="tb-progress" id="tourProgressWrap" hidden aria-hidden="true">
      <span id="tourProgLabel">%0</span>
      <div class="tb-progress-track" aria-hidden="true"><div class="tb-progress-fill" id="tourProgFill"></div></div>
    </div>
    <div class="tb-card" id="tourCard" hidden aria-hidden="true"></div>

      <button type="button" data-tour-act="pause">Duraklat</button>

    <label for="year">Zaman</label>
    <input id="year" type="range" min="2000" max="2024" step="1" value="2015" />
    <span id="yearVal">2015</span>
  </div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/cesium/Cesium.js"></script>
  <script>
(function () {
  const q = new URLSearchParams(location.search);
  // Tek merkez hedef — 2D ve 3D aynı lat/lon (H4)
  const TARGET = {
    lat: Number(q.get("lat")) || 39.0,
    lon: Number(q.get("lon")) || 35.2,
    tip: String(q.get("tip") || "").toLowerCase(),
    label: String(q.get("label") || "Türkiye"),
    zoom: 0,
    camera: null,
  };
  (function initTargetCamera() {
    const h = Number(q.get("cam_h"));
    const p = Number(q.get("cam_p"));
    const r = Number(q.get("cam_r"));
    if (isFinite(r) && r > 0) {
      TARGET.camera = {
        heading: isFinite(h) ? h : 0,
        pitch: isFinite(p) ? p : -28,
        range_m: r,
        lat: TARGET.lat,
        lon: TARGET.lon,
      };
    }
  })();
  const lat = TARGET.lat;
  const lon = TARGET.lon;
  const TIP_ZOOM = {
    ulke: 7,
    il: 11,
    ilce: 13,
    mahalle: 15,
    dag: 14,
    gecit: 16,
    vadi: 13,
    kanyon: 14,
    nehir: 11,
    bogaz: 14,
    volkan: 14,
    kopru: 17,
    bina: 18,
    nokta: 18,
  };
  const tipQ = String(q.get("tip") || "").toLowerCase();
  let zoom = Number(q.get("zoom"));
  if (!isFinite(zoom) || zoom < 2) {
    zoom = tipQ && TIP_ZOOM[tipQ] != null ? TIP_ZOOM[tipQ] : 7;
  }
  zoom = Math.max(2, Math.min(18, zoom));
  let mode = String(q.get("mode") || "2d").toLowerCase();
  const label = TARGET.label;
  TARGET.tip = tipQ || TARGET.tip;
  TARGET.zoom = zoom;
  const yearDefault = Number(q.get("year")) || 2015;
  const wantFly = q.get("fly") !== "0";
  let bboxParam = null;
  try {
    const rawBb = String(q.get("bbox") || "").split(",").map(Number);
    if (rawBb.length === 4 && rawBb.every(function (n) { return isFinite(n); })) {
      bboxParam = rawBb; // minLon,minLat,maxLon,maxLat
    }
  } catch (_) {}
  // engine=f4 → bilinçli F4map yedek; aksi halde 3d/tur = yerel Cesium
  const forceF4 = String(q.get("engine") || "").toLowerCase() === "f4";
  const sehir = String(q.get("sehir") || "").toLowerCase();
  const wantBina = q.get("bina") === "1" || q.get("buildings") === "1" || !!sehir;
  const era = String(q.get("era") || "simdi").toLowerCase(); // gecmis|simdi|gelecek (Faz 7)
  const wantAjan = q.get("ajan") === "1" || q.get("trafik") === "1"; // Faz 8

  function guessSehirFromCoords(lat, lon) {
    const cities = [
      { k: "istanbul", lat: 41.01, lon: 28.97 },
      { k: "ankara", lat: 39.93, lon: 32.86 },
      { k: "bursa", lat: 40.19, lon: 29.06 },
      { k: "izmir", lat: 38.42, lon: 27.13 },
    ];
    let best = "";
    let bestD = 0.38 * 0.38;
    for (let i = 0; i < cities.length; i++) {
      const c = cities[i];
      const d =
        (Number(lat) - c.lat) * (Number(lat) - c.lat) +
        (Number(lon) - c.lon) * (Number(lon) - c.lon);
      if (d < bestD) {
        bestD = d;
        best = c.k;
      }
    }
    return best;
  }

        try {
          if (ly.getBounds) {

            if (lb && lb.isValid && lb.isValid() && b.intersects(lb)) n += 1;
          } else if (ly.getLatLng && b.contains(ly.getLatLng())) n += 1;
        } catch (_) {}
      });
    } catch (_) {
      return 0;
    }
    return n;

  function makeTerrariumTerrainProvider() {
    // H7.5 KÖK DÜZELTME — Terrarium veri iyi; hata mesh pipeline'da.
    // Cesium HeightmapTerrainData: satır-major KUZEY→GÜNEY, BATI→DOĞU.
    // PNG Terrarium da satır 0 = KUZEY. Y-FLIP YASAK (H5/H7 ters çeviriyordu →
    // tile sınırında km'lik yükseklik kırığı; skirt tavanı 1000 m → siyah yarık).
    // Kenar "yumuşatma" komşu tile kenarlarını bozuyordu → KALDIRILDI.
    // WebMercator x/y = XYZ (y=0 kuzey) = Terrarium URL; tile Y flip yok.
    const W = 129;
    const H = 129;
    const MAX_Z = 15;

    function elevFromRgba(data, srcW, col, row) {
      const p = (row * srcW + col) * 4;
      return data[p] * 256 + data[p + 1] + data[p + 2] / 256 - 32768;
    }

    function sampleBilinear(data, srcW, srcH, x, y) {
      const xc = Math.min(srcW - 1, Math.max(0, x));
      const yc = Math.min(srcH - 1, Math.max(0, y));
      const x0 = Math.floor(xc);
      const y0 = Math.floor(yc);
      const x1 = Math.min(srcW - 1, x0 + 1);
      const y1 = Math.min(srcH - 1, y0 + 1);
      const fx = xc - x0;
      const fy = yc - y0;
      const e00 = elevFromRgba(data, srcW, x0, y0);
      const e10 = elevFromRgba(data, srcW, x1, y0);
      const e01 = elevFromRgba(data, srcW, x0, y1);
      const e11 = elevFromRgba(data, srcW, x1, y1);
      return (
        e00 * (1 - fx) * (1 - fy) +
        e10 * fx * (1 - fy) +
        e01 * (1 - fx) * fy +
        e11 * fx * fy
      );
    }

    function decodeTerrariumPng(img, tileMeta) {
      const srcW = img.naturalWidth || img.width || 256;
      const srcH = img.naturalHeight || img.height || 256;
      if (!srcW || !srcH) {
        terrainDebugStats.empty++;
        if (terrainDebugOn) {
          console.warn("[terrain-debug] empty image", tileMeta);
        }
        return undefined;
      }
      const canvas = document.createElement("canvas");
      canvas.width = srcW;
      canvas.height = srcH;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, 0, 0);
      const data = ctx.getImageData(0, 0, srcW, srcH).data;
      const heights = new Float32Array(W * H);
      // KUZEY→GÜNEY (Cesium + PNG aynı yön) — flip yok
      for (let row = 0; row < H; row++) {
        const v = row / (H - 1);
        const srcY = v * (srcH - 1);
        for (let col = 0; col < W; col++) {
          const u = col / (W - 1);
          const srcX = u * (srcW - 1);
          heights[row * W + col] = sampleBilinear(data, srcW, srcH, srcX, srcY);
        }
      }
      let nanFix = 0;
      let minH = Infinity;
      let maxH = -Infinity;
      for (let i = 0; i < heights.length; i++) {
        let h = heights[i];
        if (!isFinite(h)) {
          heights[i] = 0;
          nanFix++;
          h = 0;
        }
        if (h < minH) minH = h;
        if (h > maxH) maxH = h;
      }
      terrainDebugStats.ok++;
      terrainDebugStats.nanFix += nanFix;
      if (minH < terrainDebugStats.minH) terrainDebugStats.minH = minH;
      if (maxH > terrainDebugStats.maxH) terrainDebugStats.maxH = maxH;
      if (terrainDebugOn && (terrainDebugStats.ok <= 3 || terrainDebugStats.ok % 25 === 0)) {
        console.info("[terrain-debug] tile", tileMeta, {
          src: srcW + "x" + srcH,
          mesh: W + "x" + H,
          minH: Math.round(minH),
          maxH: Math.round(maxH),
          nanFix: nanFix,
          stats: Object.assign({}, terrainDebugStats),
        });
      }
      return heights;
    }

    function fetchTile(x, y, level, attempt) {
      const meta = { x: x, y: y, z: level, attempt: attempt || 0 };
      const url =
        "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/" +
        level +
        "/" +
        x +
        "/" +
        y +
        ".png";
      return Cesium.Resource.fetchImage({ url: url })
        .then(function (img) {
          return decodeTerrariumPng(img, meta);
        })
        .catch(function (err) {
          if ((attempt || 0) < 1) return fetchTile(x, y, level, (attempt || 0) + 1);
          terrainDebugStats.fail++;
          if (terrainDebugOn) {
            console.warn("[terrain-debug] fetch fail", meta, err && err.message);
          }
          return undefined;
        });
    }

    return new Cesium.CustomHeightmapTerrainProvider({
      width: W,
      height: H,
      tilingScheme: new Cesium.WebMercatorTilingScheme(),
      credit: "Mapzen/AWS Terrain Tiles (Terrarium) H7.5",
      callback: function (x, y, level) {
        if (level > MAX_Z) return undefined;
        return fetchTile(x, y, level, 0);
      },
    });
  }

  function applyCesiumSceneQuality(viewer, withTerrain) {
    if (!viewer || !viewer.scene) return;
    const scene = viewer.scene;
    const globe = scene.globe;
    const qp = getHaritaQualityProfile();
    try {
      // H7 + Dilim A: heightmap geometric quality (mobilde biraz gevşek)
      try {
        if (
          Cesium.TerrainProvider &&
          typeof Cesium.TerrainProvider.heightmapTerrainQuality === "number"
        ) {
          Cesium.TerrainProvider.heightmapTerrainQuality = withTerrain
            ? qp.heightmapQuality
            : 0.25;
        }
      } catch (_) {}
      // Dikiş / z-fighting — etekler siyah yarıkları kapatır
      globe.showSkirts = true;
      globe.depthTestAgainstTerrain = !!withTerrain;
      globe.tileCacheSize = withTerrain ? qp.tileCache : Math.min(200, qp.tileCache);
      // Daha düşük SSE = daha yoğun LOD; mobil daha yüksek SSE = daha az RAM/GPU
      globe.maximumScreenSpaceError = withTerrain ? qp.sse : Math.max(2, qp.sse);
      if (globe.preloadSiblings !== undefined) {
        globe.preloadSiblings = !!withTerrain && qp.preloadSiblings;
      }
      if (globe.preloadAncestors !== undefined) globe.preloadAncestors = true;
      if (globe.loadingDescendantLimit !== undefined) {
        globe.loadingDescendantLimit = withTerrain
          ? qp.loadingDescendantLimit
          : 2;
      }
      // Siyah boşluk: imagery gelmeden globe siyah kalmasın (Mescit vadileri)
      try {
        globe.baseColor = Cesium.Color.fromCssColorString(
          withTerrain ? "#243528" : "#0b1220"
        );
      } catch (_) {}
      // CustomHeightmap vertex normal vermez — aşırı lighting = siyah yüzler
      globe.enableLighting = !!withTerrain;
      globe.atmosphereLightIntensity = withTerrain ? 16.0 : 10.0;
      if (globe.lambertDiffuseMultiplier !== undefined) {
        globe.lambertDiffuseMultiplier = withTerrain ? 0.7 : 0.9;
      }
      if (globe.dynamicAtmosphereLighting !== undefined) {
        globe.dynamicAtmosphereLighting = !!withTerrain;
      }
      if (globe.lightingFadeInDistance !== undefined) {
        globe.lightingFadeInDistance = withTerrain ? 5.0e6 : 9.0e6;
        globe.lightingFadeOutDistance = withTerrain ? 1.5e7 : 2.0e7;
      }
      // H7.5: exaggeration=1 — abartı LOD dikişlerini ve «katman ayrılması»nı büyütüyordu
      if (typeof globe.terrainExaggeration === "number" || "terrainExaggeration" in globe) {
        globe.terrainExaggeration = 1.0;
      }
      if (scene.skyAtmosphere) {
        scene.skyAtmosphere.show = true;
        try {
          scene.skyAtmosphere.hueShift = withTerrain ? -0.02 : 0;
          scene.skyAtmosphere.saturationShift = withTerrain ? 0.06 : 0;
          scene.skyAtmosphere.brightnessShift = withTerrain ? 0.08 : 0;
        } catch (_) {}
      }
      if (scene.sun) scene.sun.show = true;
      if (scene.fog) {
        scene.fog.enabled = true;
        scene.fog.density = withTerrain ? qp.fogDensity : 0.0004;
        scene.fog.minimumBrightness = withTerrain ? 0.06 : 0.03;
      }
      // Logarithmic depth → yakın/uzak clipping artefaktını azaltır
      scene.logarithmicDepthBuffer = true;
      if (scene.highDynamicRange !== undefined) scene.highDynamicRange = false;
      try {
        if (scene.postProcessStages && scene.postProcessStages.fxaa) {
          scene.postProcessStages.fxaa.enabled = !!qp.fxaa;
        }
      } catch (_) {}
      // Uydu katmanı — relief üstünde daha okunur (Dilim A profil)
      try {
        const im = viewer.imageryLayers && viewer.imageryLayers.get(0);
        if (im) {
          im.brightness = withTerrain ? qp.brightness : 1.0;
          im.contrast = withTerrain ? qp.contrast : 1.0;
          im.saturation = withTerrain ? qp.saturation : 1.0;
          im.gamma = withTerrain ? qp.gamma : 1.0;
          im.maximumAnisotropy = qp.anisotropy;
        }
      } catch (_) {}
      // Kamera clipping / zoom sınırları
      const ctrl = scene.screenSpaceCameraController;
      if (ctrl) {
        ctrl.minimumZoomDistance = withTerrain ? 60 : 50;
        ctrl.maximumZoomDistance = 40000000;
        ctrl.enableCollisionDetection = !!withTerrain;

      try {
        viewer.camera.frustum.near = withTerrain ? 1.0 : 0.5;

      // Terrain yüklenirken sürekli çiz (siyah kare/çizgi kalıntısı olmasın)
      scene.requestRenderMode = !withTerrain;
      if (withTerrain) scene.requestRender();
      try {
        window.__RUZGAR_HARITA_QOS__ = qp;
      } catch (_) {}
    } catch (e) {
      console.warn("scene quality", e);
    }
  }

  function cameraRigEye() {

  function cameraRigCloseStreetOverlay(preset) {

  function cameraRigAnchorLatLon() {
    // Mod kilidi = geocode/tur MERKEZİ (adres). Waypoint sinema yolu denize kaçabiliyor — kullanma.
    try {
      if (
        tourState.centerLat != null &&
        tourState.centerLon != null &&
        isFinite(Number(tourState.centerLat)) &&
        isFinite(Number(tourState.centerLon)) &&
        !(
          Number(tourState.centerLat) === 0 && Number(tourState.centerLon) === 0
        )
      ) {
        return {
          lat: Number(tourState.centerLat),
          lon: Number(tourState.centerLon),
        };
      }
    } catch (_) {}
    const tLat = Number(TARGET.lat);
    const tLon = Number(TARGET.lon);
    if (isFinite(tLat) && isFinite(tLon)) return { lat: tLat, lon: tLon };
    return { lat: 39, lon: 35.2 };
  }

  function walkSyncEyeHeight(opts) {
    const viewer = liveCesiumViewer;
    if (!viewer || typeof Cesium === "undefined") return;
    const o = opts || {};
    try {
      viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
      let lat;
      let lon;
      if (o.lockAnchor) {
        const a = cameraRigAnchorLatLon();
        lat = a.lat;
        lon = a.lon;
      } else {
        const carto = Cesium.Cartographic.fromCartesian(viewer.camera.position);
        lat = Cesium.Math.toDegrees(carto.latitude);
        lon = Cesium.Math.toDegrees(carto.longitude);
      }
      if (!isFinite(lat) || !isFinite(lon)) {
        const a = cameraRigAnchorLatLon();
        lat = a.lat;
        lon = a.lon;
      }
      let ground = 0;
      try {
        ground = Number(resolveLookHeight(lon, lat)) || 0;
      } catch (_) {
        ground = 0;
      }
      const eye = Math.max(0.8, cameraRigEye());
      const pitchDeg =
        cameraRig.pitch_deg != null && isFinite(Number(cameraRig.pitch_deg))
          ? Number(cameraRig.pitch_deg)
          : -8;
      let hdg = viewer.camera.heading;
      if (o.lockAnchor && o.heading != null && isFinite(Number(o.heading))) {
        hdg = Cesium.Math.toRadians(Number(o.heading));
      }
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(lon, lat, ground + eye),
        orientation: {
          heading: hdg,
          pitch: Cesium.Math.toRadians(pitchDeg),
          roll: 0,
        },
      });
      tourState.liveRangeM = eye;
      tourState.forceRangeM = eye;
      if (o.lockAnchor) {
        TARGET.lat = lat;
        TARGET.lon = lon;
      }
    } catch (e) {
      console.warn("walkSyncEyeHeight", e);
    }
  }

  function cameraRigApplyPreset(preset, soft) {
    if (!preset) return;
    const from = {
      eye_m: Number(cameraRig.eye_m) || WALK_EYE_M,
      speed_mps: Number(cameraRig.speed_mps) || 1.4,
      turn_dps: Number(cameraRig.turn_dps) || 40,
      pitch_deg: cameraRig.pitch_deg != null ? Number(cameraRig.pitch_deg) : -8,
    };
    cameraRig.mode = preset.id;
    cameraRig.domain = preset.domain || "earth";
    if (preset.body) cameraRig.body = preset.body;
    const toEye = preset.eye_m != null ? Number(preset.eye_m) : from.eye_m;
    const toSpd = preset.speed_mps != null ? Number(preset.speed_mps) : from.speed_mps;
    const toTurn = preset.turn_dps != null ? Number(preset.turn_dps) : from.turn_dps;
    const toPitch = preset.pitch_deg != null ? Number(preset.pitch_deg) : from.pitch_deg;
    cameraRig.collision = !!preset.collision;
    cameraRig.pano_auto = !!preset.pano_auto;
    if (soft) {
      cameraRig.eye_m = from.eye_m;
      cameraRig.speed_mps = from.speed_mps;
      cameraRig.turn_dps = from.turn_dps;
      cameraRig.pitch_deg = from.pitch_deg;
      cameraRig._blend = {
        t0: Date.now(),
        dur: cameraRig.blendMs || 750,
        from: from,
        to: { eye_m: toEye, speed_mps: toSpd, turn_dps: toTurn, pitch_deg: toPitch },
      };
    } else {
      cameraRig._blend = null;
      cameraRig.eye_m = toEye;
      cameraRig.speed_mps = toSpd;
      cameraRig.turn_dps = toTurn;
      cameraRig.pitch_deg = toPitch;
    }
  }

  function cameraRigTickBlend() {
    const b = cameraRig._blend;
    if (!b) return false;
    const u = Math.min(1, (Date.now() - b.t0) / Math.max(1, b.dur));
    const ease = u * u * (3 - 2 * u);
    function lerp(a, b0) {
      if (a == null || b0 == null || !isFinite(a) || !isFinite(b0)) return b0 != null ? b0 : a;
      return a + (b0 - a) * ease;
    }
    cameraRig.eye_m = lerp(b.from.eye_m, b.to.eye_m);
    cameraRig.speed_mps = lerp(b.from.speed_mps, b.to.speed_mps);
    cameraRig.turn_dps = lerp(b.from.turn_dps, b.to.turn_dps);
    cameraRig.pitch_deg = lerp(b.from.pitch_deg, b.to.pitch_deg);
    if (u >= 1) cameraRig._blend = null;
    return true;
  }

  function setCameraBody(bodyId, toast) {
    const b = String(bodyId || "earth").toLowerCase();
    const prev = cameraRig.body;
    cameraRig.body = b;
    if (b === "earth") {
      cameraRig.domain = "earth";
      // Yumuşak dönüş: yüksek bakıştan mevcut globe'a
      try {
        const viewer = liveCesiumViewer;
        if (viewer && typeof Cesium !== "undefined" && prev && prev !== "earth") {
          viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(TARGET.lon, TARGET.lat, 2.5e6),
            orientation: {
              heading: viewer.camera.heading,
              pitch: Cesium.Math.toRadians(-35),
              roll: 0,
            },
            duration: (cameraRig.blendMs || 750) / 1000,
          });
        }
      } catch (_) {}
      showToast(toast || "Dünya · mevcut Cesium sahne");
      return true;
    }
    // Ay/Mars/Uzay tiles: Ion hesap + asset gerekir — bozmadan dürüst dur
    // Soft: yine de mevcut globe'da uzak bakışa çek (sert kesme yok)
    try {
      const viewer = liveCesiumViewer;
      if (viewer && typeof Cesium !== "undefined") {
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(TARGET.lon, TARGET.lat, 8.0e6),
          orientation: {
            heading: viewer.camera.heading,
            pitch: Cesium.Math.toRadians(-45),

          : b === "mars"
            ? "Mars: Cesium Ion Mars hesabı/asset bekleniyor"
            : "Uzay: derin uzay sahnesi · Ion/Trek bekleniyor")
    );
    return false;

  function cameraRigFlyHighLook(preset) {
    if (walkState.on) exitWalkMode("");
    try {
      const viewer = liveCesiumViewer;
      if (viewer && typeof Cesium !== "undefined") {
        const h = Number(preset.eye_m) || 800000;
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(TARGET.lon, TARGET.lat, h),

  function setCameraMode(modeId, opts) {
    const o = opts || {};
    const preset = CAMERA_PRESETS[modeId];
    if (!preset) {
      showToast("Bilinmeyen kamera modu");
      return false;
    }
    cameraRigCloseStreetOverlay(preset);
    if (preset.domain === "space") {
      cameraRigApplyPreset(preset, o.soft !== false);
      // Dünya yörünge / uydu: mevcut Cesium globe (hesap yok)
      if (modeId === "yorunge" || modeId === "uydu" || preset.body === "earth") {
        cameraRigFlyHighLook(preset);
        showToast((preset.label || modeId) + " · Dünya yörünge bakışı");
        return true;
      }
      // Ay / Mars / kokpit / serbest uzay: Ion veya Trek tiles gerekir
      setCameraBody(preset.body || "space");
      showToast(preset.label + " · uzay veri/hesap bekleniyor");
      return true;
    }
    cameraRigApplyPreset(preset, o.soft !== false);
    if (preset.kind === "cinema" || preset.tour_auto) {
      if (walkState.on) exitWalkMode("");
      if (tourState.active) {
        tourState.paused = false;
        tourState.auto = true;
        tourState.lastTs = 0;
        tourRefreshCameraNow();
      } else {
        walkEnsureTour();
        if (tourState.active) {
          tourState.paused = false;
          tourState.auto = true;
        }
      }
      showToast(o.toast || (preset.label + " kamera"));
      return true;
    }
    // ground/air/free → walk tick + preset
    if (!walkState.on) enterWalkMode("");
    walkState.speedMps = Number(cameraRig.speed_mps) || walkState.speedMps;
    walkState.panoAuto = !!preset.pano_auto;
    try {
      const viewer = liveCesiumViewer;
      if (viewer) {
        const ctrl = viewer.scene.screenSpaceCameraController;
        if (ctrl) ctrl.enableCollisionDetection = !!preset.collision;
      }
    } catch (_) {}
    // Soft değilse hedef göze hemen; soft ise blend kareleri walkSyncEyeHeight ile taşır
    if (!cameraRig._blend) {
      cameraRig.eye_m = preset.eye_m != null ? Number(preset.eye_m) : cameraRig.eye_m;
      cameraRig.pitch_deg =
        preset.pitch_deg != null ? Number(preset.pitch_deg) : cameraRig.pitch_deg;
    }
    // Mod değişimi: sohbetteki / tur adrese kilitle (boş denize kayma yok)
    walkSyncEyeHeight({ lockAnchor: true });
    walkEnsureBuildings(true);
    const spdShow = cameraRig._blend
      ? Number(cameraRig._blend.to.speed_mps)
      : Number(cameraRig.speed_mps);
    const eyeShow = cameraRig._blend
      ? Number(cameraRig._blend.to.eye_m)
      : Number(cameraRig.eye_m);
    const anc = cameraRigAnchorLatLon();
    showToast(
      o.toast ||
        (preset.label +
          " · " +
          (isFinite(spdShow) ? spdShow.toFixed(1) : "?") +
          " m/s · " +
          (isFinite(eyeShow) ? Math.round(eyeShow) : "?") +
          " m · " +
          anc.lat.toFixed(4) +
          "," +
          anc.lon.toFixed(4))
    );
    return true;
  }


  const walkState = {

    labelsTs: 0,

    agents: [],

  function walkEnsureTour() {
    if (tourState.active) return true;
    if (!liveCesiumViewer) {
      showToast("Önce 3D haritayı aç");
      return false;
    }
    const pack = buildLocalTourPayload(
      tourState.label || label || "Gezi",
      tipQ || TARGET.tip || "sehir",
      TARGET.lat,
      TARGET.lon,
      { bearing0: 35, count: 24 }
    );
    if (pack) startTourWithPayload(pack);
    return !!tourState.active;
  }

  function walkPlaceEye() {
    walkSyncEyeHeight({ lockAnchor: true });
  }

  function walkClampHeight() {
    const viewer = liveCesiumViewer;
    if (!viewer || typeof Cesium === "undefined") return;
    // Soft geçişte hedef göze + adrese kilitle — yere gömülme / drone yükselmeme olmasın
    if (cameraRig._blend) {
      walkSyncEyeHeight({ lockAnchor: true });
      return;
    }
    try {
      const carto = Cesium.Cartographic.fromCartesian(viewer.camera.position);
      const lon = Cesium.Math.toDegrees(carto.longitude);
      const lat = Cesium.Math.toDegrees(carto.latitude);
      let ground = 0;
      try {
        ground = Number(resolveLookHeight(lon, lat)) || 0;
      } catch (_) {}
      const eye = Math.max(1.5, cameraRigEye());
      // Terrain 0 gelirse bile gömülme: en az ground+1.5
      const minH = ground + 1.5;
      const maxH = ground + Math.max(140, eye + 40);
      let h = carto.height;
      // Yere gömüldüyse veya hedeften çok saptıysa göze çek
      if (h < minH || Math.abs(h - (ground + eye)) > Math.max(12, eye * 0.85)) {
        h = ground + eye;
      }
      if (h > maxH) h = maxH;
      if (Math.abs(h - carto.height) > 0.05) {
        const pitchDeg =
          cameraRig.pitch_deg != null && isFinite(Number(cameraRig.pitch_deg))
            ? Number(cameraRig.pitch_deg)
            : Cesium.Math.toDegrees(viewer.camera.pitch);
        viewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(lon, lat, h),
          orientation: {
            heading: viewer.camera.heading,
            pitch: Cesium.Math.toRadians(pitchDeg),
            roll: 0,
          },
        });
      }
      tourState.liveRangeM = Math.max(0.5, h - ground);
      walkPushBuildings(lon, lat);
    } catch (_) {}
  }

  function walkPushBuildings(lon, lat) {
    const fps = walkState.footprints;
    if (!fps || !fps.length || !liveCesiumViewer) return;
    for (let i = 0; i < fps.length; i++) {
      const f = fps[i];
      if (lon > f.minLon && lon < f.maxLon && lat > f.minLat && lat < f.maxLat) {
        const cx = (f.minLon + f.maxLon) * 0.5;
        const cy = (f.minLat + f.maxLat) * 0.5;
        const dx = lon - cx;
        const dy = lat - cy;
        const push = 0.00012;
        const nx = lon + (dx >= 0 ? push : -push);
        const ny = lat + (dy >= 0 ? push : -push);
        try {
          const ground = Number(resolveLookHeight(nx, ny)) || 0;
          liveCesiumViewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(nx, ny, ground + cameraRigEye()),
            orientation: {
              heading: liveCesiumViewer.camera.heading,
              pitch: liveCesiumViewer.camera.pitch,
              roll: 0,
            },
          });
        } catch (_) {}
        break;
      }
    }
  }

  function walkTickFrame(ts) {
    if (!walkState.on || !liveCesiumViewer) {
      walkState.removeTick = null;
      return;
    }
    const blending = cameraRigTickBlend();
    walkState.speedMps = cameraRig.speed_mps || walkState.speedMps;
    if (blending) walkSyncEyeHeight({ lockAnchor: true });
    const last = walkState._lastTs || ts;
    const dt = Math.min(0.05, Math.max(0.001, (ts - last) / 1000));
    walkState._lastTs = ts;
    const viewer = liveCesiumViewer;
    const cam = viewer.camera;
    const turn = Number(cameraRig.turn_dps) || 40;
    const spd =
      (cameraRig.speed_mps || walkState.speedMps || 1.4) *
      Math.max(0.25, Number(tourState.speed) || 0.4) *
      8 *
      dt;
    const k = walkState.keys;
    const seriesWalk =
      walkState.panoFillOn &&
      Array.isArray(walkState.panoSeries) &&
      walkState.panoSeries.length > 1;
    try {
      // Seri pano olsa da WASD dünya hareketi — yalnızca kare adımı yetmez
      if (k.KeyW || k.ArrowUp) cam.moveForward(spd);
      if (k.KeyS || k.ArrowDown) cam.moveBackward(spd);
      if (k.KeyA) cam.moveLeft(spd);
      if (k.KeyD) cam.moveRight(spd);
      if (k.ArrowLeft) cam.lookLeft(Cesium.Math.toRadians(turn * dt));
      if (k.ArrowRight) cam.lookRight(Cesium.Math.toRadians(turn * dt));
      if (k.KeyQ || k.PageDown) cam.moveDown(spd * 0.55);
      if (k.KeyE || k.PageUp) cam.moveUp(spd * 0.55);
      if (seriesWalk) {
        const now = Date.now();
        if (
          (k.KeyW || k.ArrowUp) &&
          now - (walkState.panoSeriesStepTs || 0) > 420
        ) {
          walkState.panoSeriesStepTs = now;
          panoSeriesStep(1);
        } else if (
          (k.KeyS || k.ArrowDown) &&
          now - (walkState.panoSeriesStepTs || 0) > 420
        ) {
          walkState.panoSeriesStepTs = now;
          panoSeriesStep(-1);
        }
      }
    } catch (_) {}
    if (!seriesWalk) walkClampHeight();
    if (walkState.labelsOn) walkRefreshLabels(false);
    // Dilim B: yürürken dilim kayınca binaları yenile (~2 sn)
    walkState._binaTick = (walkState._binaTick || 0) + 1;
    if (!walkState.buildingsBusy && walkState._binaTick % 120 === 0) {
      walkEnsureBuildings(false);
    }
    // Dilim C+: seri varken sık yenileme yok; uzaklaşınca / force ile
    if (
      walkState.panoAuto &&
      !walkState.panoBusy &&
      walkState._binaTick % 240 === 0 &&
      !(walkState.panoSeries && walkState.panoSeries.length)
    ) {
      walkLoadPanoHud(false);
    }
    walkAnimateAgents(dt);
    walkState.removeTick = requestAnimationFrame(walkTickFrame);
  }

  function walkWireKeys() {
    if (walkState.keyWired) return;
    walkState.keyWired = true;
    window.addEventListener("keydown", function (ev) {
      if (!walkState.on) return;
      const t = ev.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
      walkState.keys[ev.code] = true;
      if (
        ev.code === "KeyW" ||
        ev.code === "KeyA" ||
        ev.code === "KeyS" ||
        ev.code === "KeyD" ||
        ev.code === "ArrowUp" ||
        ev.code === "ArrowDown" ||
        ev.code === "ArrowLeft" ||
        ev.code === "ArrowRight"
      ) {
        ev.preventDefault();
      }
    });
    window.addEventListener("keyup", function (ev) {
      walkState.keys[ev.code] = false;
    });
  }

  function enterWalkMode(toast) {
    if (!walkEnsureTour()) return;
    const viewer = liveCesiumViewer;
    if (!viewer) return;
    tourState.paused = true;
    tourState.auto = false;
    walkState.on = true;
    focusOrbit.locked = false;
    try {
      if (liveCesiumViewer)
        liveCesiumViewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
    } catch (_) {}
    if (!CAMERA_PRESETS[cameraRig.mode] || CAMERA_PRESETS[cameraRig.mode].kind === "cinema") {
      cameraRigApplyPreset(CAMERA_PRESETS.yuruyus, false);
    }
    walkState.speedMps = cameraRig.speed_mps || 1.4;
    walkWireKeys();
    try {
      const ctrl = viewer.scene.screenSpaceCameraController;
      if (ctrl) {
        ctrl.minimumZoomDistance = 0.4;
        ctrl.enableCollisionDetection = !!cameraRig.collision;
      }
      viewer.scene.requestRenderMode = false;
    } catch (_) {}
    walkPlaceEye();
    if (!walkState.removeTick) {
      walkState._lastTs = 0;
      walkState.removeTick = requestAnimationFrame(walkTickFrame);
    }
    walkRefreshLabels(true);
    spawnSimTraffic(viewer, false);
    walkEnsureBuildings();
    // Dilim C: walk’a girince Mapillary — CameraRig pano_auto
    try {
      const panoEl = document.getElementById("lpPanoHud");
      walkState.panoAuto =
        cameraRig.pano_auto && (!panoEl || !!panoEl.checked);
    } catch (_) {
      walkState.panoAuto = !!cameraRig.pano_auto;
    }
    walkState.panoUserClosed = false;
    walkState._panoRetriedTarget = false;
    if (walkState.panoAuto) walkLoadPanoHud(true);
    updateTourProgress();
    showToast(toast || "Göz hizası · WASD + Q/E");
  }

  function exitWalkMode(toast) {
    walkState.on = false;
    walkState.keys = Object.create(null);
    walkState.panoUserClosed = false;
    walkState.panoSeries = [];
    walkState.panoSeriesIndex = 0;
    walkState.panoSeriesId = "";
    setPanoWalkStrip(false);
    if (walkState.removeTick) {
      try {
        cancelAnimationFrame(walkState.removeTick);
      } catch (_) {}
      walkState.removeTick = null;
    }
    const viewer = liveCesiumViewer;
    if (viewer) {
      try {
        const ctrl = viewer.scene.screenSpaceCameraController;
        if (ctrl) ctrl.minimumZoomDistance = 50;
      } catch (_) {}
    }
    tourState.forceRangeM = null;
    tourState.rangeMult = 1;
    if (tourState.active) {
      tourState.paused = false;
      tourState.auto = true;
      tourState.lastTs = 0;
      tourRefreshCameraNow();
    }
    showToast(toast || "Kuş bakışı");
  }

  function ensureFreePilot(toast) {
    if (!walkState.on) enterWalkMode(toast || "Serbest pilot · göz hizası");
    return !!(walkState.on && liveCesiumViewer);
  }

  function walkStrafe(dir) {
    if (!ensureFreePilot()) return;
    const viewer = liveCesiumViewer;
    const step = walkState.speedMps * Math.max(0.4, Number(tourState.speed) || 0.4) * 6;
    try {
      if (dir < 0) viewer.camera.moveLeft(step);
      else viewer.camera.moveRight(step);
    } catch (_) {}
    walkClampHeight();
    showToast(dir < 0 ? "Sola" : "Sağa");
  }

  function walkStepForward(back) {
    if (!ensureFreePilot()) return;
    const viewer = liveCesiumViewer;
    const step = walkState.speedMps * Math.max(0.4, Number(tourState.speed) || 0.4) * 8;
    try {
      if (back) viewer.camera.moveBackward(step);
      else viewer.camera.moveForward(step);
    } catch (_) {}
    walkClampHeight();
    showToast(back ? "Geri" : "İleri");
  }

  function walkLookTurn(dir) {
    if (!ensureFreePilot()) return;
    try {
      const ang = Cesium.Math.toRadians(30);
      if (dir < 0) liveCesiumViewer.camera.lookLeft(ang);
      else liveCesiumViewer.camera.lookRight(ang);
    } catch (_) {}
    showToast(dir < 0 ? "Sola dönüldü" : "Sağa dönüldü");
  }

  function walkVertical(dir) {
    if (!ensureFreePilot()) return;
    const step = walkState.speedMps * Math.max(0.4, Number(tourState.speed) || 0.4) * 3.2;
    try {
      if (dir < 0) liveCesiumViewer.camera.moveDown(step);
      else liveCesiumViewer.camera.moveUp(step);
    } catch (_) {}
    walkClampHeight();
    if (dir > 0 && tourState.liveRangeM > 48) {
      exitWalkMode("Yükseldi · kuş bakışı");
      return;
    }
    showToast(
      (dir < 0 ? "Alçaldı · " : "Yükseldi · ") + formatAltitude(tourState.liveRangeM)
    );
  }

  function walkClearLabels() {
    const viewer = liveCesiumViewer;
    if (!viewer) return;
    (walkState.labelIds || []).forEach(function (id) {
      try {
        viewer.entities.removeById(id);
      } catch (_) {}
    });
    walkState.labelIds = [];
  }

  function walkRefreshLabels(force) {
    const viewer = liveCesiumViewer;
    if (!viewer || !walkState.labelsOn) return;
    const now = Date.now();
    const qp = getHaritaQualityProfile();
    if (!force && now - (walkState.labelsTs || 0) < (qp.mobil ? 3200 : 2000)) {
      return;
    }
    walkState.labelsTs = now;
    const root = apiRoot();
    if (!root) return;
    let lat = TARGET.lat;
    let lon = TARGET.lon;
    try {
      const c = Cesium.Cartographic.fromCartesian(viewer.camera.position);
      lat = Cesium.Math.toDegrees(c.latitude);
      lon = Cesium.Math.toDegrees(c.longitude);
    } catch (_) {}
    const nLab = qp.mobil ? 10 : 18;
    const maxDeg = qp.mobil ? 0.02 : 0.028;
    fetch(
      root +
        "/api/sahne/osm/tr/nearest?lat=" +
        encodeURIComponent(lat) +
        "&lon=" +
        encodeURIComponent(lon) +
        "&n=" +
        nLab +
        "&max_deg=" +
        maxDeg
    )
      .then(function (r) {
        return r.json();
      })
      .then(function (data) {
        if (!data || !data.ok) return;
        walkClearLabels();
        const items = data.items || [];
        items.forEach(function (it, idx) {
          if (it.lat == null || it.lon == null || !it.name) return;
          const id = "osm-lab-" + idx + "-" + String(it.name).slice(0, 12);
          try {
            viewer.entities.add({
              id: id,
              position: Cesium.Cartesian3.fromDegrees(
                Number(it.lon),
                Number(it.lat),
                WALK_EYE_M + 2
              ),
              label: {
                text: String(it.name),
                font: "bold 13px Segoe UI, sans-serif",
                fillColor: Cesium.Color.fromCssColorString("#fff8e8"),
                outlineColor: Cesium.Color.BLACK,
                outlineWidth: 3,
                style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                pixelOffset: new Cesium.Cartesian2(0, -8),
                disableDepthTestDistance: Number.POSITIVE_INFINITY,
                scaleByDistance: new Cesium.NearFarScalar(40, 1.1, 900, 0.35),
              },
            });
            walkState.labelIds.push(id);
          } catch (_) {}
        });
        if (items[0] && items[0].name) {
          setTourInfo(
            tourState.label || "Dünya Gezgini",
            items[0].name +
              (items[0].kind === "places" ? " · mahalle" : " · sokak")
          );
        }
      })
      .catch(function () {});
  }

  function walkAnimateAgents(dt) {
    const viewer = liveCesiumViewer;
    if (!viewer || !walkState.agents.length) return;
    walkState.agents.forEach(function (a) {
      a.t = (a.t || 0) + dt * a.spd;
      if (a.t > 1) a.t = 0;
      const lat = a.lat0 + Math.sin(a.t * Math.PI * 2) * a.ampLat;
      const lon = a.lon0 + Math.cos(a.t * Math.PI * 2) * a.ampLon;
      try {
        a.ent.position = Cesium.Cartesian3.fromDegrees(lon, lat, a.alt);
      } catch (_) {}
    });
  }

  function walkEnsureBuildings(force) {
    if (!liveCesiumViewer) return;
    const city = guessSehirFromLabel();
    if (!city) return;
    let lat = TARGET.lat;
    let lon = TARGET.lon;
    try {
      const c = Cesium.Cartographic.fromCartesian(
        liveCesiumViewer.camera.position
      );
      lat = Cesium.Math.toDegrees(c.latitude);
      lon = Cesium.Math.toDegrees(c.longitude);
    } catch (_) {}
    const now = Date.now();
    const moved =
      Math.abs(lat - (walkState.buildingsLat || 0)) > 0.018 ||
      Math.abs(lon - (walkState.buildingsLon || 0)) > 0.018;
    if (
      !force &&
      walkState.buildingsCity === city &&
      walkState.footprints &&
      walkState.footprints.length &&
      !moved &&
      now - (walkState.buildingsTs || 0) < 50000
    ) {
      return;
    }
    try {
      loadBuildings(liveCesiumViewer, true);
    } catch (_) {}
  }

  function spawnSimTraffic(viewer, force) {
    if (!viewer || typeof Cesium === "undefined") return;
    if (walkState.agents.length && !force) return;
    walkState.agents.forEach(function (a) {
      try {
        viewer.entities.remove(a.ent);
      } catch (_) {}
    });
    walkState.agents = [];
    let baseLat = TARGET.lat;
    let baseLon = TARGET.lon;
    try {
      const c = Cesium.Cartographic.fromCartesian(viewer.camera.position);
      baseLat = Cesium.Math.toDegrees(c.latitude);
      baseLon = Cesium.Math.toDegrees(c.longitude);
    } catch (_) {}
    const tip = String(tourState.steerMode || tourState.tip || tipQ || "").toLowerCase();
    const nearWater = /nehir|irmak|gol|deniz|bogaz|ada|kiyi|sahil/.test(tip);
    const kinds = nearWater
      ? [
          { tip: "gemi", color: "#4aa3ff", alt: 0.8, amp: 0.0022 },
          { tip: "kayik", color: "#9ad0ff", alt: 0.5, amp: 0.0016 },
          { tip: "gemi", color: "#2f80c0", alt: 0.9, amp: 0.0028 },
          { tip: "kayik", color: "#7ec8ff", alt: 0.45, amp: 0.0012 },
          { tip: "araba", color: "#37d4a0", alt: 1.2, amp: 0.0008 },
          { tip: "araba", color: "#e6c86a", alt: 1.2, amp: 0.0007 },
        ]
      : [
          { tip: "araba", color: "#37d4a0", alt: 1.2, amp: 0.0012 },
          { tip: "araba", color: "#5bc0ff", alt: 1.2, amp: 0.0015 },
          { tip: "araba", color: "#e6c86a", alt: 1.2, amp: 0.0009 },
          { tip: "araba", color: "#f08a5d", alt: 1.2, amp: 0.0011 },
          { tip: "kayik", color: "#9ad0ff", alt: 0.5, amp: 0.0014 },
          { tip: "gemi", color: "#4aa3ff", alt: 0.8, amp: 0.0018 },
        ];
    kinds.forEach(function (k, i) {
      const lat0 = baseLat + (Math.random() - 0.5) * 0.008;
      const lon0 = baseLon + (Math.random() - 0.5) * 0.008;
      try {
        const ent = viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(lon0, lat0, k.alt),
          point: {
            pixelSize: k.tip === "araba" ? 9 : 11,
            color: Cesium.Color.fromCssColorString(k.color),
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 1,
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
          },
          label: {
            text: k.tip,
            font: "11px sans-serif",
            fillColor: Cesium.Color.WHITE,
            showBackground: true,
            backgroundColor: Cesium.Color.fromCssColorString("#0b1220").withAlpha(0.7),
            pixelOffset: new Cesium.Cartesian2(0, -16),
            disableDepthTestDistance: Number.POSITIVE_INFINITY,
          },
        });
        walkState.agents.push({
          ent: ent,
          tip: k.tip,
          lat0: lat0,
          lon0: lon0,
          ampLat: k.amp * (0.4 + Math.random()),
          ampLon: k.amp * (0.4 + Math.random()),
          alt: k.alt,
          spd: 0.04 + Math.random() * 0.06,
          t: Math.random(),
        });
      } catch (_) {}
    });
    showToast("Trafik sim · araba/gemi");
  }

  function openExternalSafe(url) {
    const u = String(url || "");
    if (!/^https?:\/\//i.test(u)) return;
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "ruzgar-open-external", url: u }, "*");
        return;
      }
    } catch (_) {}
    try {
      window.open(u, "_blank", "noopener,noreferrer");
    } catch (_) {}
  }

  function panoFillSrc(im) {
    if (!im) return "";
    return String(im.thumb_lg || im.thumb || "");
  }

  function panoSeriesLabel(idx) {
    const n = (walkState.panoSeries || []).length;
    const place = walkState.panoPlaceLabel || label || "konum";
    if (!n) return place;
    const i = Math.max(0, Math.min(n - 1, idx | 0));
    return place + " · " + (i + 1) + "/" + n;
  }

  function panoSyncCameraToImage(im) {
    const viewer = liveCesiumViewer;
    if (!viewer || !im || im.lat == null || im.lon == null) return;
    if (typeof Cesium === "undefined") return;
    try {
      const ground = Number(resolveLookHeight(Number(im.lon), Number(im.lat))) || 0;
      const heading =
        im.compass != null && isFinite(Number(im.compass))
          ? Cesium.Math.toRadians(Number(im.compass))
          : viewer.camera.heading;
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(
          Number(im.lon),
          Number(im.lat),
          ground + cameraRigEye()
        ),
        orientation: {
          heading: heading,
          pitch: Cesium.Math.toRadians(-8),
          roll: 0,
        },
      });
    } catch (_) {}
  }

  function panoSeriesShow(idx, opts) {
    const series = walkState.panoSeries || [];
    if (!series.length) return;
    const i = ((idx % series.length) + series.length) % series.length;
    walkState.panoSeriesIndex = i;
    const im = series[i];
    const o = opts || {};
    const fill = panoFillSrc(im);
    const title = panoSeriesLabel(i);
    const note =
      title +
      " · yol serisi · W/▶ ileri · S/◀ geri · Canlı değil";
    walkState.panoLastThumb = fill;
    walkState.panoLastHref = im.viewer || walkState.panoLastHref || "";
    walkState.panoLastNote = note;
    setPanoWalkStrip(true, {
      title: title,
      note: note,
      href: walkState.panoLastHref,
      thumb: fill,
      autoFill: false,
    });
    if (o.syncCam !== false) panoSyncCameraToImage(im);
    if (
      fill &&
      ((o.fill !== false && !walkState.panoUserClosed) || walkState.panoFillOn)
    ) {
      setPanoWalkPreview(true, {
        thumb: fill,
        href: walkState.panoLastHref,
        note: note,
      });
    }
    // aktif pin vurgusu
    try {
      const viewer = liveCesiumViewer;
      (walkState.panoIds || []).forEach(function (id, j) {
        const ent = viewer && viewer.entities.getById(id);
        if (!ent || !ent.billboard) return;
        const on = j === i;
        ent.billboard.scale = on ? 1.55 : 1.0;
        if (ent.label) {
          ent.label.fillColor = on
            ? Cesium.Color.fromCssColorString("#f5d76e")
            : Cesium.Color.WHITE;
        }
      });
    } catch (_) {}
  }

  function panoSeriesStep(dir) {
    const series = walkState.panoSeries || [];
    if (series.length < 2) return;
    panoSeriesShow((walkState.panoSeriesIndex || 0) + (dir || 1), {
      fill: true,
      syncCam: true,
    });
  }

  function setPanoWalkPreview(on, payload) {
    const box = document.getElementById("panoWalkPreview");
    if (!box) return;
    if (!on) {
      box.classList.remove("on");
      box.hidden = true;
      if (walkState.panoFillOn) walkState.panoUserClosed = true;
      walkState.panoFillOn = false;
      return;
    }
    const p = payload || {};
    const img = document.getElementById("panoWalkPreviewImg");
    const note = document.getElementById("panoWalkPreviewNote");
    const src = p.thumb || walkState.panoLastThumb || "";
    // Siyah boş dolum yok — kare yoksa 3D kalsın
    if (!src || !/^https?:\/\//i.test(String(src))) {
      box.classList.remove("on");
      box.hidden = true;
      walkState.panoFillOn = false;
      return;
    }
    if (img) {
      img.src = src;
      img.style.display = "";
    }
    if (note) {
      note.textContent =
        p.note ||
        "Sokak karesi sahneyi dolduruyor · Kapat = 3D yürüyüş";
    }
    walkState.panoLastThumb = src || walkState.panoLastThumb || "";
    walkState.panoLastHref = p.href || walkState.panoLastHref || "";
    walkState.panoLastNote = p.note || walkState.panoLastNote || "";
    walkState.panoFillOn = true;
    walkState.panoUserClosed = false;
    box.hidden = false;
    box.classList.add("on");
  }

  function setPanoWalkStrip(on, payload) {
    const strip = document.getElementById("panoWalkStrip");
    if (!strip) return;
    if (!on) {
      strip.classList.remove("on");
      strip.hidden = true;
      setPanoWalkPreview(false);
      return;
    }
    const title = document.getElementById("panoWalkTitle");
    const note = document.getElementById("panoWalkNote");
    const thumb = document.getElementById("panoWalkThumb");
    const open = document.getElementById("panoWalkOpen");
    const p = payload || {};
    if (title) {
      title.textContent = p.title || "Sokak görüntüsü";
    }
    if (note) {
      note.textContent =
        p.note ||
        "Küçük pin = yer · kare sahneyi doldurur";
    }
    if (thumb) {
      if (p.thumb) {
        thumb.src = p.thumb;
        thumb.style.display = "";
        thumb.style.cursor = "pointer";
      } else {
        thumb.removeAttribute("src");
        thumb.style.display = "none";
      }
    }
    walkState.panoLastThumb = p.thumb || "";
    walkState.panoLastHref = p.href || "";
    walkState.panoLastNote = p.note || "";
    if (open) {
      open.style.visibility = p.thumb || p.href ? "visible" : "hidden";
    }
    strip.hidden = false;
    strip.classList.add("on");
    if (p.autoFill && p.thumb) {
      setPanoWalkPreview(true, {
        thumb: p.thumb,
        href: p.href,
        note: p.note || "Sokak karesi sahneyi dolduruyor",
      });
    }
  }

  function wirePanoWalkUi() {
    const open = document.getElementById("panoWalkOpen");
    const thumb = document.getElementById("panoWalkThumb");
    const close = document.getElementById("panoWalkPreviewClose");
    const ext = document.getElementById("panoWalkPreviewExt");
    const prevBox = document.getElementById("panoWalkPreview");
    const stripPrev = document.getElementById("panoWalkPrev");
    const stripNext = document.getElementById("panoWalkNext");
    const hudPrev = document.getElementById("panoWalkPreviewPrev");
    const hudNext = document.getElementById("panoWalkPreviewNext");
    function showInApp() {
      if ((walkState.panoSeries || []).length) {
        walkState.panoUserClosed = false;
        panoSeriesShow(walkState.panoSeriesIndex || 0, {
          fill: true,
          syncCam: true,
        });
        return;
      }
      if (!walkState.panoLastThumb && !walkState.panoLastHref) {
        showToast("Önce yakında sokak karesi olsun");
        return;
      }
      setPanoWalkPreview(true, {
        thumb: walkState.panoLastThumb,
        href: walkState.panoLastHref,
        note: walkState.panoLastNote || "Sokak karesi sahneyi dolduruyor",
      });
    }
    function wireBtn(el, fn) {
      if (!el || el.getAttribute("data-wired") === "1") return;
      el.setAttribute("data-wired", "1");
      el.addEventListener("click", function (ev) {
        ev.preventDefault();
        fn();
      });
    }
    wireBtn(open, showInApp);
    wireBtn(thumb, showInApp);
    wireBtn(stripPrev, function () {
      panoSeriesStep(-1);
    });
    wireBtn(stripNext, function () {
      panoSeriesStep(1);
    });
    wireBtn(hudPrev, function () {
      panoSeriesStep(-1);
    });
    wireBtn(hudNext, function () {
      panoSeriesStep(1);
    });
    wireBtn(close, function () {
      setPanoWalkPreview(false);
    });
    wireBtn(ext, function () {
      if (walkState.panoLastHref) openExternalSafe(walkState.panoLastHref);
    });
    if (prevBox && prevBox.getAttribute("data-wired") !== "1") {
      prevBox.setAttribute("data-wired", "1");
      prevBox.addEventListener("click", function (ev) {
        if (ev.target === prevBox) setPanoWalkPreview(false);
      });
    }
    if (!window.__ruzgarPanoEsc) {
      window.__ruzgarPanoEsc = true;
      window.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape" && walkState.panoFillOn) {
          setPanoWalkPreview(false);
        } else if (walkState.panoFillOn && (walkState.panoSeries || []).length) {
          if (ev.key === "ArrowRight" || ev.key === "]") {
            ev.preventDefault();
            panoSeriesStep(1);
          } else if (ev.key === "ArrowLeft" || ev.key === "[") {
            ev.preventDefault();
            panoSeriesStep(-1);
          }
        }
      });
    }
  }

  function wirePanoEntityClick(viewer) {
    if (!viewer || walkState.panoClickWired || typeof Cesium === "undefined") {
      return;
    }
    walkState.panoClickWired = true;
    try {
      const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
      handler.setInputAction(function (click) {
        try {
          const picked = viewer.scene.pick(click.position);
          const ent = picked && picked.id;
          if (!ent || String(ent.id || "").indexOf("pano-hud-") !== 0) return;
          let seriesIdx = -1;
          try {
            const props = ent.properties;
            if (props && props.series_index != null) {
              const v = props.series_index.getValue
                ? props.series_index.getValue()
                : props.series_index;
              seriesIdx = Number(v);
            }
          } catch (_) {}
          walkState.panoUserClosed = false;
          if (
            seriesIdx >= 0 &&
            walkState.panoSeries &&
            walkState.panoSeries[seriesIdx]
          ) {
            panoSeriesShow(seriesIdx, { fill: true, syncCam: true });
            return;
          }
          const desc =
            ent.description && ent.description.getValue
              ? ent.description.getValue(Cesium.JulianDate.now())
              : ent.description;
          let thumb = "";
          try {
            const props = ent.properties;
            if (props) {
              const lg = props.thumb_lg && props.thumb_lg.getValue
                ? props.thumb_lg.getValue()
                : props.thumb_lg;
              const sm = props.thumb && props.thumb.getValue
                ? props.thumb.getValue()
                : props.thumb;
              thumb = String(lg || sm || "");
            }
          } catch (_) {}
          walkState.panoLastHref = desc ? String(desc) : walkState.panoLastHref;
          walkState.panoLastThumb = thumb || walkState.panoLastThumb;
          setPanoWalkPreview(true, {
            thumb: walkState.panoLastThumb,
            href: walkState.panoLastHref,
            note: "Seçilen kare · Esc = 3D",
          });
        } catch (_) {}
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
    } catch (_) {}
  }

  function walkLoadPanoHud(force) {
    const viewer = liveCesiumViewer;
    const root = apiRoot();
    if (!viewer || !root) return;
    if (walkState.panoBusy) return;
    const qp = getHaritaQualityProfile();
    // Gezi hedefi kilitli — kamera sapınca yanlış noktada boş seri aranmasın
    let lat = Number(TARGET.lat);
    let lon = Number(TARGET.lon);
    let camLat = lat;
    let camLon = lon;
    try {
      const c = Cesium.Cartographic.fromCartesian(viewer.camera.position);
      camLat = Cesium.Math.toDegrees(c.latitude);
      camLon = Cesium.Math.toDegrees(c.longitude);
      const nearTarget =
        Math.abs(camLat - lat) < 0.04 && Math.abs(camLon - lon) < 0.04;
      if (nearTarget && !force) {
        lat = camLat;
        lon = camLon;
      }
    } catch (_) {}
    const now = Date.now();
    const moved =
      Math.abs(lat - (walkState.panoLat || 0)) > 0.018 ||
      Math.abs(lon - (walkState.panoLon || 0)) > 0.018;
    if (
      !force &&
      walkState.panoSeries &&
      walkState.panoSeries.length &&
      !moved
    ) {
      return;
    }
    if (
      !force &&
      !moved &&
      now - (walkState.panoTs || 0) < (qp.mobil ? 12000 : 8000)
    ) {
      return;
    }
    const lim = qp.mobil ? 24 : 40;
    const rad = qp.mobil ? 420 : 650;
    const placeName =
      TARGET.label ||
      (tourState && tourState.label) ||
      label ||
      "";
    walkState.panoBusy = true;
    wirePanoEntityClick(viewer);
    fetch(
      root +
        "/api/sehir-ikiz/pano?mode=seri&lat=" +
        lat.toFixed(5) +
        "&lon=" +
        lon.toFixed(5) +
        "&limit=" +
        lim +
        "&radius_m=" +
        rad +
        "&hedef=" +
        encodeURIComponent(placeName)
    )
      .then(function (r) {
        return r.json();
      })
      .then(function (data) {
        walkState.panoBusy = false;
        walkState.panoTs = Date.now();
        walkState.panoLat = lat;
        walkState.panoLon = lon;
        (walkState.panoIds || []).forEach(function (id) {
          try {
            viewer.entities.removeById(id);
          } catch (_) {}
        });
        walkState.panoIds = [];
        const images = (data && data.images) || [];
        const embed =
          (data && data.embed_url) ||
          "https://www.mapillary.com/app/?lat=" +
            lat.toFixed(6) +
            "&lng=" +
            lon.toFixed(6) +
            "&z=17";
        const placeLabel =
          (data && (data.place_label || (data.place && data.place.label))) ||
          placeName ||
          "konum";
        walkState.panoPlaceLabel = placeLabel;
        walkState.panoSeriesId = (data && data.sequence_id) || "";
        walkState.panoSeries = images.slice();
        walkState.panoSeriesIndex = 0;
        const note =
          (data && data.note) ||
          (images.length
            ? placeLabel + " · " + images.length + " karelik seri"
            : placeLabel + " · bu alanda seri yok");
        if (!images.length) {
          walkState.panoSeries = [];
          // Siyah boş sahne açma — 3D’de kal
          setPanoWalkPreview(false);
          walkState.panoUserClosed = false;
          setPanoWalkStrip(true, {
            title:
              data && data.token_configured === false
                ? "Sokak API · token yok"
                : "Seri yok · " + placeLabel,
            note: note + " · 3D yürüyüşe devam",
            href: embed,
            thumb: "",
          });
          showToast(
            data && data.token_configured === false
              ? "Pano: token yok · 3D’de yürü"
              : placeLabel + " · seri yok · 3D’de kal"
          );
          // Hedefe yapışık yeniden dene (kamera sapması)
          if (
            force &&
            !walkState._panoRetriedTarget &&
            (Math.abs(camLat - TARGET.lat) > 0.002 ||
              Math.abs(camLon - TARGET.lon) > 0.002)
          ) {
            walkState._panoRetriedTarget = true;
            try {
              walkPlaceEye();
            } catch (_) {}
            setTimeout(function () {
              walkLoadPanoHud(true);
            }, 600);
          }
          return;
        }
        walkState._panoRetriedTarget = false;
        images.forEach(function (im, idx) {
          if (im.lat == null || im.lon == null) return;
          const id = "pano-hud-" + idx;
          const fill = panoFillSrc(im);
          try {
            viewer.entities.add({
              id: id,
              position: Cesium.Cartesian3.fromDegrees(
                Number(im.lon),
                Number(im.lat),
                4
              ),
              billboard: im.thumb
                ? {
                    image: im.thumb,
                    width: qp.mobil ? 32 : 40,
                    height: qp.mobil ? 24 : 30,
                    verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                    disableDepthTestDistance: Number.POSITIVE_INFINITY,
                    scaleByDistance: new Cesium.NearFarScalar(
                      40,
                      1.35,
                      900,
                      0.55
                    ),
                  }
                : undefined,
              point: im.thumb
                ? undefined
                : {
                    pixelSize: 12,
                    color: Cesium.Color.fromCssColorString("#e74c3c"),
                    disableDepthTestDistance: Number.POSITIVE_INFINITY,
                  },
              label: {
                text: String(idx + 1),
                font: "11px sans-serif",
                pixelOffset: new Cesium.Cartesian2(0, -26),
                fillColor: Cesium.Color.WHITE,
                showBackground: true,
                disableDepthTestDistance: Number.POSITIVE_INFINITY,
              },
              description: im.viewer || embed,
              properties: {
                thumb: im.thumb || "",
                thumb_lg: fill,
                pano_id: String(im.id || idx),
                series_index: idx,
              },
            });
            walkState.panoIds.push(id);
          } catch (_) {}
        });
        if (force) walkState.panoUserClosed = false;
        panoSeriesShow(0, {
          fill: force || walkState.panoFillOn,
          syncCam: true,
        });
        showToast(
          placeLabel +
            " · " +
            images.length +
            " karelik yol · W/▶ ile yürü"
        );
      })
      .catch(function () {
        walkState.panoBusy = false;
        walkState.panoSeries = [];
        setPanoWalkStrip(true, {
          title: "Seri yüklenemedi",
          note: "Ağ/API hatası · 3D yürüyüşe devam",
          href:
            "https://www.mapillary.com/app/?lat=" +
            lat.toFixed(6) +
            "&lng=" +
            lon.toFixed(6) +
            "&z=17",
          thumb: "",
        });
        showToast("Sokak serisi yüklenemedi");
      });
  }

  function setTourBarOn(on) {
    if (tourBar) tourBar.classList.toggle("on", !!on);
  }

  function setTourCinema(on) {
    try {
      document.body.classList.toggle("tour-cinema-on", !!on);
    } catch (_) {}
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage(
          { type: "ruzgar-harita-cinema", on: !!on },
          "*"
        );
      }
    } catch (_) {}
  }

  function setTourInfo(title, info) {
    if (tourTitleEl) tourTitleEl.textContent = title || "Dünya Gezgini";
    if (tourInfoEl) tourInfoEl.textContent = info || "";
  }

  function clearTourTimer() {
    if (tourState.timer) {
      clearTimeout(tourState.timer);
      tourState.timer = 0;
    }
  }

  function detachTourTick() {
    if (tourState.removeTick) {
      try {
        tourState.removeTick();
      } catch (_) {}
      tourState.removeTick = null;
    }
    if (tourRafId) {
      try {
        cancelAnimationFrame(tourRafId);
      } catch (_) {}
      tourRafId = 0;
    }
    tourState.lastTs = 0;
  }

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  function lerpAngleDeg(a, b, t) {
    let d = ((b - a + 540) % 360) - 180;
    return (a + d * t + 360) % 360;
  }

  function smoothstep(t) {
    const x = Math.max(0, Math.min(1, t));
    return x * x * (3 - 2 * x);
  }

  function catmullRom(p0, p1, p2, p3, t) {
    const t2 = t * t;
    const t3 = t2 * t;
    return (
      0.5 *
      (2 * p1 +
        (-p0 + p2) * t +
        (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 +
        (-p0 + 3 * p1 - 3 * p2 + p3) * t3)
    );
  }

  function tourIsCityishTip(tip) {
    return /^(sehir|il|ilce|mahalle|bina|nokta|bogaz)$/i.test(
      String(tip || tourState.tip || "")
    );
  }

  function sampleRangeFloor() {
    // Eski Math.max(800) şehir turunu denize çekiyordu (Taksim→Boğaz).
    if (tourIsCityishTip()) return 12;
    const tip = String(tourState.tip || "").toLowerCase();
    if (/^(nehir|delta|kanyon|vadi|selale)$/.test(tip)) return 25;
    return 60;
  }

  function clampToTourCenter(lat, lon, maxDeg) {
    const cLat = Number(tourState.centerLat);
    const cLon = Number(tourState.centerLon);
    if (!isFinite(cLat) || !isFinite(cLon) || (cLat === 0 && cLon === 0)) {
      return { lat: lat, lon: lon };
    }
    const lim = maxDeg != null ? maxDeg : tourIsCityishTip() ? 0.012 : 0.08;
    const dLat = lat - cLat;
    const dLon = lon - cLon;
    const dist = Math.sqrt(dLat * dLat + dLon * dLon);
    if (dist <= lim || dist < 1e-9) return { lat: lat, lon: lon };
    const s = lim / dist;
    return { lat: cLat + dLat * s, lon: cLon + dLon * s };
  }

  function sampleWaypointPair(i, t) {
    const wps = tourState.waypoints;
    const n = wps.length;
    if (!n) return null;
    const i1 = Math.max(0, Math.min(n - 1, i));
    const i2 = Math.max(0, Math.min(n - 1, i + 1));
    const i0 = Math.max(0, i1 - 1);
    const i3 = Math.min(n - 1, i2 + 1);
    const a = wps[i1];
    const b = wps[i2];
    const u = smoothstep(t);
    const floorR = sampleRangeFloor();
    const defR = tourIsCityishTip() ? 80 : 12000;
    let lat = catmullRom(
      Number(wps[i0].lat),
      Number(a.lat),
      Number(b.lat),
      Number(wps[i3].lat),
      u
    );
    let lon = catmullRom(
      Number(wps[i0].lon),
      Number(a.lon),
      Number(b.lon),
      Number(wps[i3].lon),
      u
    );
    const range = catmullRom(
      Number(wps[i0].range) || defR,
      Number(a.range) || defR,
      Number(b.range) || defR,
      Number(wps[i3].range) || defR,
      u
    );
    const heading = lerpAngleDeg(Number(a.heading) || 0, Number(b.heading) || 0, u);
    const pitch = lerp(Number(a.pitch) || -30, Number(b.pitch) || -30, u);
    let lookLat = a.look_lat != null ? Number(a.look_lat) : Number(a.lat);
    let lookLon = a.look_lon != null ? Number(a.look_lon) : Number(a.lon);
    if (b.look_lat != null && b.look_lon != null) {
      lookLat = lerp(lookLat, Number(b.look_lat), u);
      lookLon = lerp(lookLon, Number(b.look_lon), u);
    }
    if (tourIsCityishTip()) {
      const p = clampToTourCenter(lat, lon);
      lat = p.lat;
      lon = p.lon;
      const lk = clampToTourCenter(lookLat, lookLon);
      lookLat = lk.lat;
      lookLon = lk.lon;
    }
    return {
      lat: lat,
      lon: lon,
      heading: heading,
      pitch: pitch,
      range: Math.max(floorR, range),
      look_lat: lookLat,
      look_lon: lookLon,
      phase: t < 0.5 ? a.phase : b.phase,
      phase_label: t < 0.5 ? a.phase_label : b.phase_label,
      info: t < 0.5 ? a.info : b.info,
    };
  }

  function resolveLookHeight(lon, lat) {
    const viewer = liveCesiumViewer;
    if (!viewer || !viewer.scene || !viewer.scene.globe || typeof Cesium === "undefined") {
      return tourState._lastGround != null ? Number(tourState._lastGround) : 35;
    }
    try {
      const carto = Cesium.Cartographic.fromDegrees(Number(lon), Number(lat));
      const h = viewer.scene.globe.getHeight(carto);
      if (typeof h === "number" && isFinite(h)) {
        tourState._lastGround = h;
        return h;
      }
    } catch (_) {}
    // Terrain henüz yokken 0 kullanmak → yere gömülme (gri yüzey). Son bilinen / TR şehir varsayılanı.
    if (tourState._lastGround != null && isFinite(Number(tourState._lastGround))) {
      return Number(tourState._lastGround);
    }
    if (tourIsCityishTip()) return 35;
    return 0;
  }

  function effectiveTourRange(baseRange) {
    const bandLo = Number(tourState.bandMin) || 30;
    const bandHi = Number(tourState.bandMax) || 500;
    const base = Math.max(TOUR_RANGE_MIN, Number(baseRange) || bandLo);
    let r;
    if (tourState.forceRangeM != null && isFinite(tourState.forceRangeM)) {
      r = Number(tourState.forceRangeM);
    } else {
      r = base * (Number(tourState.rangeMult) || 1);
