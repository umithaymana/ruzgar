      apiRoot() +
      "/api/sehir-ikiz/stac?hedef=" +
      qCity +
      "&lat=" +
      lat.toFixed(5) +
      "&lon=" +
      lon.toFixed(5) +
      "&limit=3";
    fetch(url)
      .then(function (r) {
        return r.json();
      })
      .then(function (data) {
        if (!data || !data.ok || !data.best) {
          setBadge("STAC boş");
          stacCard.classList.add("on");
          stacCard.textContent = (data && data.error) || "Sentinel sahne bulunamadı";
          return;
        }
        const b = data.best;
        const cc = b.cloud_cover != null ? Number(b.cloud_cover).toFixed(0) + "% bulut" : "";
        stacCard.classList.add("on");
        stacCard.innerHTML =
          "<b>Sentinel-2</b><br/>" +
          (b.datetime || "").slice(0, 10) +
          (cc ? " · " + cc : "") +
          "<br/><small>" +
          (b.id || "") +
          "</small>" +
          (b.thumbnail
            ? '<img alt="önizleme" src="' + b.thumbnail + '" />'
            : "");
        if (b.bbox && b.bbox.length === 4) {
          const bounds = [
            [b.bbox[1], b.bbox[0]],
            [b.bbox[3], b.bbox[2]],
          ];
          L.rectangle(bounds, {
            color: "#d4af37",
            weight: 1,
            fillOpacity: 0.08,
          }).addTo(map);
          map.fitBounds(bounds, { padding: [20, 20] });
        }
        setBadge((b.datetime || "").slice(0, 10) || "STAC");
      })
      .catch(function (err) {
        console.warn("stac", err);
        setBadge("STAC hata");
      });
    setTimeout(function () {
      map.invalidateSize();
    }, 80);
  }

  function paintPano() {
    showOnly("pano");
    yearBar.classList.remove("on");
      syncYearInfoOffset();
    setBadge("Mapillary…");
    // Mapillary.com X-Frame-Options: DENY → iframe = mavi/boş ekran. Panel + dış açılış.
    const fallbackEmbed =
      "https://www.mapillary.com/app/?lat=" +
      lat.toFixed(6) +
      "&lng=" +
      lon.toFixed(6) +
      "&z=17";
    panoPanel.innerHTML =
      '<p class="pano-head">Sokak / panorama</p>' +
      '<p class="pano-note">Yükleniyor…</p>';
    const qCity = encodeURIComponent(label || "");
    const url =
      apiRoot() +
      "/api/sehir-ikiz/pano?hedef=" +
      qCity +
      "&lat=" +
      lat.toFixed(5) +
      "&lon=" +
      lon.toFixed(5);
    fetch(url)
      .then(function (r) {
        return r.json();
      })
      .then(function (data) {
        const embed = (data && data.embed_url) || fallbackEmbed;
        const tokenOk = !!(data && data.token_configured);
        const images = (data && data.images) || [];
        let note =
          "Mapillary sitesi iframe’e izin vermiyor (bu yüzden mavi ekran oluyordu). " +
          "Sokak turunu tarayıcıda aç; yakındaki kareler için <code>RUZGAR_MAPILLARY_TOKEN</code> gerekir.";
        if (tokenOk && images.length) {
          note = "Token var · yakındaki sokak kareleri. Tam 360 için «Mapillary’de aç».";
        } else if (tokenOk) {
          note = "Token var ama bu noktada sokak görüntüsü bulunamadı. Konumu yaklaştırıp tekrar dene veya Mapillary’de aç.";
        }
        let grid = "";
        if (images.length) {
          grid =
            '<div class="pano-grid">' +
            images
              .map(function (im) {
                const href = im.viewer || embed;
                const src = im.thumb_lg || im.thumb || "";
                const cap = im.is_pano ? "pano" : "sokak";
                return (
                  '<a href="' +
                  href +
                  '" target="_blank" rel="noopener noreferrer">' +
                  (src ? '<img src="' + src + '" alt="' + cap + '" loading="lazy" />' : "") +
                  "<span>" +
                  cap +
                  "</span></a>"
                );
              })
              .join("") +
            "</div>";
        }
        panoPanel.innerHTML =
          '<p class="pano-head">Sokak / panorama · ' +
          (label || "konum") +
          "</p>" +
          '<p class="pano-note">' +
          note +
          "</p>" +
          '<div class="pano-actions">' +
          '<a href="' +
          embed +
          '" target="_blank" rel="noopener noreferrer">Mapillary’de aç</a>' +
          '<a class="ghost" href="' +
          embed +
          '" target="_blank" rel="noopener noreferrer">Yedek bağlantı</a>' +
          "</div>" +
          grid;
        setBadge(tokenOk ? (images.length ? "API kareler" : "API boş") : "dış açılış");
      })
      .catch(function () {
        panoPanel.innerHTML =
          '<p class="pano-head">Sokak / panorama</p>' +
          '<p class="pano-note">API’ye ulaşılamadı. Mapillary sitesini dışarıda açabilirsin (iframe engelli).</p>' +
          '<div class="pano-actions"><a href="' +
          fallbackEmbed +
          '" target="_blank" rel="noopener noreferrer">Mapillary’de aç</a></div>';
        setBadge("web yedek");
      });
  }

  wireTourBar();
  const wantTour =
    q.get("tour") === "1" ||
    q.get("tour_play") === "1" ||
    String(q.get("gezgin") || "") === "1";
  if (wantTour && mode !== "f4") {
    mode = "3d";
    terrainOn = true;
  }

  // 3d: Cesium ana; engine=f4 veya mode=f4 → F4map yedek
  if (mode === "f4" || (mode === "3d" && forceF4)) {
    paintF4();
  } else if (mode === "3d") {
    paintCesium3d();
  } else if (mode === "tur") {
    paintTur();
  } else if (mode === "sentinel") {
    paintSentinel();
  } else if (mode === "pano") {
    paintPano();
  } else if (mode === "4d") {
    paintLeaflet("4d");
  } else if (mode === "2d") {
    paintLeaflet("2d");
  } else {
    /* varsayılan: Esri uydu (boş OSM hissi yok) */
    paintLeaflet("uydu");
  }

  if (wantTour) {
    setTimeout(function () {
      fetchAndStartTour(
        q.get("tour_place") || label,
        tipQ || TARGET.tip,
        TARGET.lat,
        TARGET.lon
      );
    }, 1400);
  }
})();
  </script>
</body>
</html>
