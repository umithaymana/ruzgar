      // Bant içinde tut (kuş / şehir hissi)
      r = Math.max(bandLo * 0.85, Math.min(bandHi * 1.15, r));
    }
    return Math.max(TOUR_RANGE_MIN, Math.min(TOUR_RANGE_MAX, r));
  }

  function formatAltitude(m) {
    const v = Math.max(0, Number(m) || 0);
    if (v < 10) return v.toFixed(1).replace(/\.0$/, "") + " m";
    if (v < 1000) return Math.round(v) + " m";
    return (v / 1000).toFixed(v >= 10000 ? 0 : 1) + " km";
  }

  function applyCameraSample(sample) {
    if (!sample || typeof Cesium === "undefined") return;
    try {
      const lookLat = Number(
        sample.look_lat != null ? sample.look_lat : sample.lat
      );
      const lookLon = Number(
        sample.look_lon != null ? sample.look_lon : sample.lon
      );
      if (!isFinite(lookLat) || !isFinite(lookLon)) return;
      let pitchDeg = Number(sample.pitch) || -30;
      const range = effectiveTourRange(sample.range);
      if (range < 25) pitchDeg = Math.max(pitchDeg, -18);
      else if (range < 80) pitchDeg = Math.max(pitchDeg, -22);
      // Tek yol: focus orbit lookAt — setView/IDENTITY yok (merkez kaymaz)
      focusOrbit.lat = lookLat;
      focusOrbit.lon = lookLon;
      let g = Number(resolveLookHeight(lookLon, lookLat));
      if (!isFinite(g) || g < 5) g = tourIsCityishTip() ? 45 : 20;
      focusOrbit.height = g;
      focusOrbit.heading = Number(sample.heading) || 0;
      focusOrbit.pitch = pitchDeg;
      focusOrbit.range = Math.max(20, range);
      focusOrbit.mode = "focus";
      focusOrbitApply();
    } catch (e) {
      console.warn("tour sample", e);
    }
  }

  function formatRemain(sec) {
    const s = Math.max(0, Math.round(sec));
    if (s < 60) return s + " sn";
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function renderTourCard(card) {
    if (!tourCardEl) return;
    // H10.6: sinematik modda kart gösterilmez
    tourCardEl.classList.remove("on");
    tourCardEl.innerHTML = "";
  }

  function updateTourProgress() {
    const elapse = tourState.elapsed || 0;
    // Sonsuz gezi: yüzde yerine süre nabzı
    const pulse = tourState.active ? ((elapse * 8) % 100) : 0;
    if (tourProgLabel) {
      tourProgLabel.textContent = tourState.endless
        ? formatRemain(elapse)
        : "%" + Math.round((tourState.progress || 0) * 100);
    }
    if (tourProgFill) {
      tourProgFill.style.width = (tourState.endless ? pulse : Math.round((tourState.progress || 0) * 100)) + "%";
    }
    const section = tourState.phaseLabel || tourState.steerMode || tourState.tip || "keşif";
    const spd =
      Math.abs(tourState.speed - 1) > 0.05
        ? " · ×" + tourState.speed.toFixed(1)
        : "";
    const alt =
      tourState.liveRangeM > 0
        ? " · " + formatAltitude(tourState.liveRangeM)
        : "";
    if (tourMetaEl) {
      const addr =
        tourState.placeLabel ||
        tourState.phaseLabel ||
        section ||
        "—";
      tourMetaEl.textContent =
        addr +
        alt +
        (tourState.endless ? " · sürekli" : "") +
        spd +
        " · WASD/oklar · fare · ses";
    }
    if (tourTitleEl && tourState.active) {
      const titleBits = [tourState.label || "Dünya Gezgini"];
      if (tourState.placeLabel && tourState.placeLabel !== tourState.label) {
        titleBits[0] = String(tourState.placeLabel).split(",")[0].trim() || titleBits[0];
      }
      tourTitleEl.textContent = titleBits[0];
    }
  }

  function tourStopAll() {
    clearTourTimer();
    detachTourTick();
    try {
      if (liveCesiumViewer && liveCesiumViewer.camera && liveCesiumViewer.camera.cancelFlight) {
        liveCesiumViewer.camera.cancelFlight();
      }
    } catch (_) {}
    tourState.active = false;
    tourState.paused = false;
    tourState.index = 0;
    tourState.stops = [];
    tourState.waypoints = [];
    tourState.card = null;
    tourState.flying = false;
    tourState.auto = true;
    tourState.progress = 0;
    tourState.elapsed = 0;
    tourState.totalSec = 0;
    tourState.segIndex = 0;
    tourState.segT = 0;
    tourState.phaseLabel = "";
    tourState.speed = 0.4;
    tourState.rangeMult = 1;
    tourState.forceRangeM = null;
    tourState.liveRangeM = 0;
    tourState.endless = true;
    tourState.headingBias = 0;
    tourState.steerMode = null;
    tourState.tip = "dag";
    tourState.placeLabel = "";
    tourState.narrTs = 0;
    tourState.narrBusy = false;
    renderTourCard(null);
    updateTourProgress();
    setTourBarOn(false);
    setTourCinema(false);
    setTourInfo("Dünya Gezgini", "Gezi bitti.");
    setTourNativeControls(true);
  }

  const TOUR_SPEED_TIERS = [0.55, 0.85, 1.15, 1.55, 2.1];

  /**
   * Focus Orbit — Google Earth mantığı
   * Tek kaynak: focus + heading/pitch/range → camera.lookAt
   * lookAtTransform(IDENTITY) odak modunda YASAK (merkez kayması).
   */
  const focusOrbit = {
    mode: "focus", // focus | free
    lat: 0,
    lon: 0,
    height: 0,
    heading: 35,
    pitch: -42,
    range: 150,
    locked: true,
    logN: 0,
  };

  function focusOrbitKillInertia() {
    const viewer = liveCesiumViewer;
    if (!viewer || !viewer.scene) return;
    try {
      const c = viewer.scene.screenSpaceCameraController;
      if (!c) return;
      c.inertiaSpin = 0;
      c.inertiaTranslate = 0;
      c.inertiaZoom = 0;
    } catch (_) {}
  }

  /** Turdayken Cesium’un kendi mausu kapalı — kontrol yalnız bizde */
  function setTourNativeControls(enabled) {
    const viewer = liveCesiumViewer;
    if (!viewer || !viewer.scene) return;
    try {
      const c = viewer.scene.screenSpaceCameraController;
      if (!c) return;
      c.enableRotate = !!enabled;
      c.enableTranslate = !!enabled;
      c.enableZoom = !!enabled;
      c.enableTilt = !!enabled;
      c.enableLook = !!enabled;
      if (c.enableInputs != null) c.enableInputs = !!enabled;
      c.inertiaSpin = 0;
      c.inertiaTranslate = 0;
      c.inertiaZoom = 0;
    } catch (_) {}
  }

  function focusOrbitTargetCartesian() {
    const h = isFinite(Number(focusOrbit.height)) ? Number(focusOrbit.height) : 0;
    return Cesium.Cartesian3.fromDegrees(
      Number(focusOrbit.lon),
      Number(focusOrbit.lat),
      h
    );
  }

  function focusOrbitLog() {
    const viewer = liveCesiumViewer;
    if (!viewer || typeof Cesium === "undefined") return;
    focusOrbit.logN += 1;
    let cam = null;
    try {
      // Nadir lookAt'ta cartographic bozulabilir — beklenen göz yüksekliği yaz
      if (Math.abs(Number(focusOrbit.pitch)) > 88) {
        cam = {
          lat: +Number(focusOrbit.lat).toFixed(6),
          lon: +Number(focusOrbit.lon).toFixed(6),
          h: Math.round(focusOrbit.height + focusOrbit.range),
        };
      } else {
        const wc = viewer.camera.positionWC || viewer.camera.position;
        const c = viewer.scene.globe.ellipsoid.cartesianToCartographic(wc);
        cam = {
          lat: +Cesium.Math.toDegrees(c.latitude).toFixed(6),
          lon: +Cesium.Math.toDegrees(c.longitude).toFixed(6),
          h: Math.round(c.height),
        };
      }
    } catch (_) {}
    const snap = {
      n: focusOrbit.logN,
      mode: focusOrbit.mode,
      cam: cam,
      heading: Math.round(focusOrbit.heading * 10) / 10,
      pitch: Math.round(focusOrbit.pitch * 10) / 10,
      roll: 0,
      range: Math.round(focusOrbit.range),
      focus: {
        lat: +Number(focusOrbit.lat).toFixed(6),
        lon: +Number(focusOrbit.lon).toFixed(6),
        h: Math.round(focusOrbit.height),
      },
      locked: !!focusOrbit.locked,
    };
    try {
      window.__RUZGAR_CAM__ = snap;
    } catch (_) {}
    if (focusOrbit.logN <= 5 || focusOrbit.logN % 45 === 0) {
      console.info("[Rüzgar CAM]", snap);
    }
  }

  function focusOrbitEnsureOnScreen() {
    const viewer = liveCesiumViewer;
    if (!viewer || !focusOrbit.locked || focusOrbit.mode !== "focus") return;
    if (focusOrbit._applying) return;
    try {
      const target = focusOrbitTargetCartesian();
      const win = viewer.scene.cartesianToCanvasCoordinates(target);
      const canvas = viewer.scene.canvas;
      if (!canvas) return;
      if (
        !win ||
        win.x < 4 ||
        win.y < 4 ||
        win.x > canvas.clientWidth - 4 ||
        win.y > canvas.clientHeight - 4
      ) {
        // Doğrudan lookAt — apply çağırma (özyineleme yok)
        viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
        viewer.camera.lookAt(
          target,
          new Cesium.HeadingPitchRange(
            Cesium.Math.toRadians(focusOrbit.heading),
            Cesium.Math.toRadians(focusOrbit.pitch),
            focusOrbit.range
          )
        );
        if (focusOrbit.logN % 90 === 1) showToast("Odak yeniden merkez");
      }
    } catch (_) {}
  }

  function focusOrbitApply() {
    const viewer = liveCesiumViewer;
    if (!viewer || typeof Cesium === "undefined") return;
    if (!isFinite(Number(focusOrbit.lat)) || !isFinite(Number(focusOrbit.lon)))
      return;
    focusOrbitKillInertia();
    setTourNativeControls(false);
    tourCancelCameraFlight();
    // pitch -90 kuşbakışı için açık; -5'ten yataylaşma
    focusOrbit.pitch = Math.max(
      -89.9,
      Math.min(-0.5, Number(focusOrbit.pitch) || -40)
    );
    focusOrbit.range = Math.max(
      20,
      Math.min(80000, Number(focusOrbit.range) || 150)
    );
    focusOrbit.heading =
      ((Number(focusOrbit.heading) % 360) + 360) % 360;
    focusOrbit._applying = true;
    try {
      const target = focusOrbitTargetCartesian();
      const offset = new Cesium.HeadingPitchRange(
        Cesium.Math.toRadians(focusOrbit.heading),
        Cesium.Math.toRadians(focusOrbit.pitch),
        focusOrbit.range
      );
      // Doğru sıra: eski kilidi temizle → yeni lookAt.
      // (lookAt SONRASI IDENTITY = merkez kaybı; ÖNCE IDENTITY = güvenli reset)
      viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
      viewer.camera.lookAt(target, offset);
      focusOrbit.locked = true;
    } catch (e) {
      console.warn("focusOrbitApply", e);
      try {
        const g = Number(focusOrbit.height) || 0;
        viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
        viewer.camera.setView({
          destination: Cesium.Cartesian3.fromDegrees(
            focusOrbit.lon,
            focusOrbit.lat,
            g + focusOrbit.range
          ),
          orientation: {
            heading: Cesium.Math.toRadians(focusOrbit.heading),
            pitch: Cesium.Math.toRadians(focusOrbit.pitch),
            roll: 0,
          },
        });
      } catch (_) {}
    }
    tourState.liveRangeM = focusOrbit.range;
    tourState.forceRangeM = focusOrbit.range;
    tourState.centerLat = focusOrbit.lat;
    tourState.centerLon = focusOrbit.lon;
    focusOrbitLog();
    focusOrbitEnsureOnScreen();
    focusOrbit._applying = false;
    try {
      viewer.scene.requestRender();
    } catch (_) {}
  }

  // Test / dış API
  try {
    window.__RUZGAR_FOCUS__ = {
      set: function (lat, lon, opts) {
        focusOrbitSet(lat, lon, opts || {});
      },
      softGoto: focusOrbitSoftGoto,
      apply: focusOrbitApply,
      overhead: focusOrbitOverhead,
      drag: focusOrbitDrag,
      state: focusOrbit,
    };
  } catch (_) {}

  function focusOrbitHeightForKind(kind) {
    const k = String(kind || "").toLowerCase();
    if (k === "bina" || k === "building") return 50;
    if (k === "mahalle" || k === "neighborhood") return 150;
    if (k === "sehir" || k === "city" || k === "il") return 300;
    if (k === "dag" || k === "kanyon" || k === "volkan") return 1200;
    if (k === "kiyi" || k === "ada" || k === "gol") return 400;
    if (tourIsCityishTip()) return 150;
    return 300;
  }

  function focusOrbitSet(lat, lon, opts) {
    opts = opts || {};
    focusOrbit.lat = Number(lat);
    focusOrbit.lon = Number(lon);
    let g = Number(resolveLookHeight(lon, lat));
    if (!isFinite(g) || g < 5) g = tourIsCityishTip() ? 45 : 20;
    focusOrbit.height = g;
    if (opts.range != null) focusOrbit.range = Number(opts.range);
    if (opts.heading != null) focusOrbit.heading = Number(opts.heading);
    if (opts.pitch != null) focusOrbit.pitch = Number(opts.pitch);
    if (opts.mode) focusOrbit.mode = opts.mode;
    TARGET.lat = focusOrbit.lat;
    TARGET.lon = focusOrbit.lon;
    tourState.centerLat = focusOrbit.lat;
    tourState.centerLon = focusOrbit.lon;
    tourPause({ silent: true });
    if (opts.fly) {
      focusOrbit.range =
        opts.range != null
          ? Number(opts.range)
          : focusOrbitHeightForKind(opts.kind || tourState.tip);
      showToast(opts.toast || "Odak · uçuş");
      const viewer = liveCesiumViewer;
      if (!viewer) {
        focusOrbitApply();
        return;
      }
      try {
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(
            focusOrbit.lon,
            focusOrbit.lat,
            focusOrbit.height + focusOrbit.range
          ),
          orientation: {
            heading: Cesium.Math.toRadians(focusOrbit.heading),
            pitch: Cesium.Math.toRadians(
              Math.max(-89.5, Number(focusOrbit.pitch) || -45)
            ),
            roll: 0,
          },
          duration: opts.duration != null ? opts.duration : 1.15,
          complete: function () {
            focusOrbit.mode = "focus";
            focusOrbitApply();
            tourPause({ toast: opts.toast || "Odak kilitli" });
          },
        });
      } catch (_) {
        focusOrbit.mode = "focus";
        focusOrbitApply();
      }
      return;
    }
    focusOrbitApply();
    if (!opts.silent) showToast(opts.toast || "Odak merkez");
  }

  function focusOrbitOverhead() {
    focusOrbit.heading = 0;
    focusOrbit.pitch = -90;
    focusOrbit.mode = "focus";
    focusOrbitApply();
    showToast("Üzerine çık · kuşbakışı");
  }

  /**
   * Sol sürükle = haritayı elle tut (Google Earth pan).
   * Sağa → görüntü sağa · Yukarı → ileri · Aşağı → geri
   * (Orbit/heading değiştirmez — yükseklik tekerlekte kalır)
   * dx/dy: ekran pikseli; mesafe kamera yüksekliğine göre 1:1 hissi.
   */
  function focusOrbitDrag(dx, dy) {
    if (!isFinite(dx) || !isFinite(dy)) return;
    if (Math.abs(dx) + Math.abs(dy) < 0.5) return;
    if (tourState.active) tourPause({ silent: true });
    tourCancelCameraFlight();
    focusOrbitKillInertia();
    const mpdLat = 111320;
    const mpdLon =
      111320 * Math.max(0.2, Math.cos((focusOrbit.lat * Math.PI) / 180));
    // Ekran yüksekliğine göre metre/piksel — tutunca harita ele yapışır
    let metersPerPixel = Math.max(0.35, Number(focusOrbit.range) * 0.0018);
    try {
      const viewer = liveCesiumViewer;
      const canvas = viewer && viewer.scene && viewer.scene.canvas;
      const hPx = (canvas && (canvas.clientHeight || canvas.height)) || 0;
      const frustum = viewer && viewer.camera && viewer.camera.frustum;
      const fovy =
        frustum && isFinite(frustum.fovy) ? Number(frustum.fovy) : 0.9;
      if (hPx > 40 && isFinite(fovy) && fovy > 0.05) {
        const pitchRad = Math.abs(
          (Number(focusOrbit.pitch) || -40) * (Math.PI / 180)
        );
        const groundFactor = 1 / Math.max(0.28, Math.sin(pitchRad));
        metersPerPixel =
          ((2 * Math.max(20, Number(focusOrbit.range) || 150) *
            Math.tan(fovy * 0.5)) /
            hPx) *
          groundFactor;
      }
    } catch (_) {}
    const step = Math.max(0.35, metersPerPixel);
    const rad = (focusOrbit.heading * Math.PI) / 180;
    // Yukarı (dy<0) = ileri · Sağa (dx>0) = görüntü sağa → odak sola (ters)
    const fwd = -dy * step;
    const right = -dx * step;
    focusOrbit.lat +=
      (Math.cos(rad) * fwd - Math.sin(rad) * right) / mpdLat;
    focusOrbit.lon +=
      (Math.sin(rad) * fwd + Math.cos(rad) * right) / mpdLon;
    let g = Number(resolveLookHeight(focusOrbit.lon, focusOrbit.lat));
    if (isFinite(g) && g >= 5) focusOrbit.height = g;
    focusOrbit.mode = "focus";
    focusOrbitApply();
  }

  /** Çift tık: yumuşak geçiş — yükseklik ASLA sıfırlanmaz · max 300 m adım */
  function focusOrbitSoftGoto(lat, lon, opts) {
    opts = opts || {};
    if (!isFinite(Number(lat)) || !isFinite(Number(lon))) return;
    tourPause({ silent: true });
    tourCancelCameraFlight();
    focusOrbitKillInertia();
    const keepRange = Math.max(
      20,
      Number(focusOrbit.range) || Number(tourState.liveRangeM) || 150
    );
    const keepPitch = Number(focusOrbit.pitch);
    const keepHeading = Number(focusOrbit.heading);
    const from = { lat: Number(focusOrbit.lat), lon: Number(focusOrbit.lon) };
    const to = { lat: Number(lat), lon: Number(lon) };
    let dist = 0;
    try {
      dist = haversineM(from, to);
    } catch (_) {
      dist = 0;
    }
    let tLat = to.lat;
    let tLon = to.lon;
    if (isFinite(dist) && dist > 300) {
      const f = 300 / dist;
      tLat = from.lat + (to.lat - from.lat) * f;
      tLon = from.lon + (to.lon - from.lon) * f;
    }
    const startLat = from.lat;
    const startLon = from.lon;
    const endLat = tLat;
    const endLon = tLon;
    if (focusOrbit._softRaf) {
      try {
        cancelAnimationFrame(focusOrbit._softRaf);
      } catch (_) {}
      focusOrbit._softRaf = 0;
    }
    const t0 =
      typeof performance !== "undefined" && performance.now
        ? performance.now()
        : Date.now();
    const dur = 420;
    function step(now) {
      const u = Math.min(
        1,
        ((typeof now === "number" ? now : Date.now()) - t0) / dur
      );
      const e = u * u * (3 - 2 * u); // smoothstep
      focusOrbit.lat = startLat + (endLat - startLat) * e;
      focusOrbit.lon = startLon + (endLon - startLon) * e;
      let g = Number(resolveLookHeight(focusOrbit.lon, focusOrbit.lat));
      if (!isFinite(g) || g < 5) g = focusOrbit.height || 40;
      focusOrbit.height = g;
      focusOrbit.range = keepRange;
      if (isFinite(keepPitch)) focusOrbit.pitch = keepPitch;
      if (isFinite(keepHeading)) focusOrbit.heading = keepHeading;
      focusOrbitApply();
      if (u < 1) {
        focusOrbit._softRaf = requestAnimationFrame(step);
      } else {
        focusOrbit._softRaf = 0;
        if (!opts.silent) showToast(opts.toast || "Oraya · yükseklik korundu");
      }
    }
    focusOrbit._softRaf = requestAnimationFrame(step);
  }

  function focusOrbitWheel(deltaY) {
    tourPause({ silent: true });
    tourCancelCameraFlight();
    if (deltaY < 0) focusOrbit.range = Math.min(80000, focusOrbit.range * 1.2);
    else focusOrbit.range = Math.max(20, focusOrbit.range * 0.84);
    focusOrbitApply();
  }

  function focusOrbitWasd(dt) {
    const k = tourState.keys || {};
    let fwd = 0;
    let right = 0;
    const sp = Math.max(12, focusOrbit.range * 0.45) * dt;
    if (k.KeyW || k.ArrowUp) fwd += sp;
    if (k.KeyS || k.ArrowDown) fwd -= sp;
    if (k.KeyD) right += sp;
    if (k.KeyA) right -= sp;
    if (k.ArrowLeft) focusOrbit.heading -= 70 * dt;
    if (k.ArrowRight) focusOrbit.heading += 70 * dt;
    if (!fwd && !right && !k.ArrowLeft && !k.ArrowRight) return;
    if (fwd || right) {
      const mpdLat = 111320;
      const mpdLon =
        111320 * Math.max(0.2, Math.cos((focusOrbit.lat * Math.PI) / 180));
      const rad = (focusOrbit.heading * Math.PI) / 180;
      focusOrbit.lat +=
        (Math.cos(rad) * fwd - Math.sin(rad) * right) / mpdLat;
      focusOrbit.lon +=
        (Math.sin(rad) * fwd + Math.cos(rad) * right) / mpdLon;
      let g = Number(resolveLookHeight(focusOrbit.lon, focusOrbit.lat));
      if (isFinite(g) && g >= 5) focusOrbit.height = g;
    }
    tourPause({ silent: true });
    focusOrbitApply();
  }

  function tourCancelCameraFlight() {
    const viewer = liveCesiumViewer;
    if (!viewer || !viewer.camera) return;
    try {
      if (viewer.camera.cancelFlight) viewer.camera.cancelFlight();
    } catch (_) {}
  }

  function tourPause(opts) {
    opts = opts || {};
    if (!tourState.active) return;
    tourCancelCameraFlight();
    tourState.paused = true;
    tourState.auto = false;
    tourState.dragActive = false;
    tourState.dragThrust = 0;
    tourState.lastTs = 0;
    updateTourProgress();
    if (!opts.silent) showToast(opts.toast || "Durdu");
  }

  function syncAndRebuildFromCamera() {
    const viewer = liveCesiumViewer;
    if (!viewer || typeof Cesium === "undefined") return;
    try {
      const carto = Cesium.Cartographic.fromCartesian(viewer.camera.position);
      const lat = Cesium.Math.toDegrees(carto.latitude);
      const lon = Cesium.Math.toDegrees(carto.longitude);
      const hdg =
        (Cesium.Math.toDegrees(viewer.camera.heading) + 360) % 360;
      tourState.centerLat = lat;
      tourState.centerLon = lon;
      tourState.headingBias = 0;
      TARGET.lat = lat;
      TARGET.lon = lon;
      const pack = buildLocalTourPayload(
        tourState.label,
        tourState.tip,
        lat,
        lon,
        { bearing0: hdg, count: 32 }
      );
      if (!pack || !pack.waypoints || pack.waypoints.length < 2) return;
      tourState.waypoints = pack.waypoints;
      tourState.segIndex = 0;
      tourState.segT = 0;
      tourState.index = 0;
      tourState.lastTs = 0;
      tourState.totalSec = pack.waypoints.reduce(function (a, w) {
        return a + (Number(w.seg_sec) || 3);
      }, 0);
    } catch (_) {}
  }

  function tourResume(opts) {
    opts = opts || {};
    if (!tourState.active) return;
    if (walkState.on) exitWalkMode("");
    if (tourState._manualDirty) {
      syncAndRebuildFromCamera();
      tourState._manualDirty = false;
    }
    tourState.paused = false;
    tourState.auto = true;
    tourState.lastTs = 0;
    if (!tourState.removeTick) {
      try {
        attachTourTick();
      } catch (_) {}
    }
    showToast(opts.toast || "Devam");
    updateTourProgress();
  }

  function tourManualDrive(dx, dy) {
    focusOrbitDrag(dx, dy);
    tourState._manualDirty = true;
    updateTourProgress();
  }

  /** Tek tık: yumuşak git — yükseklik korunur */
  function tourFocusAndDescend(lat, lon) {
    if (!isFinite(Number(lat)) || !isFinite(Number(lon))) return;
    focusOrbitSoftGoto(lat, lon, { toast: "Odak · yükseklik korundu" });
  }

  /** Tur açılış: hedefte sabit orbit */
  function tourLockStartPose() {
    const lat = Number(tourState.centerLat) || Number(TARGET.lat);
    const lon = Number(tourState.centerLon) || Number(TARGET.lon);
    if (!isFinite(lat) || !isFinite(lon)) return;
    const eye = Math.max(
      tourIsCityishTip() ? 150 : 300,
      Number(tourState.forceRangeM) ||
        Number(tourState.bandMin) ||
        focusOrbitHeightForKind(tourState.tip)
    );
    focusOrbit.mode = "focus";
    focusOrbitSet(lat, lon, {
      range: eye,
      heading: 35,
      pitch: tourIsCityishTip() ? -42 : -36,
      silent: true,
    });
  }

  function tourSetSpeed(mult) {
    tourState.speed = Math.max(
      TOUR_SPEED_MIN,
      Math.min(TOUR_SPEED_MAX, Number(mult) || 1)
    );
    if (walkState.on) {
      walkState.speedMps = 1.4 * Math.max(0.5, tourState.speed / 0.4);
    }
    updateTourProgress();
    showToast("Hız ×" + tourState.speed.toFixed(1));
  }

  function tourSlower() {
    tourSetSpeed((tourState.speed || 1) * 0.75);
  }

  function tourFaster() {
    tourSetSpeed((tourState.speed || 1) * 1.33);
  }

  /** Çift tık: hız kademesi + otomatik devam */
  function tourCycleSpeedTierAndGo() {
    let i = Number(tourState.speedTierIndex);
    if (!isFinite(i) || i < 0) i = 1;
    i = (i + 1) % TOUR_SPEED_TIERS.length;
    tourState.speedTierIndex = i;
    const sp = TOUR_SPEED_TIERS[i];
    tourState.speed = sp;
    if (walkState.on) {
      walkState.speedMps = 1.4 * Math.max(0.5, sp / 0.4);
    }
    tourResume({
      toast:
        "Devam · kademe " +
        (i + 1) +
        "/" +
        TOUR_SPEED_TIERS.length +
        " · ×" +
        sp.toFixed(1),
    });
  }

  function tourCycleSpeed() {
    tourCycleSpeedTierAndGo();
  }

  function bearingDegBetween(lat1, lon1, lat2, lon2) {
    const φ1 = (Number(lat1) * Math.PI) / 180;
    const φ2 = (Number(lat2) * Math.PI) / 180;
    const Δλ = ((Number(lon2) - Number(lon1)) * Math.PI) / 180;
    const y = Math.sin(Δλ) * Math.cos(φ2);
    const x =
      Math.cos(φ1) * Math.sin(φ2) -
      Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
    return ((Math.atan2(y, x) * 180) / Math.PI + 360) % 360;
  }

  function pickGlobeLatLonFromEvent(ev) {
    const viewer = liveCesiumViewer;
    if (!viewer || !viewer.scene || typeof Cesium === "undefined") return null;
    try {
      const canvas = viewer.scene.canvas;
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return null;
      // CSS boyutu ≠ canvas buffer — oranla (DPI/iframe)
      const x = ((ev.clientX - rect.left) / rect.width) * canvas.clientWidth;
      const y = ((ev.clientY - rect.top) / rect.height) * canvas.clientHeight;
      const pt = new Cesium.Cartesian2(x, y);
      let cartesian = null;
      try {
        if (viewer.scene.pickPositionSupported) {
          cartesian = viewer.scene.pickPosition(pt);
        }
      } catch (_) {}
      if (!cartesian || !Cesium.defined(cartesian)) {
        try {
          const ray = viewer.camera.getPickRay(pt);
          if (ray) cartesian = viewer.scene.globe.pick(ray, viewer.scene);
        } catch (_) {}
      }
      if (!cartesian || !Cesium.defined(cartesian)) {
        try {
          cartesian = viewer.camera.pickEllipsoid(
            pt,
            viewer.scene.globe.ellipsoid
          );
        } catch (_) {}
      }
      if (!cartesian || !Cesium.defined(cartesian)) return null;
      const carto = Cesium.Cartographic.fromCartesian(cartesian);
      if (!carto) return null;
      return {
        lat: Cesium.Math.toDegrees(carto.latitude),
        lon: Cesium.Math.toDegrees(carto.longitude),
      };
    } catch (_) {
      return null;
    }
  }

  function tourGoTowardLatLon(lat, lon, toast) {
    if (!tourState.active) return;
    if (!isFinite(Number(lat)) || !isFinite(Number(lon))) return;
    if (walkState.on) exitWalkMode("");
    const cur = currentLookSample();
    const lat0 = cur
      ? Number(cur.look_lat != null ? cur.look_lat : cur.lat)
      : Number(tourState.centerLat);
    const lon0 = cur
      ? Number(cur.look_lon != null ? cur.look_lon : cur.lon)
      : Number(tourState.centerLon);
    const brg = bearingDegBetween(lat0, lon0, lat, lon);
    rebuildPathAhead(brg, toast || "Oraya doğru");
  }

  /** Tekerlek: orbit mesafesi (odak sabit) */
  function tourWheelZoom(deltaY) {
    if (!tourState.active) return;
    if (walkState.on) {
      if (Number(deltaY) < 0) exitWalkMode("");
      else {
        walkVertical(-1);
        return;
      }
    }
    focusOrbitWheel(deltaY);
    ensureTourFlightVisuals();
    const now = Date.now();
    if (now - (tourState._wheelToastTs || 0) > 400) {
      tourState._wheelToastTs = now;
      showToast(
        (Number(deltaY) < 0 ? "Uzaklaş · " : "Yakınlaş · ") +
          formatAltitude(focusOrbit.range)
      );
    }
  }

  /** Harekette uydu/terrain LOD boşalmasın */
  function ensureTourFlightVisuals() {
    const viewer = liveCesiumViewer;
    if (!viewer || !viewer.scene || !viewer.scene.globe) return;
    try {
      const globe = viewer.scene.globe;
      const qp = getHaritaQualityProfile();
      const fast = (Number(tourState.speed) || 1) > 1.25;
      globe.maximumScreenSpaceError = Math.min(
        qp.sse,
        qp.mobil ? (fast ? 1.6 : 1.9) : fast ? 0.72 : 0.85
      );
      globe.tileCacheSize = Math.max(
        Number(globe.tileCacheSize) || 0,
        qp.mobil ? 240 : fast ? 640 : 520
      );
      if (globe.preloadSiblings !== undefined) globe.preloadSiblings = true;
      if (globe.preloadAncestors !== undefined) globe.preloadAncestors = true;
      if (globe.loadingDescendantLimit !== undefined) {
        globe.loadingDescendantLimit = Math.max(
          Number(globe.loadingDescendantLimit) || 0,
          qp.mobil ? 3 : 6
        );
      }
      viewer.scene.requestRenderMode = false;
      try {
        if (viewer.scene.postProcessStages && viewer.scene.postProcessStages.fxaa) {
          viewer.scene.postProcessStages.fxaa.enabled = !!qp.fxaa;
        }
      } catch (_) {}
    } catch (_) {}
  }

  function tourRefreshCameraNow() {
    if (!tourState.active || !tourState.waypoints.length) return;
    const sample = sampleWaypointPair(
      tourState.segIndex,
      tourState.segT || 0
    );
    if (sample) applyCameraSample(sample);
    updateTourProgress();
  }

  function tourCloser() {
    if (walkState.on) {
      walkVertical(-1);
      return;
    }
    if (!tourState.active) {
      enterWalkMode("Göz hizası");
      return;
    }
    if (tourState.forceRangeM != null) {
      tourState.forceRangeM = Math.max(
        TOUR_RANGE_MIN,
        Number(tourState.forceRangeM) * 0.65
      );
    } else {
      tourState.rangeMult = Math.max(
        TOUR_RANGE_MULT_MIN,
        (Number(tourState.rangeMult) || 1) * 0.65
      );
    }
    tourRefreshCameraNow();
    if (
      (tourState.forceRangeM != null && tourState.forceRangeM <= 4) ||
      (tourState.liveRangeM > 0 && tourState.liveRangeM <= 8)
    ) {
      enterWalkMode("Göz hizasına indi");
      return;
    }
    showToast("Alçaldı · " + formatAltitude(tourState.liveRangeM));
  }

  function tourFarther() {
    // Yürüme/yeraltı (1.7 m gri) iken "yukarı" → güvenli kuş irtifasına çık
    if (walkState.on) {
      const live = Number(tourState.liveRangeM) || 0;
      if (tourIsCityishTip() || live < 12) {
        exitWalkMode();
        tourState.forceRangeM = Math.max(80, live * 1.55, 60);
        tourState.rangeMult = 1;
        tourRefreshCameraNow();
        showToast("Yükseldi · " + formatAltitude(tourState.liveRangeM));
        return;
      }
      walkVertical(1);
      return;
    }
    if (!tourState.active) return;
    if (tourState.forceRangeM != null) {
      tourState.forceRangeM = Math.min(
        TOUR_RANGE_MAX,
        Number(tourState.forceRangeM) * 1.55
      );
    } else if (tourIsCityishTip()) {
      // Şehirde rangeMult yerine irtifa (göz yüksekliği) büyüt
      const cur = Math.max(
        35,
        Number(tourState.liveRangeM) || Number(tourState.bandMin) || 60
      );
      tourState.forceRangeM = Math.min(TOUR_RANGE_MAX, cur * 1.55);
    } else {
      tourState.rangeMult = Math.min(
        TOUR_RANGE_MULT_MAX,
        (Number(tourState.rangeMult) || 1) * 1.55
      );
    }
    tourRefreshCameraNow();
    showToast("Yükseldi · " + formatAltitude(tourState.liveRangeM));
  }

  function tourSetAltitude(meters) {
    if (!tourState.active) return;
    const m = Number(meters);
    if (!isFinite(m)) return;
    if (m <= 3.5) {
      enterWalkMode("Göz hizası · " + formatAltitude(WALK_EYE_M));
      return;
    }
    if (walkState.on) exitWalkMode();
    tourState.forceRangeM = Math.max(
      TOUR_RANGE_MIN,
      Math.min(TOUR_RANGE_MAX, m)
    );
    tourRefreshCameraNow();
    showToast("Mesafe " + formatAltitude(tourState.forceRangeM));
  }

  function tourAltitudeReset() {
    if (!tourState.active) return;
    tourState.forceRangeM = null;
    tourState.rangeMult = 1;
    tourRefreshCameraNow();
    showToast("Kuş irtifası · " + formatAltitude(tourState.liveRangeM));
  }

  function currentLookSample() {
    if (!tourState.waypoints.length) return null;
    return sampleWaypointPair(tourState.segIndex, tourState.segT || 0);
  }

  function rebuildPathAhead(bearingDeg, toast) {
    if (!tourState.active) {
      showToast("Önce geziyi başlat");
      return;
    }
    const cur = currentLookSample();
    const lat = cur
      ? Number(cur.look_lat != null ? cur.look_lat : cur.lat)
      : tourState.centerLat;
    const lon = cur
      ? Number(cur.look_lon != null ? cur.look_lon : cur.lon)
      : tourState.centerLon;
    const tip =
      tourState.steerMode === "nehir"
        ? "nehir"
        : tourState.steerMode === "sehir"
          ? "sehir"
          : tourState.steerMode === "kiyi"
            ? "ada"
            : tourState.steerMode === "volkan"
              ? "volkan"
              : tourState.steerMode === "kanyon"
                ? "kanyon"
                : tourState.tip;
    const pack = buildLocalTourPayload(tourState.label, tip, lat, lon, {
      bearing0: Number(bearingDeg) || 0,
      count: 32,
    });
    if (!pack || !pack.waypoints || pack.waypoints.length < 2) return;
    tourState.waypoints = pack.waypoints;
    tourState.segIndex = 0;
    tourState.segT = 0;
    tourState.headingBias = 0;
    tourState.paused = false;
    tourState.auto = true;
    tourState.lastTs = 0;
    tourState.totalSec = pack.waypoints.reduce(function (a, w) {
      return a + (Number(w.seg_sec) || 10);
    }, 0);
    const sample = sampleWaypointPair(0, 0);
    if (sample) {
      if (tourState.forceRangeM != null) sample.range = tourState.forceRangeM;
      else if (tourState.rangeMult && tourState.rangeMult !== 1) {
        sample.range = Math.max(20, Number(sample.range) * tourState.rangeMult);
      }
      applyCameraSample(sample);
    }
    updateTourProgress();
    scheduleNarration(true);
    if (toast) showToast(toast);
  }

  function tourCurrentHeading() {
    const cur = currentLookSample();
    return (
      (Number((cur && cur.heading) || 0) + Number(tourState.headingBias || 0) + 360) %
      360
    );
  }

  function tourTurn(dir) {
    if (!tourState.active) return;
    if (walkState.on) {
      walkLookTurn(dir);
      return;
    }
    const delta = dir < 0 ? -40 : 40;
    rebuildPathAhead(
      (tourCurrentHeading() + delta + 360) % 360,
      dir < 0 ? "Sola" : "Sağa"
    );
  }

  function tourForward() {
    if (!tourState.active) return;
    if (walkState.on) {
      walkStepForward(false);
      return;
    }
    rebuildPathAhead(tourCurrentHeading(), "İleri");
    tourState.speed = Math.min(
      TOUR_SPEED_MAX,
      Math.max(0.85, (Number(tourState.speed) || 0.9) * 1.12)
    );
  }

  function tourBack() {
    if (!tourState.active) return;
    if (walkState.on) {
      walkStepForward(true);
      return;
    }
    rebuildPathAhead((tourCurrentHeading() + 180) % 360, "Geri");
  }

  function tourStrafe(dir) {
    if (!tourState.active) return;
    if (walkState.on) {
      walkStrafe(dir);
      return;
    }
    rebuildPathAhead(
      (tourCurrentHeading() + (dir < 0 ? -90 : 90) + 360) % 360,
      dir < 0 ? "Sola kay" : "Sağa kay"
    );
  }

  function tourSetSteerMode(mode, toast) {
    if (!tourState.active) {
      showToast("Önce geziyi başlat");
      return;
    }
    tourState.steerMode = mode || null;
    const cur = currentLookSample();
    const h = Number((cur && cur.heading) || 0);
    rebuildPathAhead(h, toast || "Yön değişti");
  }

  function scheduleNarration(force) {
    if (!tourState.active || tourState.narrBusy) return;
    const now = Date.now();
    if (!force && now - (tourState.narrTs || 0) < 5000) return;
    const cur = currentLookSample();
    if (!cur) return;
    const lat = Number(cur.look_lat != null ? cur.look_lat : cur.lat);
    const lon = Number(cur.look_lon != null ? cur.look_lon : cur.lon);
    if (!isFinite(lat) || !isFinite(lon)) return;
    tourState.narrBusy = true;
    tourState.narrTs = now;
    const root = apiRoot();
    if (!root) {
      tourState.narrBusy = false;
      const tipLab = tourState.steerMode || tourState.tip || "keşif";
      setTourInfo(
        tourState.label || "Dünya Gezgini",
        tipLab + " · " + formatAltitude(tourState.liveRangeM)
      );
      return;
    }
    fetch(
      root +
        "/api/sahne/harita/reverse?lat=" +
        encodeURIComponent(lat) +
        "&lon=" +
        encodeURIComponent(lon) +
        "&network=1"
    )
      .then(function (r) {
        return r.json();
      })
      .then(function (d) {
        tourState.narrBusy = false;
        if (!tourState.active) return;
        const short =
          (d && (d.short || d.label)) ||
          tourState.placeLabel ||
          tourState.label ||
          "";
        tourState.placeLabel = String(short).split(",")[0].trim() || tourState.label;
        tourState.phaseLabel = tourState.placeLabel;
        const tipLab = tourState.steerMode || tourState.tip || "";
        setTourInfo(
          tourState.label || "Dünya Gezgini",
          tourState.placeLabel +
            (tipLab ? " · " + tipLab : "") +
            " · " +
            formatAltitude(tourState.liveRangeM)
        );
        updateTourProgress();
      })
      .catch(function () {
        tourState.narrBusy = false;
      });
  }

  function phaseSeek(delta) {
    if (!tourState.active || !tourState.waypoints.length) return;
    const phases = [];
    let last = "";
    for (let i = 0; i < tourState.waypoints.length; i++) {
      const ph = String(tourState.waypoints[i].phase || "");
      if (ph && ph !== last) {
        phases.push({ phase: ph, index: i });
        last = ph;
      }
    }
    if (!phases.length) return;
    let cur = 0;
    for (let i = 0; i < phases.length; i++) {
      if (phases[i].index <= tourState.segIndex) cur = i;
    }
    const next = Math.max(0, Math.min(phases.length - 1, cur + delta));
    tourState.segIndex = phases[next].index;
    tourState.segT = 0;
    tourState.paused = false;
    tourState.auto = true;
    // elapsed yeniden hesapla
    let el = 0;
    for (let i = 0; i < tourState.segIndex; i++) {
      el += Number(tourState.waypoints[i].seg_sec) || 4;
    }
    tourState.elapsed = el;
    tourState.progress = tourState.totalSec
      ? Math.min(0.999, el / tourState.totalSec)
      : 0;
    const sample = sampleWaypointPair(tourState.segIndex, 0);
    if (sample) {
      tourState.phaseLabel = sample.phase_label || "";
      applyCameraSample(sample);
    }
    updateTourProgress();
  }

  function tourNext() {
    phaseSeek(1);
    showToast("Sonraki bölüm");
  }

  function tourPrev() {
    phaseSeek(-1);
    showToast("Önceki bölüm");
  }

  function tourSkip() {
    tourNext();
  }

  function extendExplorationPath() {
    const wps = tourState.waypoints;
    if (!wps || !wps.length) return;
    const last = wps[wps.length - 1];
    // Şehirde son noktadan devam = Boğaz'a kaçış. Merkez etrafında dön.
    const cityish = tourIsCityishTip(
      tourState.steerMode === "sehir" ? "sehir" : tourState.tip
    );
    const seedLat = cityish
      ? Number(tourState.centerLat) || Number(last.lat)
      : Number(last.look_lat != null ? last.look_lat : last.lat);
    const seedLon = cityish
      ? Number(tourState.centerLon) || Number(last.lon)
      : Number(last.look_lon != null ? last.look_lon : last.lon);
    const pack = buildLocalTourPayload(
      tourState.label,
      tourState.steerMode === "nehir"
        ? "nehir"
        : tourState.steerMode === "sehir"
          ? "sehir"
          : tourState.steerMode === "kiyi"
            ? "ada"
            : tourState.steerMode === "volkan"
              ? "volkan"
              : tourState.steerMode === "kanyon"
                ? "kanyon"
                : tourState.tip,
      seedLat,
      seedLon,
      {
        bearing0:
          (Number(last.heading || 0) +
            Number(tourState.headingBias || 0) +
            (cityish ? 40 : 0)) %
          360,
        count: 28,
      }
    );
    if (!pack || !pack.waypoints || pack.waypoints.length < 2) return;
    // İlk nokta mevcutla örtüşmesin diye 1'den ekle
    const extra = pack.waypoints.slice(1);
    tourState.waypoints = wps.concat(extra);
    tourState.totalSec += extra.reduce(function (a, w) {
      return a + (Number(w.seg_sec) || 3);
    }, 0);
  }

  function tickContinuousFlight(ts) {
    if (!tourState.active) return;
    if (tourState.paused) {
      tourState.lastTs = 0;
      return;
    }
    let wps = tourState.waypoints;
    if (!wps || wps.length < 2) {
      tourStopAll();
      return;
    }
    // Son 4 segmente gelince yolu uzat — bitiş yok
    if (tourState.endless && tourState.segIndex >= wps.length - 4) {
      extendExplorationPath();
      wps = tourState.waypoints;
    }
    if (!tourState.lastTs) {
      tourState.lastTs = ts;
      return;
    }
    let dt = (ts - tourState.lastTs) / 1000;
    tourState.lastTs = ts;
    if (dt > 0.08) dt = 0.08;
    if (dt < 0) dt = 0;

    // Basılı tuşlar + maus sürükleme: çekilen yöne yürü
    const k = tourState.keys || {};
    const holdW = !!(k.KeyW || k.ArrowUp);
    const holdS = !!(k.KeyS || k.ArrowDown);
    const holdA = !!(k.KeyA || k.ArrowLeft);
    const holdD = !!(k.KeyD || k.ArrowRight);
    const dragOn = !!tourState.dragActive;
    if (holdA) tourState.headingBias = (Number(tourState.headingBias) || 0) - 95 * dt;
    if (holdD) tourState.headingBias = (Number(tourState.headingBias) || 0) + 95 * dt;
    if (dragOn) {
      // Sürükleme yönü = gidiş yönü (ekran: sağ +, yukarı = ileri)
      const turn = Number(tourState.dragTurn) || 0;
      const fwd = Number(tourState.dragFwd) || 0;
      tourState.headingBias =
        (Number(tourState.headingBias) || 0) + turn * 1.15 * dt * 60;
      tourState.dragTurn *= 0.72;
      tourState.dragFwd *= 0.82;
      tourState._steerAcc = (tourState._steerAcc || 0) + dt;
      const needRebuild =
        Math.abs(turn) > 0.35 || Math.abs(fwd) > 0.5 || tourState._steerAcc > 0.4;
      if (needRebuild && tourState._steerAcc > 0.32) {
        tourState._steerAcc = 0;
        if (fwd < -0.8 && Math.abs(fwd) > Math.abs(turn) + 0.2) {
          rebuildPathAhead((tourCurrentHeading() + 180) % 360, null);
        } else {
          rebuildPathAhead(tourCurrentHeading(), null);
        }
        wps = tourState.waypoints;
        ensureTourFlightVisuals();
      }
    } else if (holdA || holdD) {
      tourState._steerAcc = (tourState._steerAcc || 0) + dt;
      const steerGap = (Number(tourState.speed) || 1) > 1.25 ? 0.75 : 0.5;
      if (tourState._steerAcc > steerGap) {
        tourState._steerAcc = 0;
        rebuildPathAhead(tourCurrentHeading(), null);
        wps = tourState.waypoints;
        ensureTourFlightVisuals();
      }
    }
    if (k.KeyQ || k.PageDown) {
      const cur = Math.max(18, Number(tourState.liveRangeM) || 60);
      tourState.forceRangeM = Math.max(12, cur * (1 - 0.55 * dt));
    }
    if (k.KeyE || k.PageUp) {
      const cur = Math.max(
        18,
        Number(tourState.forceRangeM) || Number(tourState.liveRangeM) || 60
      );
      tourState.forceRangeM = Math.min(TOUR_RANGE_MAX, cur * (1 + 0.7 * dt));
    }

    let rate = (tourState.speed || 0.9) * TOUR_BASE_RATE;
    if (holdW) rate *= 1.85;
    if (holdS) rate *= 1.55;
    if (dragOn) {
      const thrust = Math.max(
        0.35,
        Math.min(1.8, Number(tourState.dragThrust) || 0.8)
      );
      const fwd = Number(tourState.dragFwd) || 0;
      // İleri/geri çekince mutlaka aksın
      rate *= 2.1 * thrust * (fwd < -0.5 ? 1.35 : 1.55);
    }
    // Şehirde yavaş “donmuş uydu” hissi olmasın
    if (tourIsCityishTip() && rate < 0.85) rate = 0.85;
    dt *= rate;

    let seg = tourState.segIndex;
    let t = tourState.segT;
    let remainDt = dt;
    while (remainDt > 0 && seg < wps.length - 1) {
      const segDur = Math.max(
        0.4,
        Number(wps[seg + 1].seg_sec) || Number(wps[seg].seg_sec) || 3
      );
      const left = (1 - t) * segDur;
      if (remainDt < left) {
        t += remainDt / segDur;
        tourState.elapsed += remainDt;
        remainDt = 0;
      } else {
        tourState.elapsed += left;
        remainDt -= left;
        seg += 1;
        t = 0;
      }
    }
    // Hâlâ sondaysa uzat ve devam
    if (tourState.endless && seg >= wps.length - 1) {
      extendExplorationPath();
      wps = tourState.waypoints;
      if (seg >= wps.length - 1) seg = Math.max(0, wps.length - 2);
      t = 0;
    }
    tourState.segIndex = seg;
    tourState.segT = Math.max(0, Math.min(1, t));
    tourState.index = seg;
    tourState.progress = tourState.endless
      ? 0
      : tourState.totalSec
        ? Math.min(1, tourState.elapsed / tourState.totalSec)
        : seg / Math.max(1, wps.length - 1);

    const sample = sampleWaypointPair(seg, tourState.segT);
    if (sample) {
      if (tourState.headingBias) {
        sample.heading = (Number(sample.heading) + Number(tourState.headingBias)) % 360;
      }
      if (tourState.forceRangeM != null) sample.range = tourState.forceRangeM;
      else if (tourState.rangeMult && tourState.rangeMult !== 1) {
        sample.range = Math.max(20, Number(sample.range || 80) * tourState.rangeMult);
      }
      applyCameraSample(sample);
    }
    tourState.flying = true;
    updateTourProgress();
    scheduleNarration(false);
    // Tur sırasında beyaz kutu + sokak adı (yalnızca yürüyüşe bırakma)
    tourState._binaTick = (tourState._binaTick || 0) + 1;
    const fastFlight = (Number(tourState.speed) || 1) > 1.25;
    const binaEvery = fastFlight ? 160 : 100;
    if (tourState._binaTick % 120 === 1) ensureTourFlightVisuals();
    if (!walkState.buildingsBusy && tourState._binaTick % binaEvery === 0) {
      try {
        walkEnsureBuildings(false);
      } catch (_) {}
      try {
        if (walkState.labelsOn && !fastFlight) walkRefreshLabels(false);
      } catch (_) {}
    }
  }

  function attachTourTick() {
    detachTourTick();
    const viewer = liveCesiumViewer;
    if (!viewer || !viewer.scene) return;
    try {
      // Tur sırasında sürekli render — requestRenderMode uçuşu dondurmasın
      viewer.scene.requestRenderMode = false;
    } catch (_) {}
    // rAF birincil saat: preRender tek başına requestRenderMode/idle'da donabiliyordu
    function rafLoop(ts) {
      if (!tourState.active) {
        tourRafId = 0;
        return;
      }
      const now =
        typeof ts === "number"
          ? ts
          : typeof performance !== "undefined" && performance.now
            ? performance.now()
            : Date.now();
      // Dururken WASD; log seyrek
      if (tourState.paused) {
        const last = tourState._wasdTs || now;
        const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
        tourState._wasdTs = now;
        focusOrbitWasd(dt);
        if ((focusOrbit.logN || 0) % 30 === 0) focusOrbitLog();
        focusOrbitEnsureOnScreen();
      } else {
        tourState._wasdTs = now;
        tickContinuousFlight(now);
      }
      try {
        viewer.scene.requestRender();
      } catch (_) {}
      tourRafId = requestAnimationFrame(rafLoop);
    }
    tourRafId = requestAnimationFrame(rafLoop);
    tourState.removeTick = function () {
      if (tourRafId) {
        try {
          cancelAnimationFrame(tourRafId);
        } catch (_) {}
        tourRafId = 0;
      }
    };
  }

  function startContinuousFlight() {
    if (!tourState.active || tourState.waypoints.length < 2) {
      showToast("Uçuş yolu yok");
      tourStopAll();
      return;
    }
    if (cinemaUnlockTimer) {
      clearTimeout(cinemaUnlockTimer);
      cinemaUnlockTimer = 0;
    }
    try {
      if (liveCesiumViewer && liveCesiumViewer.camera && liveCesiumViewer.camera.cancelFlight) {
        liveCesiumViewer.camera.cancelFlight();
      }
    } catch (_) {}
    tourState.segIndex = 0;
    tourState.segT = 0;
    tourState.elapsed = 0;
    tourState.progress = 0;
    tourState.lastTs = 0;
    setTourNativeControls(false);
    tourLockStartPose();
    const first = sampleWaypointPair(0, 0);
    if (first) {
      tourState.phaseLabel = first.phase_label || "Başlangıç";
      // Başlangıç karesi merkezde; yol hazır ama otomatik akış kapalı
      if (!tourState.forceRangeM) applyCameraSample(first);
    }
    updateTourProgress();
    ensureTourFlightVisuals();
    attachTourTick();
    // Açılışta DUR — kontrol sende; çift tık / «devam» ile akar
    tourPause({ silent: true });
    showToast(
      "Başlangıç · tut=elle gez · tık=odak · çift tık=devam"
    );
    // Terrain gelince başlangıç karesini bir kez daha kilitle
    setTimeout(function () {
      if (!tourState.active || !tourState.paused) return;
      tourLockStartPose();
    }, 900);
  }

  function bearingOffset(lat0, lon0, bearingDeg, distDeg) {
    const rad = (bearingDeg * Math.PI) / 180;
    const cosLat = Math.max(0.2, Math.cos((lat0 * Math.PI) / 180));
    return {
      lat: lat0 + distDeg * Math.cos(rad),
      lon: lon0 + (distDeg * Math.sin(rad)) / cosLat,
    };
  }

  function phaseAt(i, n) {
    const t = n <= 1 ? 0 : i / Math.max(1, n - 1);
    if (t < 0.22) return { id: "baslangic", label: "Başlangıç" };
    if (t < 0.55) return { id: "kesif", label: "Keşif" };
    if (t < 0.82) return { id: "onemli", label: "Önemli Noktalar" };
    return { id: "genel", label: "Genel Bakış" };
  }

  function guessTourTip(tip, place) {
    // Anayasa: yer adı listesi yok — sınıf ipuçları
    const t = String(tip || "").toLowerCase();
    if (
      /^(dag|gecit|vadi|kanyon|gol|nehir|volkan|selale|delta|col|ada|sirt|sehir|bogaz)$/.test(
        t
      )
    ) {
      return t;
    }
    if (/^(il|ilce|mahalle|city|town)$/.test(t)) return "sehir";
    const blob = String(place || "").toLowerCase();
    if (/nehir|irmak|river|çay|cayi/.test(blob)) return "nehir";
    if (/kanyon|canyon|gorge/.test(blob)) return "kanyon";
    if (/volkan|yanarda|volcano|crater|krater/.test(blob)) return "volkan";
    if (/ada|island|isle/.test(blob)) return "ada";
    if (/g[oö]l|lake|lagoon/.test(blob)) return "gol";
    if (/bogaz|strait|bosphorus|channel/.test(blob)) return "bogaz";
    if (/sehir|kent|city|town|şehir/.test(blob)) return "sehir";
    if (/da[gğ]|peak|mount|mountain|ridge|sirt/.test(blob)) return "dag";
    return t || "sehir";
  }

  function bandAlt(tipL, t) {
    const b = ALT_BANDS[tipL] || [50, 250];
    const u = Math.max(0, Math.min(1, t));
    const mix = 0.35 + 0.65 * (0.5 - 0.5 * Math.cos(u * Math.PI * 2));
    return b[0] + (b[1] - b[0]) * mix;
  }

  /** Yerel sürekli keşif tohumu (API yoksa / uzatma) */
  function buildLocalTourPayload(place, tip, lat, lon, opts) {
    opts = opts || {};
    const la = Number(lat);
    const lo = Number(lon);
    if (!isFinite(la) || !isFinite(lo)) return null;
    const tipL = guessTourTip(tip, place);
    const name = String(place || "Keşif");
    const steps = Math.max(12, Number(opts.count) || 32);
    const bearing0 = opts.bearing0 != null ? Number(opts.bearing0) : null;
    const wps = [];
    function pushWp(look, heading, pitch, range, seg, section) {
      wps.push({
        lat: look.lat,
        lon: look.lon,
        look_lat: look.lat,
        look_lon: look.lon,
        heading: heading,
        pitch: pitch,
        range: range,
        seg_sec: seg,
        section: section,
        phase: "",
        phase_label: section,
        info: name + " · " + section,
      });
    }
    if (tipL === "nehir" || tipL === "delta") {
      const flow = bearing0 != null ? bearing0 : 18;
      for (let i = 0; i < steps; i++) {
        const t = i / (steps - 1);
        const along = 0.02 + 0.85 * t;
        const pt = bearingOffset(la, lo, flow, along);
        const meander = 0.03 * Math.sin(t * Math.PI * 3.1);
        const look = bearingOffset(pt.lat, pt.lon, flow + 90, meander);
        pushWp(
          look,
          (flow + 6) % 360,
          -18,
          bandAlt(tipL, t),
          10.0,
          "nehir"
        );
      }
    } else if (tipL === "sehir" || tipL === "bogaz") {
      // Şehir: kısa yay; seg kısa → akış/yürüme hissedilir
      const flow = bearing0 != null ? bearing0 : 55;
      const maxAlong = tipL === "bogaz" ? 0.014 : 0.011;
      for (let i = 0; i < steps; i++) {
        const t = i / (steps - 1);
        const along = 0.0012 + maxAlong * t;
        const side = 0.0022 * Math.sin(t * Math.PI * 2.2);
        const pt = bearingOffset(la, lo, flow, along);
        const look = bearingOffset(pt.lat, pt.lon, flow + 90, side);
        let rng = bandAlt(tipL === "bogaz" ? "bogaz" : "sehir", t);
        if (Math.floor(i / 5) % 2 === 1) rng = Math.max(28, rng * 0.72);
        pushWp(
          look,
          (flow + 6 + 8 * Math.sin(t * 3)) % 360,
          -16,
          rng,
          2.6,
          "sehir"
        );
      }
    } else if (tipL === "ada" || tipL === "gol") {
      const baseAng = bearing0 != null ? bearing0 : 200;
      for (let i = 0; i < steps; i++) {
        const t = i / (steps - 1);
        const ang = baseAng + 360 * t;
        const r = 0.04 * (0.85 + 0.3 * t);
        pushWp(
          bearingOffset(la, lo, ang, r),
          (ang + 180) % 360,
          -18,
          bandAlt(tipL, t),
          10.0,
          "kiyi"
        );
      }
    } else if (tipL === "kanyon" || tipL === "vadi" || tipL === "gecit") {
      const axis = bearing0 != null ? bearing0 : tipL === "kanyon" ? 115 : 95;
      for (let i = 0; i < steps; i++) {
        const t = i / (steps - 1);
        const along = 0.02 + 0.8 * t;
        const look = bearingOffset(la, lo, axis, along);
        const depth = Math.abs(Math.sin(t * Math.PI * 1.4));
        pushWp(
          look,
          axis % 360,
          -16 - 4 * depth,
          bandAlt(tipL === "kanyon" ? "kanyon" : tipL, depth),
          9.5,
          "koridor"
        );
      }
    } else if (tipL === "volkan") {
      for (let i = 0; i < steps; i++) {
        const t = i / (steps - 1);
        const ang = (bearing0 != null ? bearing0 : 200) + 400 * t;
        const dist = 0.06 * (1 - 0.5 * Math.sin(t * Math.PI)) + 0.012;
        let rng = bandAlt("volkan", t);
        if (t > 0.35 && t < 0.55) rng = Math.max(55, rng * 0.7);
        pushWp(
          bearingOffset(la, lo, ang, dist),
          (ang + 180) % 360,
          -18,
          rng,
          10.0,
          "volkan"
        );
      }
    } else {
      const approach = bearing0 != null ? bearing0 : 200;
      for (let i = 0; i < steps; i++) {
        const t = i / (steps - 1);
        const ang = approach + 50 * Math.sin(t * Math.PI * 2) + 180 * t;
        const dist =
          0.07 * (1 - 0.65 * t) + 0.018 + 0.025 * Math.abs(Math.sin(t * Math.PI * 3));
        pushWp(
          bearingOffset(la, lo, ang, dist),
          (ang + 180) % 360,
          -18,
          bandAlt("dag", t),
          10.5,
          "dag"
        );
      }
    }
    if (wps.length < 2) return null;
    const band = ALT_BANDS[tipL] || [50, 250];
    return {
      ok: true,
      label: name,
      tip: tipL,
      lat: la,
      lon: lo,
      waypoints: wps,
      stops: [],
      continuous: true,
      endless: true,
      cinematic: true,
      class_based: true,
      flight: {
        mode: "endless",
        style: "local:" + tipL,
        bird_default: true,
        min_range_m: band[0],
        max_range_m: band[1],
        until_stop: true,
        extendable: true,
      },
      local_fallback: true,
    };
  }

  function normalizeTourWaypoints(tour) {
    if (tour && tour.waypoints && tour.waypoints.length >= 2) {
      return tour.waypoints.slice();
    }
    // Eski payload: stops → sürekli yol (dwell yok)
    const stops = (tour && tour.stops) || [];
    if (stops.length < 2) return stops.slice();
    return stops.map(function (s, i) {
      return {
        lat: s.lat,
        lon: s.lon,
        heading: s.heading,
        pitch: s.pitch,
        range: s.range,
        phase: s.phase,
        phase_label: s.phase_label || s.title,
        seg_sec: i === 0 ? 3.5 : Math.max(3.5, Number(s.dwell_sec) || 4),
        look_lat: s.look_lat != null ? s.look_lat : s.lat,
        look_lon: s.look_lon != null ? s.look_lon : s.lon,
        info: s.info || "",
      };
    });
  }

  function startTourWithPayload(tour) {
    let pack = tour;
    let wps = normalizeTourWaypoints(pack);
    if (!wps || wps.length < 2) {
      pack = buildLocalTourPayload(
        (tour && tour.label) || q.get("tour_place") || label,
        (tour && tour.tip) || tipQ || TARGET.tip,
        (tour && tour.lat) != null ? tour.lat : TARGET.lat,
        (tour && tour.lon) != null ? tour.lon : TARGET.lon
      );
      wps = normalizeTourWaypoints(pack);
    }
    if (!wps || wps.length < 2) {
      showToast("Tur uçuş yolu yok");
      return;
    }
    clearTourTimer();
    detachTourTick();
    if (cinemaUnlockTimer) {
      clearTimeout(cinemaUnlockTimer);
      cinemaUnlockTimer = 0;
    }
    tourState.active = true;
    tourState.paused = false;
    tourState.auto = true;
    tourState.index = 0;
    tourState.waypoints = wps;
    tourState.stops =
      pack.stops && pack.stops.length ? pack.stops.slice() : wps.slice(0, 4);
    tourState.label = pack.label || "Dünya Gezgini";
    tourState.tip = String(pack.tip || guessTourTip(null, tourState.label) || "dag");
    tourState.card = null;
    tourState.speed = tourIsCityishTip(pack.tip) ? 1.15 : 0.85;
    tourState.speedTierIndex = tourIsCityishTip(pack.tip) ? 2 : 1;
    tourState.dragActive = false;
    tourState.dragThrust = 0;
    tourState._manualDirty = false;
    tourState.rangeMult = 1;
    tourState.forceRangeM = null;
    tourState.liveRangeM = 0;
    tourState.continuous = true;
    tourState.endless = pack.endless !== false;
    tourState.headingBias = 0;
    tourState.steerMode = null;
    tourState.centerLat = Number(pack.lat) || TARGET.lat;
    tourState.centerLon = Number(pack.lon) || TARGET.lon;
    if (isFinite(tourState.centerLat) && isFinite(tourState.centerLon)) {
      TARGET.lat = tourState.centerLat;
      TARGET.lon = tourState.centerLon;
    }
    const band = ALT_BANDS[tourState.tip] || [50, 250];
    tourState.bandMin = Number((pack.flight && pack.flight.min_range_m) || band[0]);
    tourState.bandMax = Number((pack.flight && pack.flight.max_range_m) || band[1]);
    tourState.totalSec = wps.reduce(function (acc, w) {
      return acc + (Number(w.seg_sec) || 3);
    }, 0);
    setTourBarOn(true);
    setTourCinema(true);
    renderTourCard(null);
    updateTourProgress();
    tourState.placeLabel = "";
    tourState.narrTs = 0;
    setTourInfo(tourState.label, "Konum doğrulanıyor…");
    showToast("Başlangıç hazır · tutarak gez");
    scheduleNarration(true);
    walkState.labelsOn = true;
    walkState.panoAuto = false; // Mapillary şeridi/overlay turu bozmasın
    walkState.panoFillOn = false;
    walkState.panoUserClosed = true;
    if (walkState.on) exitWalkMode("");
    // Şehir kuşu: göz hizasına düşmesin
    if (tourIsCityishTip(pack.tip)) {
      tourState.forceRangeM = Math.max(
        75,
        Number(tourState.bandMin) || 80
      );
    }
    tourState._binaTick = 0;
    wireTourMousePilot();
    wireTourKeys();
    tourState.keys = Object.create(null);
    let tries = 0;
    function kick() {
      tries += 1;
      if (!liveCesiumViewer) {
        if (tries < 40) setTimeout(kick, 250);
        else showToast("Cesium hazır değil");
        return;
      }
      try {
        liveCesiumViewer.scene.requestRenderMode = false;
      } catch (_) {}
      // Canvas kesin var — tut-sürükle pan’ı yeniden bağla
      try {
        wireTourMousePilot._on = false;
        wireTourMousePilot._bindKey = "";
        wireTourMousePilot();
        setTourNativeControls(false);
      } catch (_) {}
      // Beyaz kutu + sokak adı — tur başında hemen
      try {
        const cityWarm = guessSehirFromLabel();
        const root = apiRoot();
        if (root && cityWarm) {
          fetch(root + "/api/sehir-ikiz/warm?sehir=" + encodeURIComponent(cityWarm), {
            method: "POST",
          }).catch(function () {});
        }
        walkEnsureBuildings(true);
        walkRefreshLabels(true);
      } catch (_) {}
      if (!terrainOn) {
        terrainOn = true;
        const el = document.getElementById("lpTerrain");
        if (el) el.checked = true;
        applyCesiumTerrain(liveCesiumViewer, true);
        setTimeout(startContinuousFlight, 500);
      } else {
        startContinuousFlight();
      }
    }
    kick();
  }

  function placeLooksTurkey(place) {
    const p = String(place || "")
      .toLowerCase()
      .replace(/i̇/g, "i");
    return /istanbul|ankara|izmir|bursa|turkiye|t\u00fcrkiye|halkali|halkal\u0131|atakent|beyoglu|galata|talimhane|taksim/.test(
      p
    );
  }

  function coordsInTurkey(lat, lon) {
    const a = Number(lat);
    const o = Number(lon);
    return isFinite(a) && isFinite(o) && a >= 35.8 && a <= 42.3 && o >= 25.5 && o <= 45.0;
  }

  function fetchAndStartTour(place, tip, lat, lon) {
    // TR yer adı + yurt dışı koordinat (eski İtalya TARGET) → lat/lon at, sunucu geocode etsin
    let useLat = lat;
    let useLon = lon;
    if (
      placeLooksTurkey(place) &&
      useLat != null &&
      useLon != null &&
      !coordsInTurkey(useLat, useLon)
    ) {
      useLat = null;
      useLon = null;
      showToast("Konum düzeltiliyor · Türkiye");
    }
    const local = function () {
      const pack = buildLocalTourPayload(place, tip, useLat, useLon);
      if (pack) startTourWithPayload(pack);
      else showToast("Tur yüklenemedi · konumu yeniden söyle");
    };
    let url = apiRoot() + "/api/sahne/harita/tur?place=" + encodeURIComponent(place || "");
    if (tip) url += "&tip=" + encodeURIComponent(tip);
    if (useLat != null && useLon != null) {
      url += "&lat=" + encodeURIComponent(useLat) + "&lon=" + encodeURIComponent(useLon);
    }
    // apiRoot boşsa (file://) doğrudan yerel spline
    if (!apiRoot()) {
      local();
      return;
    }
    fetch(url)
      .then(function (r) {
        return r.json();
      })
      .then(function (d) {
        if (
          !d ||
          !d.ok ||
          (!(d.waypoints && d.waypoints.length >= 2) &&
            !(d.stops && d.stops.length >= 2))
        ) {
          local();
          return;
        }
        // Sunucu TR dışı dönerse ve yer TR ise yine reddet
        if (
          placeLooksTurkey(place) &&
          d.lat != null &&
          d.lon != null &&
          !coordsInTurkey(d.lat, d.lon)
        ) {
          showToast("Yanlış ülke sonucu elendi · tekrar dene");
          return;
        }
        startTourWithPayload(d);
      })
      .catch(function () {
        local();
      });
  }

  function wireTourKeys() {
    if (tourState.keyWired) return;
    tourState.keyWired = true;
    window.addEventListener("keydown", function (ev) {
      if (!tourState.active) return;
      // Yürüme açıkken sürekli hareket walkTick’te; burada yalnızca kuş yönü
      if (walkState.on) return;
      const t = ev.target;
      if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA")) return;
      const code = ev.code;
      const steerKey =
        code === "KeyW" ||
        code === "KeyA" ||
        code === "KeyS" ||
        code === "KeyD" ||
        code === "ArrowUp" ||
        code === "ArrowDown" ||
        code === "ArrowLeft" ||
        code === "ArrowRight" ||
        code === "KeyQ" ||
        code === "KeyE" ||
        code === "PageUp" ||
        code === "PageDown" ||
        code === "Space";
      if (!steerKey && code !== "KeyO" && code !== "KeyF" && code !== "KeyG")
        return;
      tourState.keys[code] = true;
      ev.preventDefault();
      // Dururken WASD = odak kaydır (focusOrbitWasd); otomatik turu açma
      if (tourState.paused && code !== "Space") {
        if (code === "KeyO") focusOrbitOverhead();
        else if (code === "KeyF") {
          focusOrbit.mode = "focus";
          focusOrbitApply();
          showToast("Odak takibi");
        } else if (code === "KeyG") {
          focusOrbit.mode = "free";
          showToast("Serbest bakış");
        } else if (code === "KeyQ" || code === "PageDown") {
          focusOrbitWheel(120);
        } else if (code === "KeyE" || code === "PageUp") {
          focusOrbitWheel(-120);
        }
        return;
      }
      if (ev.repeat) return;
      if (code === "KeyW" || code === "ArrowUp") tourForward();
      else if (code === "KeyS" || code === "ArrowDown") tourBack();
      else if (code === "KeyA") tourStrafe(-1);
      else if (code === "KeyD") tourStrafe(1);
      else if (code === "ArrowLeft") tourTurn(-1);
      else if (code === "ArrowRight") tourTurn(1);
      else if (code === "KeyQ" || code === "PageDown") tourCloser();
      else if (code === "KeyE" || code === "PageUp") tourFarther();
      else if (code === "KeyO") focusOrbitOverhead();
      else if (code === "KeyF") {
        focusOrbit.mode = "focus";
        showToast("Odak takibi");
      } else if (code === "KeyG") {
        focusOrbit.mode = "free";
        showToast("Serbest bakış");
      } else if (code === "Space") {
        if (tourState.paused) tourResume();
        else tourPause();
      }
    });
    window.addEventListener("keyup", function (ev) {
      tourState.keys[ev.code] = false;
    });
    window.addEventListener("blur", function () {
      tourState.keys = Object.create(null);
    });
  }

  function tourMousePilotAllowed() {
    if (walkState.on) return false;
    // Tur açıkken veya odak kilitliyken sol sürükle çalışır
    return !!(tourState.active || focusOrbit.locked);
  }

  function wireTourMousePilot() {
    const el = document.getElementById("globe");
    if (!el) return;
    // Canvas / viewer hazır olunca yeniden bağlanabilsin
    const viewer = liveCesiumViewer;
    const canvas =
      (viewer && viewer.scene && viewer.scene.canvas) ||
      el.querySelector("canvas");
    const bindKey = canvas ? "canvas" : "globe";
    if (wireTourMousePilot._bindKey === bindKey && wireTourMousePilot._on) {
      return;
    }
    // Eski dinleyicileri temizle — çift pan birikmesin
    try {
      if (wireTourMousePilot._abort) wireTourMousePilot._abort.abort();
    } catch (_) {}
    const ac = new AbortController();
    wireTourMousePilot._abort = ac;
    const sig = { signal: ac.signal };
    wireTourMousePilot._on = true;
    wireTourMousePilot._bindKey = bindKey;

    let drag = false;
    let lastX = 0;
    let lastY = 0;
    let moved = 0;
    let clickTimer = 0;
    let downX = 0;
    let downY = 0;
    let pointerId = null;

    function beginDrag(clientX, clientY, ev) {
      if (!tourMousePilotAllowed()) return false;
      if (walkState.on) exitWalkMode("");
      setTourNativeControls(false);
      tourState._heldFromPlay = !!(tourState.active && !tourState.paused);
      if (tourState.active) tourPause({ silent: true });
      tourCancelCameraFlight();
      drag = true;
      moved = 0;
      lastX = clientX;
      lastY = clientY;
      downX = clientX;
      downY = clientY;
      tourState.dragActive = true;
      el.classList.add("is-drag");
      try {
        if (ev && ev.target && ev.pointerId != null && ev.target.setPointerCapture) {
          pointerId = ev.pointerId;
          ev.target.setPointerCapture(ev.pointerId);
        }
      } catch (_) {}
      return true;
    }

    function moveDrag(clientX, clientY) {
      if (!drag) return;
      if (!tourMousePilotAllowed()) return;
      const dx = clientX - lastX;
      const dy = clientY - lastY;
      lastX = clientX;
      lastY = clientY;
      if (Math.abs(dx) + Math.abs(dy) < 1) return;
      moved += Math.abs(dx) + Math.abs(dy);
      // focusOrbit pan — Cesium native kapalı; kontrol yalnız bizde
      tourManualDrive(dx, dy);
    }

    function endDrag(ev) {
      if (!drag) return;
      drag = false;
      tourState.dragActive = false;
      try {
        el.classList.remove("is-drag");
      } catch (_) {}
      try {
        if (
          pointerId != null &&
          ev &&
          ev.target &&
          ev.target.releasePointerCapture
        ) {
          ev.target.releasePointerCapture(pointerId);
        }
      } catch (_) {}
      pointerId = null;
      if (!tourState.active && !focusOrbit.locked) return;
      if (tourState.active) {
        tourPause({ silent: moved >= 6, toast: "Durdu" });
      }
      if (moved >= 6) {
        focusOrbitKillInertia();
        focusOrbitApply();
        showToast("Elimde · bırakıldı");
        return;
      }
      // Tek tık → yumuşak odak (yükseklik korunur)
      if (moved < 6 && (!ev || ev.button === 0 || ev.button == null)) {
        const hx = downX;
        const hy = downY;
        tourState._heldFromPlay = false;
        if (clickTimer) clearTimeout(clickTimer);
        clickTimer = setTimeout(function () {
          clickTimer = 0;
          if (Date.now() < (tourState.suppressClickUntil || 0)) return;
          if (tourState.active) tourPause({ silent: true });
          const hit = pickGlobeLatLonFromEvent({ clientX: hx, clientY: hy });
          if (hit) tourFocusAndDescend(hit.lat, hit.lon);
          else showToast("Odak yok · noktaya tekrar tıkla");
        }, 200);
      }
    }

    // Pointer capture — tutunca olay canvas’tan kaçmaz (iframe/Electron)
    const surface = canvas || el;
    surface.addEventListener(
      "pointerdown",
      function (ev) {
        if (ev.button !== 0) return;
        if (!beginDrag(ev.clientX, ev.clientY, ev)) return;
        ev.preventDefault();
      },
      { capture: true, signal: ac.signal }
    );
    window.addEventListener(
      "pointermove",
      function (ev) {
        if (!drag) return;
        moveDrag(ev.clientX, ev.clientY);
        try {
          ev.preventDefault();
        } catch (_) {}
      },
      { capture: true, signal: ac.signal }
    );
    window.addEventListener(
      "pointerup",
      function (ev) {
        endDrag(ev);
      },
      { capture: true, signal: ac.signal }
    );
    window.addEventListener(
      "pointercancel",
      function (ev) {
        endDrag(ev);
      },
      { capture: true, signal: ac.signal }
    );

    // Cesium native sürüklemeyi her bağlanışta kapat (orbit/uzay yok)
    setTourNativeControls(false);

    el.addEventListener(
      "wheel",
      function (ev) {
        if (!tourState.active && !focusOrbit.locked) return;
        ev.preventDefault();
        tourWheelZoom(ev.deltaY);
      },
      { passive: false, signal: ac.signal }
    );
    el.addEventListener(
      "dblclick",
      function (ev) {
        if (!tourState.active && !focusOrbit.locked) return;
        ev.preventDefault();
        ev.stopPropagation();
        if (clickTimer) {
          clearTimeout(clickTimer);
          clickTimer = 0;
        }
        tourState.suppressClickUntil = Date.now() + 450;
        setTourNativeControls(false);
        focusOrbitKillInertia();
        tourCancelCameraFlight();
        const hit = pickGlobeLatLonFromEvent(ev);
        if (!hit) {
          showToast("Odak yok · tekrar çift tıkla");
          return;
        }
        focusOrbitSoftGoto(hit.lat, hit.lon, {
          toast:
            "Oraya · " +
            formatAltitude(Number(focusOrbit.range) || 0) +
            " korundu",
        });
      },
      sig
    );
    el.addEventListener(
      "contextmenu",
      function (ev) {
        if (!tourState.active && !focusOrbit.locked) return;
        ev.preventDefault();
        if (tourState.active) tourPause({ toast: "Durdu" });
        focusOrbitKillInertia();
        focusOrbitApply();
      },
      sig
    );
  }

  function wireTourBar() {
    if (!tourBar || tourBar.getAttribute("data-wired") === "1") return;
    tourBar.setAttribute("data-wired", "1");
    // Butonlar gizli; ses / postMessage handleTourMessage üzerinden gelir.
    // Eski tıklama yolu (gizli buton) yine çalışsın diye bırakıldı.
    tourBar.addEventListener("click", function (ev) {
      const btn = ev.target && ev.target.closest("button[data-tour-act]");
      if (!btn) return;
      const act = btn.getAttribute("data-tour-act");
      if (act === "pause") tourPause();
      else if (act === "resume") tourResume();
      else if (act === "slower") tourSlower();
      else if (act === "faster") tourFaster();
      else if (act === "closer") tourCloser();
      else if (act === "farther") tourFarther();
      else if (act === "altitude_reset") tourAltitudeReset();
      else if (act === "turn_left") tourTurn(-1);
      else if (act === "turn_right") tourTurn(1);
      else if (act === "forward") tourForward();
      else if (act === "back") tourBack();
      else if (act === "walk") setCameraMode("yuruyus");
      else if (act === "fly") setCameraMode("sinematik");
      else if (act === "strafe_left") tourStrafe(-1);
      else if (act === "strafe_right") tourStrafe(1);
      else if (act === "labels_on") {
        walkState.labelsOn = true;
        walkRefreshLabels(true);
        showToast("Sokak / mahalle etiketleri");
      }
      else if (act === "traffic") spawnSimTraffic(liveCesiumViewer, true);
      else if (act === "pano_near") {
        walkState.panoAuto = true;
        walkState.panoUserClosed = false;
        if (!walkState.on) setCameraMode("yuruyus", { toast: "Gerçek görüntü" });
        else walkLoadPanoHud(true);
      }
      else if (act === "next") tourNext();
      else if (act === "prev") tourPrev();
      else if (act === "skip") tourSkip();
      else if (act === "stop") {
        if (walkState.on) exitWalkMode();
        tourStopAll();
        showToast("Gezi bitti");
      }
    });
  }

  function handleTourMessage(d) {
    if (!d || d.type !== "ruzgar-harita-tour") return;
    const act = String(d.action || "");
    if (act.indexOf("camera_") === 0) {
      const mid = act.replace(/^camera_/, "");
      setCameraMode(mid, { soft: true });
      return;
    }
    if (act.indexOf("body_") === 0) {
      setCameraBody(act.replace(/^body_/, ""));
      return;
    }
    if (act === "start") {
      pendingTourMsg = d;
      if (d.lat != null && d.lon != null && isFinite(Number(d.lat)) && isFinite(Number(d.lon))) {
        TARGET.lat = Number(d.lat);
        TARGET.lon = Number(d.lon);
      }
      if (d.tour && d.tour.lat != null && d.tour.lon != null) {
        TARGET.lat = Number(d.tour.lat);
        TARGET.lon = Number(d.tour.lon);
      }
      if (d.tour && ((d.tour.waypoints && d.tour.waypoints.length >= 2) || (d.tour.stops && d.tour.stops.length >= 2))) {
        startTourWithPayload(d.tour);
      } else {
        fetchAndStartTour(
          d.place || q.get("tour_place") || label,
          d.tip || tipQ || TARGET.tip,
          d.lat != null ? d.lat : TARGET.lat,
          d.lon != null ? d.lon : TARGET.lon
        );
      }
      return;
    }
    if (act === "pause" || act === "dur") {
      tourPause({ toast: "Durdu" });
      focusOrbitKillInertia();
      focusOrbitApply();
    } else if (act === "resume" || act === "devam") {
      if (walkState.on) exitWalkMode("");
      tourResume({ toast: "Devam" });
    } else if (
      act === "overhead" ||
      act === "uzerine_cik" ||
      act === "kusbakisi"
    ) {
      focusOrbitOverhead();
    } else if (act === "focus_mode" || act === "odak_takibi") {
      focusOrbit.mode = "focus";
      focusOrbitApply();
      showToast("Odak takibi");
    } else if (act === "free_mode" || act === "serbest_bakis") {
      focusOrbit.mode = "free";
      showToast("Serbest bakış");
    }
    else if (act === "slower") tourSlower();
    else if (act === "faster") tourFaster();
    else if (act === "closer") tourCloser();
    else if (act === "farther") tourFarther();
    else if (act === "altitude" || act === "altitude_set") {
      tourSetAltitude(d.meters != null ? d.meters : d.tour_meters);
    } else if (act === "altitude_reset") {
      if (walkState.on) exitWalkMode();
      tourAltitudeReset();
    }
    else if (act === "turn_left") tourTurn(-1);
    else if (act === "turn_right") tourTurn(1);
    else if (act === "forward") tourForward();
    else if (act === "back") tourBack();
    else if (act === "walk") setCameraMode("yuruyus");
    else if (act === "fly") setCameraMode("sinematik");
    else if (act === "strafe_left") tourStrafe(-1);
    else if (act === "strafe_right") tourStrafe(1);
    else if (act === "labels_on") {
      walkState.labelsOn = true;
      if (!walkState.on) setCameraMode("yuruyus", { toast: "Etiketler" });
      else walkRefreshLabels(true);
    }
    else if (act === "traffic") {
      if (!liveCesiumViewer) showToast("Önce 3D harita");
      else spawnSimTraffic(liveCesiumViewer, true);
    }
    else if (act === "pano_near") {
      walkState.panoAuto = true;
      walkState.panoUserClosed = false;
      if (!walkState.on) enterWalkMode("Gerçek görüntü");
      else walkLoadPanoHud(true);
    }
    else if (act === "follow_river") tourSetSteerMode("nehir", "Nehri takip");
    else if (act === "enter_city") {
      if (walkState.on) exitWalkMode("");
      tourSetSteerMode("sehir", "Şehir içi");
      tourState.forceRangeM = Math.max(40, Number(tourState.bandMin) || 50);
      tourRefreshCameraNow();
    }
    else if (act === "follow_coast") tourSetSteerMode("kiyi", "Kıyı takip");
    else if (act === "enter_crater") tourSetSteerMode("volkan", "Krater yönü");
    else if (act === "next") tourNext();
    else if (act === "prev") tourPrev();
    else if (act === "skip") tourSkip();
    else if (act === "stop") {
      if (walkState.on) exitWalkMode();
      tourStopAll();
    }
  }

  function applyTerrariumFallback(viewer, reason) {
    try {
      viewer.terrainProvider = makeTerrariumTerrainProvider();
      terrainProviderLabel = "Terrarium";
      applyCesiumSceneQuality(viewer, true);
      if (reason) console.warn("terrain fallback terrarium", reason);

        viewer.scene.requestRender();
      } catch (_) {}

  function applyCesiumTerrain(viewer, on) {
    if (!viewer || typeof Cesium === "undefined") return;
    try {
      if (!on) {
        viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider();
        terrainProviderLabel = "Kapalı";
        applyCesiumSceneQuality(viewer, false);
        try {
          viewer.scene.globe.terrainExaggeration = 1.0;
        } catch (_) {}
        try {
          viewer.scene.requestRender();
        } catch (_) {}
        updateInfoBar(null);
        return;
      }
      fetchCesiumIonConfig().then(function (cfg) {
        const token = cfg && cfg.ion_token ? String(cfg.ion_token) : "";
        const wantWt = !!(cfg && cfg.world_terrain && token);
        if (
          wantWt &&
          Cesium.Ion &&
          typeof Cesium.createWorldTerrainAsync === "function"
        ) {
          try {
            Cesium.Ion.defaultAccessToken = token;
          } catch (_) {}
          const qp = getHaritaQualityProfile();
          const terrainOpts = {
            requestVertexNormals: true,
            // Dilim A: su maskesi kıyı/nehir hissi; mobilde kapalı (bant/GPU)
            requestWaterMask: !!qp.waterMask,
          };
          function attachWorldTerrain(provider) {
            viewer.terrainProvider = provider;
            terrainProviderLabel = "Cesium World Terrain";
            applyCesiumSceneQuality(viewer, true);
            showToast(
              "Terrain: World Terrain" + (qp.mobil ? " · mobil" : "")
            );
            try {
              viewer.scene.requestRender();
            } catch (_) {}
            syncTerrainStatusLabel();
            updateInfoBar(null);
          }
          return Cesium.createWorldTerrainAsync(terrainOpts)
            .then(attachWorldTerrain)
            .catch(function (err) {
              // Bir kez daha dene — geçici Ion/ağ kopması
              return Cesium.createWorldTerrainAsync(terrainOpts)
                .then(attachWorldTerrain)
                .catch(function (err2) {
                  applyTerrariumFallback(viewer, err2 || err);
                });
            });
        }
        applyTerrariumFallback(viewer, "ion yok");
      });
    } catch (err) {
      console.warn("terrain", err);
      showToast("Terrain yüklenemedi");
    }
  }
