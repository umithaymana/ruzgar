  function resolveViewZoom(kind) {
    const rawZ = Number(q.get("zoom"));
    const hasUrlZoom = isFinite(rawZ) && rawZ >= 2 && rawZ <= 18;
    let z = 7;
    if (hasUrlZoom) z = rawZ;
    else if (tipQ && TIP_ZOOM[tipQ] != null) z = TIP_ZOOM[tipQ];
    // Eski sabit zoom=6 kalıntısı + hedef varsa tip/metin ile yükselt
    if (z <= 6) {
      if (tipQ && TIP_ZOOM[tipQ] != null) z = TIP_ZOOM[tipQ];
      else {
        const L = (label || "").toLowerCase();
        if (/gecit|ge\u00e7it/i.test(L)) z = 16;
        else if (/kopru|k\u00f6pr\u00fc|bridge/i.test(L)) z = 17;
        else if (/dag|da\u011f|uluda/i.test(L)) z = 14;
        else if (/ayasof|cami|saray|kule/i.test(L)) z = 18;
        else if (guessSehirFromLabel()) z = 11;
        else if (/(turkiye|t\u00fcrkiye|turkey|anadolu)/i.test(L)) z = 7;
        else z = 11;
      }
    }
    if (kind === "4d") z = Math.min(z, 9);
    return Math.max(2, Math.min(18, z));
  }

  function applyInitialView(map, viewZoom) {
    const z = Math.max(2, Math.min(18, viewZoom || zoom || 7));
    if (bboxParam) {
      try {
        const bounds = L.latLngBounds(
          [bboxParam[1], bboxParam[0]],
          [bboxParam[3], bboxParam[2]],
        );
        if (bounds.isValid && bounds.isValid()) {
          map.fitBounds(bounds, {
            padding: [28, 28],
            maxZoom: Math.max(z, tipQ === "bina" || tipQ === "nokta" || tipQ === "kopru" ? 18 : z),
            animate: wantFly,
          });
          return;
        }
      } catch (_) {}
    }
    if (wantFly && map.flyTo) {
      map.flyTo([TARGET.lat, TARGET.lon], z, { duration: 0.85, easeLinearity: 0.25 });
    } else {
      map.setView([TARGET.lat, TARGET.lon], z);
    }
  }

  function heightFromZoom(z) {
    // kaba: zoom 6 ≈ ülke, 11 ≈ şehir, 15 ≈ mahalle
    const zz = Math.max(2, Math.min(18, z || 6));
    return Math.max(120, 1200000 / Math.pow(2, Math.max(0, zz - 4)));
  }

  function targetKeyNorm() {
    return String(TARGET.label || label || "")
      .toLowerCase()
      .replace(/ı/g, "i")
      .replace(/ğ/g, "g")
      .replace(/ü/g, "u")
      .replace(/ş/g, "s")
      .replace(/ö/g, "o")
      .replace(/ç/g, "c")
      .replace(/â/g, "a")
      .replace(/[^a-z0-9]+/g, "");
  }

  /** H6 sinematik profiller — dağ / geçit özel açı */
  function cinemaProfileForTarget() {
    const tip = String(TARGET.tip || tipQ || "").toLowerCase();
    const key = targetKeyNorm();
    // İsim bazlı dağ modu (Google Earth tarzı etkileyici açı)
    // H8: genel bakış — zirve + etek aynı karede (World Terrain için dengeli pitch/range)
    const DAG = {
      uludag: { heading: 210, pitch: -32, range: 11000, duration: 3.4, arc: 16000 },
      agridagi: { heading: 160, pitch: -30, range: 22000, duration: 3.8, arc: 28000 },
      agri: { heading: 160, pitch: -30, range: 22000, duration: 3.8, arc: 28000 },
      ararat: { heading: 160, pitch: -30, range: 22000, duration: 3.8, arc: 28000 },
      kackardaglari: { heading: 320, pitch: -31, range: 24000, duration: 3.6, arc: 30000 },
      kackar: { heading: 320, pitch: -31, range: 24000, duration: 3.6, arc: 30000 },
      everest: { heading: 200, pitch: -28, range: 28000, duration: 4.2, arc: 38000 },
      mounteverest: { heading: 200, pitch: -28, range: 28000, duration: 4.2, arc: 38000 },
      palandoken: { heading: 200, pitch: -32, range: 12000, duration: 3.2, arc: 16000 },
    };
    for (const k in DAG) {
      if (key.indexOf(k) >= 0) {
        return Object.assign({ mode: "dag", tip: tip || "dag" }, DAG[k]);
      }
    }
    // Geçit modu — yan açı (sırt boyunca); "kop" yalnız geçit bağlamında
    if (key.indexOf("mescit") >= 0) {
      return {
        mode: "gecit",
        tip: "gecit",
        heading: 118,
        pitch: -22,
        range: 6800,
        duration: 3.0,
        arc: 11000,
      };
    }
    if (key.indexOf("zigana") >= 0) {
      return {
        mode: "gecit",
        tip: "gecit",
        heading: 250,
        pitch: -17,
        range: 4800,
        duration: 3.0,
        arc: 8500,
      };
    }
    if (key.indexOf("kopgecit") >= 0 || (tip === "gecit" && key.indexOf("kop") === 0)) {
      return {
        mode: "gecit",
        tip: "gecit",
        heading: 90,
        pitch: -16,
        range: 5000,
        duration: 3.0,
        arc: 8800,
      };
    }
    if (tip === "gecit" || /gecit/.test(key)) {
      return {
        mode: "gecit",
        tip: "gecit",
        heading: 100,
        pitch: -18,
        range: 5500,
        duration: 2.9,
        arc: 9000,
      };
    }
    if (tip === "dag" || /dag|peak|mountain/.test(key)) {
      return {
        mode: "dag",
        tip: "dag",
        heading: 200,
        pitch: -28,
        range: 12000,
        duration: 3.2,
        arc: 16000,
      };
    }
    const z = Math.max(2, Math.min(18, Number(TARGET.zoom || zoom) || 14));
    let range = heightFromZoom(z);
    if (tip === "kopru" || tip === "bina" || tip === "nokta") range = Math.max(600, range * 0.35);
    else if (tip === "il" || tip === "ilce") range = heightFromZoom(Math.max(z, 12));
    else range = Math.max(2500, range * 0.8);
    return {
      mode: "genel",
      tip: tip,
      heading: 15,
      pitch: -40,
      range: range,
      duration: 2.4,
      arc: Math.max(range * 1.4, 5000),
    };
  }

  function cameraOptsForTarget() {
    // Sınıf kamera (evrensel) — URL cam_* veya tip profili
    if (TARGET.camera && isFinite(Number(TARGET.camera.range_m))) {
      let pitch = Number(TARGET.camera.pitch);
      if (!isFinite(pitch)) pitch = -28;
      if (pitch < -52) pitch = -52;
      if (pitch > -12) pitch = -12;
      const range = Math.max(40, Number(TARGET.camera.range_m) || 400);
      return {
        height: range,
        pitch: pitch,
        heading: Number(TARGET.camera.heading) || 0,
        tip: TARGET.tip || tipQ || "nokta",
        duration: 2.6,
        arc: Math.max(range * 1.2, range + 400),
        mode: "truth",
        range: range,
      };
    }
    const p = cinemaProfileForTarget();
    let pitch = p.pitch;
    if (pitch < -52) pitch = -52;
    if (pitch > -16) pitch = -16;
    return {
      height: Math.max(terrainOn ? 400 : 250, p.range),
      pitch: pitch,
      heading: p.heading,
      tip: p.tip,
      duration: p.duration,
      arc: p.arc,
      mode: p.mode,
      range: p.range,
    };
  }

  function placeHedefPin(viewer, tLon, tLat, groundH) {
    try {
      viewer.entities.removeById("ruzgar-hedef-pin");
      const hRef = terrainOn
        ? Cesium.HeightReference.CLAMP_TO_GROUND
        : Cesium.HeightReference.NONE;
      viewer.entities.add({
        id: "ruzgar-hedef-pin",
        position: Cesium.Cartesian3.fromDegrees(
          tLon,
          tLat,
          isFinite(groundH) ? groundH : 0,
        ),
        point: {
          pixelSize: 11,
          color: Cesium.Color.fromCssColorString("#d4af37"),
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 1,
          heightReference: hRef,
          disableDepthTestDistance: Number.POSITIVE_INFINITY,
        },
        label: {
          text: String(TARGET.label || "").slice(0, 48),
          font: "13px sans-serif",
          fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 3,
          style: Cesium.LabelStyle.FILL_AND_OUTLINE,
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          pixelOffset: new Cesium.Cartesian2(0, -16),
          heightReference: hRef,
          disableDepthTestDistance: Number.POSITIVE_INFINITY,
        },
      });
    } catch (_) {}
  }

  function flyCesiumToLockedTarget(viewer) {
    // H10.6: sürekli tur varken / tur boot iken tek seferlik cinema fly KAPALI
    // (aksi halde konuma gidip spline uçuşu eziyordu)
    if (tourState.active || wantTourBoot) {
      try {
        placeHedefPin(viewer, TARGET.lon, TARGET.lat, 0);
      } catch (_) {}
      return;
    }
    const opts = cameraOptsForTarget();
    const tLat = TARGET.lat;
    const tLon = TARGET.lon;
    logTarget("3d-cinema-" + (opts.mode || "genel"));
    // Ani setView yok — sıçrama yapıyordu; sadece akıcı flyTo
    try {
      viewer.camera.cancelFlight();
    } catch (_) {}
    if (cinemaUnlockTimer) {
      clearTimeout(cinemaUnlockTimer);
      cinemaUnlockTimer = 0;
    }

    const easing =
      (Cesium.EasingFunction && Cesium.EasingFunction.CUBIC_IN_OUT) || undefined;

    const runCinemaFly = function (groundH) {
      const gh = isFinite(groundH) ? groundH : 0;
      // Hedef her zaman merkez: lookAt + HeadingPitchRange
      const center = Cesium.Cartesian3.fromDegrees(tLon, tLat, gh);
      const range = Math.max(opts.range || opts.height, terrainOn ? 800 : 500);
      const offset = new Cesium.HeadingPitchRange(
        Cesium.Math.toRadians(opts.heading),
        Cesium.Math.toRadians(opts.pitch),
        range,
      );
      placeHedefPin(viewer, tLon, tLat, gh);

      const bs = new Cesium.BoundingSphere(center, Math.max(80, range * 0.08));
      const flyOpts = {
        duration: opts.duration || 2.8,
        offset: offset,
        maximumHeight: Math.max(opts.arc || range * 1.5, range + gh + 2000),
      };
      if (easing) flyOpts.easingFunction = easing;

      try {
        viewer.camera.flyToBoundingSphere(bs, flyOpts);
      } catch (_) {
        // Yedek: klasik flyTo — yine hedef merkezli offset hesabı
        const transform = Cesium.Transforms.eastNorthUpToFixedFrame(center);
        const offsetCart = new Cesium.Cartesian3();
        // Basit güney-batı ofset
        const pitchR = Cesium.Math.toRadians(opts.pitch);
        const headR = Cesium.Math.toRadians(opts.heading);
        offsetCart.x = -Math.cos(pitchR) * Math.sin(headR) * range;
        offsetCart.y = -Math.cos(pitchR) * Math.cos(headR) * range;
        offsetCart.z = -Math.sin(pitchR) * range;
        const dest = Cesium.Matrix4.multiplyByPoint(
          transform,
          offsetCart,
          new Cesium.Cartesian3(),
        );
        viewer.camera.flyTo({
          destination: dest,
          orientation: {
            heading: headR,
            pitch: pitchR,
            roll: 0,
          },
          duration: opts.duration || 2.8,
          maximumHeight: flyOpts.maximumHeight,
          easingFunction: easing,
        });
      }

      // Uçuş bitince lookAt kilidi — hedef merkezde kalsın, sonra serbest bırak
      const unlockMs = Math.round((opts.duration || 2.8) * 1000) + 80;
      cinemaUnlockTimer = setTimeout(function () {
        cinemaUnlockTimer = 0;
        if (tourState.active) return; // H10.6 tur başladıysa cinema unlock yok
        try {
          viewer.camera.lookAt(center, offset);
          viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY);
        } catch (_) {}
        try {
          viewer.scene.requestRender();
        } catch (_) {}
      }, unlockMs);
    };

    if (terrainOn && viewer.terrainProvider && Cesium.sampleTerrainMostDetailed) {
      const carto = [Cesium.Cartographic.fromDegrees(tLon, tLat)];
      Cesium.sampleTerrainMostDetailed(viewer.terrainProvider, carto)
        .then(function (samples) {
          const ground = samples && samples[0] && samples[0].height;
          runCinemaFly(isFinite(ground) ? ground : 0);
        })
        .catch(function () {
          runCinemaFly(0);
        });
    } else {
      runCinemaFly(0);
    }
  }

  function gibsDate(y) {
    const yy = Math.max(2000, Math.min(2024, Number(y) || 2015));
    return yy + "-06-15";

  function gibsLayer(y) {
    const date = gibsDate(y);
    return L.tileLayer(
      "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_CorrectedReflectance_TrueColor/default/" +
        date +
        "/GoogleMapsCompatible_Level9/{z}/{y}/{x}.jpg",
      {
        maxZoom: 9,
        maxNativeZoom: 9,
        attribution: "NASA GIBS / MODIS",
      }
    );
  }

  function haversineM(a, b) {
    const R = 6371000;
    const toR = Math.PI / 180;
    const dLat = (b.lat - a.lat) * toR;
    const dLon = (b.lng - a.lng) * toR;
    const la1 = a.lat * toR;
    const la2 = b.lat * toR;
    const h =
      Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(la1) * Math.cos(la2) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  function formatDist(m) {
    if (m >= 1000) return (m / 1000).toFixed(2) + " km";
    return Math.round(m) + " m";
  }

  function ringAreaM2(latlngs) {
    if (!latlngs || latlngs.length < 3) return 0;
    const R = 6371000;
    const toR = Math.PI / 180;
    let sum = 0;
    for (let i = 0; i < latlngs.length; i++) {
      const p1 = latlngs[i];
      const p2 = latlngs[(i + 1) % latlngs.length];
      sum += (p2.lng - p1.lng) * toR * (2 + Math.sin(p1.lat * toR) + Math.sin(p2.lat * toR));
    }
    return Math.abs((sum * R * R) / 2);
  }

  function formatArea(m2) {
    if (m2 >= 1000000) return (m2 / 1000000).toFixed(2) + " km²";
    if (m2 >= 10000) return (m2 / 10000).toFixed(2) + " ha";
    return Math.round(m2) + " m²";
  }

  function sanitizeGeoJsonForCesium(gj) {
    // Yinelenen ardışık koordinat → RhumbLine «distinct start/end» crash
    if (!gj || !gj.features) return gj;
    function dedupeRing(ring) {
      if (!ring || !ring.length) return ring;
      const out = [];
      let prev = null;
      for (let i = 0; i < ring.length; i++) {
        const p = ring[i];
        if (!p || p.length < 2) continue;
        const key = Number(p[0]).toFixed(7) + "," + Number(p[1]).toFixed(7);
        if (prev === key) continue;
        out.push(p);
        prev = key;
      }
      if (out.length >= 2) {
        const a = out[0];
        const b = out[out.length - 1];
        if (
          Number(a[0]).toFixed(7) !== Number(b[0]).toFixed(7) ||
          Number(a[1]).toFixed(7) !== Number(b[1]).toFixed(7)
        ) {
          out.push(a);
        }
      }
      return out.length >= 4 ? out : null;
    }
    function cleanCoords(geom) {
      if (!geom || !geom.coordinates) return null;
      const t = String(geom.type || "");
      if (t === "Polygon") {
        const rings = [];
        for (let i = 0; i < geom.coordinates.length; i++) {
          const r = dedupeRing(geom.coordinates[i]);
          if (r) rings.push(r);
        }
        return rings.length ? { type: "Polygon", coordinates: rings } : null;
      }
      if (t === "MultiPolygon") {
        const polys = [];
        for (let i = 0; i < geom.coordinates.length; i++) {
          const rings = [];
          const poly = geom.coordinates[i] || [];
          for (let j = 0; j < poly.length; j++) {
            const r = dedupeRing(poly[j]);
            if (r) rings.push(r);
          }
          if (rings.length) polys.push(rings);
        }
        return polys.length
          ? { type: "MultiPolygon", coordinates: polys }
          : null;
      }
      return geom;
    }
    const feats = [];
    for (let i = 0; i < gj.features.length; i++) {
      const f = gj.features[i];
      if (!f) continue;
      const g = cleanCoords(f.geometry);
      if (!g) continue;
      feats.push({
        type: "Feature",
        properties: f.properties || {},
        geometry: g,
      });
    }
    return {
      type: "FeatureCollection",
      features: feats,
      near: gj.near,
      total: gj.total,
      truncated: gj.truncated,
    };
  }

  function heightMetersFromProps(p) {
    if (!p) return 12;
    if (p.height) {
      const h = parseFloat(String(p.height).replace(",", "."));
      if (!isNaN(h) && h > 1) return h;
    }
    if (p.levels) {
      const lv = parseFloat(String(p.levels).replace(",", "."));
      if (!isNaN(lv) && lv > 0) return lv * 3.2;
    }
    // Faz 7: era ile hafif görsel fark (simülasyon boyası)
    if (era === "gecmis") return 8;
    if (era === "gelecek") return 22;
    return 12;
  }

  function loadBuildings(viewer, forceWalk) {
    const city = guessSehirFromLabel();
    // Pilot şehir (istanbul/ankara/bursa/izmir) tanıdıysa yerel beyaz kutuyu yükle
    if (!city || typeof Cesium === "undefined") return;
    if (walkState.buildingsBusy) return;
    const root = apiRoot();
    if (!root) return;
    const qp = getHaritaQualityProfile();
    const lim = buildingLimitForProfile();
    let lat = TARGET.lat;
    let lon = TARGET.lon;
    try {
      const c = Cesium.Cartographic.fromCartesian(viewer.camera.position);
      lat = Cesium.Math.toDegrees(c.latitude);
      lon = Cesium.Math.toDegrees(c.longitude);
    } catch (_) {}
    const radius = qp.mobil ? 0.028 : 0.042;
    const url =
      root +
      "/api/sehir-ikiz/geojson?sehir=" +
      encodeURIComponent(city) +
      "&kind=buildings&limit=" +
      lim +
      "&lat=" +
      encodeURIComponent(lat) +
      "&lon=" +
      encodeURIComponent(lon) +
      "&radius_deg=" +
      radius;
    walkState.buildingsBusy = true;
    setBadge("binalar…");
    fetch(url)
      .then(function (r) {
        return r.json();
      })
      .then(function (gj) {
        walkState.buildingsBusy = false;
        const clean = sanitizeGeoJsonForCesium(gj);
        if (!clean || !clean.features || !clean.features.length) {
          setBadge("yerel · bina yok");
          return;
        }
        try {
          if (walkState.buildingsDs) {
            viewer.dataSources.remove(walkState.buildingsDs, true);
          }
        } catch (_) {}
        const color =
          era === "gecmis"
            ? Cesium.Color.fromCssColorString("#8a7355").withAlpha(0.85)
            : era === "gelecek"
              ? Cesium.Color.fromCssColorString("#3d8bfd").withAlpha(0.8)
              : Cesium.Color.fromCssColorString("#d4af37").withAlpha(0.88);
        // stroke kapalı + GEODESIC: RhumbLine distinct-point crash önlenir
        const dsPromise = Cesium.GeoJsonDataSource.load(clean, {
          clampToGround: false,
          stroke: Cesium.Color.TRANSPARENT,
          fill: color,
          strokeWidth: 0,
        });
        dsPromise
          .then(function (ds) {
            viewer.dataSources.add(ds);
            walkState.buildingsDs = ds;
            walkState.buildingsCity = city;
            walkState.buildingsTs = Date.now();
            walkState.buildingsLat = lat;
            walkState.buildingsLon = lon;
            const ents = ds.entities.values;
            walkState.footprints = [];
            const fpCap = qp.mobil ? 900 : 2800;
            for (let i = 0; i < ents.length; i++) {
              const e = ents[i];
              if (!e.polygon) continue;
              const hm = heightMetersFromProps(
                e.properties && e.properties.getValue
                  ? e.properties.getValue(Cesium.JulianDate.now())
                  : null
              );
              try {
                e.polygon.extrudedHeight = hm;
                e.polygon.height = 0;
                e.polygon.material = color;
                e.polygon.outline = false;
                if (Cesium.ArcType) {
                  e.polygon.arcType = Cesium.ArcType.GEODESIC;
                }
              } catch (_) {}
              if (walkState.footprints.length >= fpCap) continue;
              try {
                const hier =
                  e.polygon.hierarchy && e.polygon.hierarchy.getValue
                    ? e.polygon.hierarchy.getValue(Cesium.JulianDate.now())
                    : e.polygon.hierarchy;
                const pos = hier && (hier.positions || hier);
                if (pos && pos.length) {
                  let minLon = 999,
                    maxLon = -999,
                    minLat = 999,
                    maxLat = -999;
                  for (let j = 0; j < pos.length; j++) {
                    const c = Cesium.Cartographic.fromCartesian(pos[j]);
                    const la = Cesium.Math.toDegrees(c.latitude);
                    const lo = Cesium.Math.toDegrees(c.longitude);
                    if (lo < minLon) minLon = lo;
                    if (lo > maxLon) maxLon = lo;
                    if (la < minLat) minLat = la;
                    if (la > maxLat) maxLat = la;
                  }
                  if (maxLon > minLon && maxLat > minLat) {
                    walkState.footprints.push({
                      minLon: minLon,
                      maxLon: maxLon,
                      minLat: minLat,
                      maxLat: maxLat,
                      h: hm,
                    });
                  }
                }
              } catch (_) {}
            }
            setBadge(
              "yerel · " +
                ents.length +
                " bina · " +
                city +
                (clean.near ? " · yakın" : "") +
                " · " +
                era
            );
            try {
              viewer.scene.requestRender();
            } catch (_) {}
          })
          .catch(function (err) {
            console.warn("bina GeoJSON load", err);
            setBadge("yerel · bina atlandı");
            showToast("Bina katmanı atlandı · gezi devam");
          });
      })
      .catch(function (err) {
        walkState.buildingsBusy = false;
        console.warn("bina katmanı", err);
        setBadge("yerel · bina hata");
      });
  }

  function paintCesium3d() {
    if (typeof Cesium === "undefined") {
      paintF4();
      return;
    }
    showOnly("globe");
    yearBar.classList.remove("on");
      syncYearInfoOffset();
    setBadge("yükleniyor");
    try {
      // Mevcut TARGET korunur — yeni hedef üretilmez (H4)
      const viewer = makeCesiumViewer(esriImagery());
      flyCesiumToLockedTarget(viewer);
      setBadge("3d · " + (TARGET.label || label));
      updateInfoBar(null);
      loadBuildings(viewer);
      if (wantAjan) spawnAgents(viewer);
      if (wantCam) loadCameraPins(viewer);
      if (wantModel) loadSampleGltf(viewer);
    } catch (err) {
      console.warn("Cesium 3d başarısız, F4map yedek", err);
      paintF4();
    }
  }

  function spawnAgents(viewer) {
    // C5 — araba/gemi/kayık simülasyonu
    spawnSimTraffic(viewer, true);
  }

  function loadCameraPins(viewer) {
    fetch(apiRoot() + "/api/sehir-ikiz/kameralar")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        const list = (data && data.kameralar) || [];
        list.forEach(function (cam) {
          if (cam.lat == null || cam.lon == null) return;
          viewer.entities.add({
            position: Cesium.Cartesian3.fromDegrees(Number(cam.lon), Number(cam.lat), 40),
            billboard: {
              image: "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="8" fill="#e74c3c"/></svg>'),
              verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            },
            label: {
              text: String(cam.ad || cam.id || "kamera"),
              font: "12px sans-serif",
              pixelOffset: new Cesium.Cartesian2(0, -28),
              fillColor: Cesium.Color.WHITE,
              showBackground: true,
            },
            description: cam.hls || cam.not || "",
          });
        });
      })
      .catch(function (e) { console.warn("kamera", e); });
  }

  function loadSampleGltf(viewer) {
    // Örnek glTF — API üzerinden servis edilmiyorsa sessiz geç
    const url = apiRoot() + "/api/sehir-ikiz/model/ornek_bina.glb";
    try {
      viewer.entities.add({
        name: "ornek_bina",
        position: Cesium.Cartesian3.fromDegrees(lon + 0.001, lat + 0.001, 0),
        model: {
          uri: url,
          scale: 1.0,
          minimumPixelSize: 48,
        },
      });
    } catch (e) {
      console.warn("gltf", e);
    }
  }

  function paintTur() {
    if (typeof Cesium === "undefined") {
      // CDN yok / yerel yok → Leaflet uydu tur yedeği
      showOnly("map");
      const map = L.map("map", { zoomControl: false }).setView([TARGET.lat, TARGET.lon], Math.max(3, zoom - 2));
      uyduLayer().addTo(map);
      let i = 0;
      const pts = [
        [TARGET.lat, TARGET.lon],
        [TARGET.lat + 8, TARGET.lon + 12],
        [TARGET.lat - 6, TARGET.lon + 25],
        [TARGET.lat + 2, TARGET.lon - 18],
        [TARGET.lat, TARGET.lon],
      ];
      setInterval(function () {
        i = (i + 1) % pts.length;
        map.flyTo(pts[i], Math.max(3, zoom - 2), { duration: 2.2 });
      }, 2800);
      setBadge("yedek tur");
      return;
    }
    showOnly("globe");
    yearBar.classList.remove("on");
      syncYearInfoOffset();
    setBadge("yükleniyor");
    try {
      const viewer = makeCesiumViewer(esriImagery());
      logTarget("tur");
      const dest = Cesium.Cartesian3.fromDegrees(TARGET.lon, TARGET.lat, 1800000);
      viewer.camera.flyTo({
        destination: dest,
        orientation: {
          heading: Cesium.Math.toRadians(20),
          pitch: Cesium.Math.toRadians(-45),
          roll: 0,
        },
        duration: 3.2,
        complete: function () {
          flyCesiumToLockedTarget(viewer);
        },
      });
      setBadge("uçuş · yerel");
    } catch (err) {
      globe.innerHTML =
        '<p style="padding:24px;line-height:1.45">Dünya turu yüklenemedi.<br/><small>' +
        String(err && err.message ? err.message : err) +
        "</small></p>";
      setBadge("hata");
    }
  }

  function paintSentinel() {
    showOnly("map");
    if (layerPanel) layerPanel.classList.remove("on");
    if (mapTools) mapTools.classList.remove("on");
    yearBar.classList.remove("on");
      syncYearInfoOffset();
    setBadge("STAC…");
    const map = L.map("map", { zoomControl: false, attributionControl: true }).setView([lat, lon], Math.max(zoom, 11));
    uyduLayer().addTo(map);
    L.marker([lat, lon]).addTo(map).bindPopup(label);
    const qCity = encodeURIComponent(label || guessSehirFromLabel() || "");
    const url =
      apiRoot() +
      "/api/sehir-ikiz/stac?hedef=" +
      qCity +
      "&lat=" +
      lat.toFixed(5) +
      "&lon=" +
      lon.toFixed(5) +
      "&limit=3";
    fetch(url)
      .then(function (r) {
        return r.json();
      })
      .then(function (data) {
        if (!data || !data.ok || !data.best) {
          setBadge("STAC boş");
          stacCard.classList.add("on");
          stacCard.textContent = (data && data.error) || "Sentinel sahne bulunamadı";
          return;
        }
        const b = data.best;
        const cc = b.cloud_cover != null ? Number(b.cloud_cover).toFixed(0) + "% bulut" : "";
        stacCard.classList.add("on");
        stacCard.innerHTML =
          "<b>Sentinel-2</b><br/>" +
          (b.datetime || "").slice(0, 10) +
          (cc ? " · " + cc : "") +
          "<br/><small>" +
          (b.id || "") +
          "</small>" +
          (b.thumbnail
            ? '<img alt="önizleme" src="' + b.thumbnail + '" />'
            : "");
        if (b.bbox && b.bbox.length === 4) {
          const bounds = [
            [b.bbox[1], b.bbox[0]],
            [b.bbox[3], b.bbox[2]],
          ];
          L.rectangle(bounds, {
            color: "#d4af37",
            weight: 1,
            fillOpacity: 0.08,
          }).addTo(map);
          map.fitBounds(bounds, { padding: [20, 20] });
        }
        setBadge((b.datetime || "").slice(0, 10) || "STAC");
      })
      .catch(function (err) {
        console.warn("stac", err);
        setBadge("STAC hata");
      });
    setTimeout(function () {
      map.invalidateSize();
    }, 80);
  }

  function paintPano() {
    // Plan: Mapillary sitesi / ayrı pencere YOK — Cesium’da yürü + sahne içi kare
    yearBar.classList.remove("on");
    syncYearInfoOffset();
    setBadge("sokak · yürüyüş");
    if (typeof Cesium === "undefined") {
      paintF4();
      showToast("Cesium yok · F4 yedek");
      return;
    }
    paintCesium3d();
    setTimeout(function () {
      walkState.panoAuto = true;
      if (!walkState.on) enterWalkMode("Şehir içi · sokak kareleri");
      else walkLoadPanoHud(true);
      showToast("Şehirde yürü · Büyüt = kare (site açılmaz)");
    }, 900);
  }

  wireTourBar();
  wirePanoWalkUi();
  (function wirePanoHud() {
    const el = document.getElementById("lpPanoHud");
    if (!el || el.getAttribute("data-wired") === "1") return;
    el.setAttribute("data-wired", "1");
    el.addEventListener("change", function () {
      walkState.panoAuto = !!el.checked;
      if (el.checked) {
        if (!walkState.on) enterWalkMode("Pano · walk");
        else walkLoadPanoHud(true);
      } else {
        const viewer = liveCesiumViewer;
        (walkState.panoIds || []).forEach(function (id) {
          try {
            if (viewer) viewer.entities.removeById(id);
          } catch (_) {}
        });
        walkState.panoIds = [];
        setPanoWalkStrip(false);
        showToast("Pano HUD kapalı");
      }
    });
  })();
  const wantTour =
    q.get("tour") === "1" ||
    q.get("tour_play") === "1" ||
    String(q.get("gezgin") || "") === "1";
  const wantWalkBoot =
    q.get("walk") === "1" ||
    q.get("yuru") === "1" ||
    mode === "pano" ||
    mode === "mapillary" ||
    mode === "panorama";
  if (wantTour && mode !== "f4") {
    mode = "3d";
    terrainOn = true;
  }
  if (wantWalkBoot && mode !== "f4") {
    mode = "3d";
    terrainOn = true;
  }

  // 3d: Cesium ana; engine=f4 veya mode=f4 → F4map yedek
  if (mode === "f4" || (mode === "3d" && forceF4)) {
    paintF4();
  } else if (mode === "3d") {
    paintCesium3d();
  } else if (mode === "tur") {
    paintTur();
  } else if (mode === "sentinel") {
    paintSentinel();
  } else if (mode === "pano" || mode === "mapillary" || mode === "panorama") {
    paintPano();
  } else if (mode === "4d") {
    paintLeaflet("4d");
  } else if (mode === "2d") {
    paintLeaflet("2d");
  } else {
    /* varsayılan: Esri uydu (boş OSM hissi yok) */
    paintLeaflet("uydu");
  }

  if (wantWalkBoot && mode === "3d" && !forceF4) {
    setTimeout(function () {
      walkState.panoAuto = true;
      if (!walkState.on) enterWalkMode("Şehir içi dolaş");
      else walkLoadPanoHud(true);
    }, 1000);
  }

  if (wantTour) {
    setTimeout(function () {
      fetchAndStartTour(
        q.get("tour_place") || label,
        tipQ || TARGET.tip,
        TARGET.lat,
        TARGET.lon
      );
    }, 1400);
  }
})();
  </script>
</body>
</html>
