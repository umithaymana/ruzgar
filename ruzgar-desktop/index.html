<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' http://127.0.0.1:8777 https://www.google.com https://*.google.com https://*.googleapis.com https://*.gstatic.com wss://*.google.com; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:;" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rüzgar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="title-strip">
      <span class="title-brand">Rüzgar</span>
      <span class="title-sub">RÜZGAR — yerel asistan</span>
    </div>

    <div class="layout">
      <aside class="panel panel-chat">
        <div class="panel-head">
          <div class="panel-head-left">
            <span class="panel-title">Rüzgar</span>
            <span class="panel-badge mode-tag" id="mode-badge">Genel</span>
          </div>
          <span class="panel-badge" id="api-status">API…</span>
        </div>
        <div class="chat-scroll" id="chat-messages"></div>
        <div class="composer">
          <textarea
            id="msg-input"
            rows="3"
            placeholder="Soru yazın veya yapıştırın — Web açıkken arama + okuma; doğrudan https:// bağlantısı da okunur."
          ></textarea>
          <div class="composer-actions">
            <label class="chk"
              ><input type="checkbox" id="opt-web" checked /> Web ara</label
            >
            <label class="chk" title="Web kapalıyken bile mesajdaki https bağlantılarını oku"
              ><input type="checkbox" id="opt-link-read" checked /> Bağlantı oku</label
            >
            <label class="chk fetch-row" title="Arama sonrası kaç siteden tam metin okunacak (bilgi için)"
              ><span>Sayfa oku</span>
              <select id="opt-fetch" class="select-mini">
                <option value="0">0</option>
                <option value="1" selected>1</option>
                <option value="2">2</option>
                <option value="3">3</option>
              </select>
            </label>
            <label class="chk"
              ><input type="checkbox" id="opt-code" /> Kod modu</label
            >
            <label class="chk" title="Asistan yanıtını sesli okur"
              ><input type="checkbox" id="opt-voice-out" checked /> Sesli yanıt</label
            >
            <label class="chk" title="Mikrofon metni yazınca otomatik gönderir"
              ><input type="checkbox" id="opt-voice-send" checked /> Konuşunca gönder</label
            >
            <span class="spacer"></span>
            <button type="button" id="btn-mic" class="btn-icon btn-mic" title="Basılı tutun — ses yerel Whisper ile metne (desktop_server + faster-whisper)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
              </svg>
            </button>
            <button type="button" id="btn-send" class="btn-primary">Gönder</button>
          </div>
        </div>
      </aside>

      <main class="panel panel-main">
        <div class="welcome">
          <div class="logo-mark">◎</div>
          <p class="welcome-title">RÜZGAR</p>
          <ul class="shortcuts">
            <li><kbd>Ctrl</kbd> + <kbd>Enter</kbd> Gönder</li>
            <li><kbd>Mikrofon</kbd> Konuş → metin; <strong>Sesli yanıt</strong> açıksa cevap okunur</li>
            <li><strong>Web:</strong> ara + sayfa oku (checkbox); mesaja URL yapıştırınca ilim sunucusu sayfayı çeker</li>
            <li>Ollama açık olmalı · <code>ollama serve</code></li>
          </ul>
        </div>
      </main>

      <aside class="panel panel-files">
        <div class="panel-head panel-head-files">
          <div class="file-toolbar" role="toolbar" aria-label="Sayfa ve sohbet">
            <button type="button" id="nav-back" class="btn-nav" title="Geri (gezinme geçmişi)" aria-label="Geri">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <button type="button" id="nav-forward" class="btn-nav" title="İleri (gezinme geçmişi)" aria-label="İleri">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>
            <button type="button" id="nav-refresh" class="btn-nav" title="Sayfayı yenile (Ctrl+R)" aria-label="Yenile">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
            <button type="button" id="nav-clear-chat" class="btn-nav" title="Sohbeti temizle (uygulamayı kapatmadan)" aria-label="Sohbeti temizle">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
            </button>
          </div>
          <span class="panel-title">Proje kökü</span>
        </div>
        <div class="file-tree" id="file-tree"></div>
      </aside>
    </div>

    <footer class="statusbar">
      <span id="status-left">Rüzgar</span>
      <span id="status-right">Hazır</span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
