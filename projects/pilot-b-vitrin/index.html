<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rüzgar Vitrin — Pilot B</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="hero">
    <p class="brand">Rüzgar</p>
    <h1>Pilot B Vitrin</h1>
    <p class="lead">Ümit &amp; Gökçenur — yol haritası P7 statik web pilotu</p>
    <button type="button" id="btn-hello">Merhaba de</button>
    <p id="out" class="out" aria-live="polite"></p>
  </header>
  <main>
    <section class="card" id="ozellikler">
      <h2>Ne var?</h2>
      <ul>
        <li>Yerel statik site (HTML/CSS/JS)</li>
        <li>Scaffold ürün borusu (P5)</li>
        <li>Serbest kod çalıştırma yok</li>
      </ul>
    </section>
    <section class="card">
      <h2>İletişim</h2>
      <form id="contact">
        <label>Ad <input name="name" required /></label>
        <label>E-posta <input name="email" type="email" required /></label>
        <button type="submit">Gönder</button>
      </form>
    </section>
  </main>
  <footer class="foot">
    <p>Rüzgar · Pilot B · 2026-10-23</p>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
